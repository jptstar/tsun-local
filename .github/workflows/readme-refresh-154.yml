name: Refresh TSUN Local 1.5.4 READMEs

on:
  push:
    branches:
      - docs/readme-refresh-1.5.4
    paths:
      - .github/workflows/readme-refresh-154.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: docs/readme-refresh-1.5.4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh all README languages
        run: |
          python .github/scripts/refresh_readmes_154.py
          python .github/scripts/finalize_readmes_154.py

      - name: Validate README update
        run: |
          python -m unittest discover -s tests -v
          git diff --check
          grep -q '`Sunology PLAY2`' README.md
          grep -q 'ha-solarman' README.md
          grep -q 'Nouveau dans la 1.5.4' docs/README_FR.md
          ! grep -q 'sensor_list=0x02B0' README.md
          ! grep -q 'LSW5BLE_17_02B0_1.08-D1' README.md

      - name: Remove temporary maintenance files
        run: |
          rm .github/scripts/refresh_readmes_154.py
          rm .github/scripts/finalize_readmes_154.py
          rm .github/workflows/readme-refresh-154.yml

      - name: Commit clean README refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh and simplify 1.5.4 READMEs'
          git push origin HEAD:docs/readme-refresh-1.5.4

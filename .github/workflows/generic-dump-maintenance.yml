name: Generic dump maintenance

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generic-dump-maintenance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean 3026 branch
        uses: actions/checkout@v6
        with:
          ref: diagnostic/2.8.0-experimental-3026-clean
          fetch-depth: 0

      - name: Update diagnostic version contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_tsun_dump_tool.py")
          text = path.read_text(encoding="utf-8")
          old = 'self.assertEqual(TOOL.TOOL_VERSION, "2.7.5")'
          new = 'self.assertEqual(TOOL.TOOL_VERSION, "2.8.0")'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one old version assertion, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit to clean PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tsun_dump_tool.py
          git commit -m "Update diagnostic version contract for 2.8.0"
          git push origin HEAD:diagnostic/2.8.0-experimental-3026-clean

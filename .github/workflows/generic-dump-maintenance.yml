name: Integrate Tuya OEM diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generic-dump-maintenance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Integrate Tuya discovery into diagnostic
        run: python tools/_generic_dump_patch.py

      - name: Validate diagnostic tool
        shell: bash
        run: |
          python -m py_compile tools/tsun_dump.py
          python tools/tsun_dump.py --help >/dev/null
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path("tools/tsun_dump.py")
          spec = importlib.util.spec_from_file_location("tsun_dump", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module.TOOL_VERSION == "2.8.4"
          assert module.TUYA_TCP_PORT == 6668
          assert module.TUYA_UDP_PORTS == (6666, 6667, 7000)
          assert module._tuya_framing(b"\x00\x00\x55\xaa\x00", 6666) == "tuya-55aa"
          assert module._tuya_framing(b"\x00\x00\x66\x99\x00", 7000) == "tuya-6699"

          device = module.DiscoveryDevice(host="192.0.2.10")
          device.tuya_6668_open = True
          metadata = module._tuya_candidate_metadata(device)
          assert metadata["transport_kind"] == "tuya_oem_candidate"
          assert metadata["tuya_tcp_6668"] is True

          lower = path.read_text(encoding="utf-8").lower()
          assert "tuya/thingclips" in lower
          assert "local key" in lower
          PY
          git diff --check

      - name: Commit and publish branch
        shell: bash
        run: |
          rm -f tools/_generic_dump_patch.py tools/poolex_tuya_probe.py .github/workflows/generic-dump-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Tuya OEM discovery into diagnostic"
          git push --force origin HEAD:diagnostic/2.8.4-tuya-oem

name: Generic dump maintenance

on:
  push:
    branches:
      - generic-dump-maintenance-run
    paths:
      - ".github/workflows/generic-dump-maintenance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply generic dump update
        run: python tools/_generic_dump_patch.py

      - name: Validate dump tool
        shell: bash
        run: |
          python -m py_compile tools/tsun_dump.py
          python tools/tsun_dump.py --help >/dev/null
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path("tools/tsun_dump.py")
          spec = importlib.util.spec_from_file_location("tsun_dump", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module._smartlink_serial_candidates(
              b'{"mid":"1234567890","mac":"00:00:00:00:00:00","ip":"192.0.2.10"}'
          ) == {1234567890}
          assert module._smartlink_serial_candidates(
              b'smart_config##00:00:00:00:00:00##192.0.2.10##1234567890'
          ) == {1234567890}

          lower = path.read_text(encoding="utf-8").lower()
          forbidden = ("sunology", "play2", "dca31")
          assert not any(term in lower for term in forbidden)
          PY
          git diff --check

      - name: Commit and publish
        shell: bash
        run: |
          rm -f tools/_generic_dump_patch.py .github/workflows/generic-dump-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve generic SmartLink discovery diagnostics"
          git push origin HEAD:main

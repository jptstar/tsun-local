name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  tag:
    name: Publish stable release
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify version metadata
        id: version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/tsun_local/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest["version"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          with Path("release_version.txt").open("w", encoding="utf-8") as file:
              file.write(version)
          print(f"Version {version} is consistent")
          PY
          echo "version=$(cat release_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Create stable tag if needed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Version ${VERSION}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG}" --verify-tag --generate-notes --title "Version ${VERSION}"

  release:
    name: Verify and publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify version metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          manifest_path = Path("custom_components/tsun_local/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if manifest["version"] != version:
              raise SystemExit(
                  f"Tag {tag} does not match manifest version {manifest['version']}"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")

          print(f"Version {version} is consistent")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; nothing to do."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Version ${GITHUB_REF_NAME#v}"

name: Publish release

on:
  push:
    branches:
      - main
      - beta-1097
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

jobs:
  beta:
    name: Publish beta release
    if: github.ref == 'refs/heads/beta-1097' && contains(github.event.head_commit.message, '[beta-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify beta version metadata
        id: version
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/tsun_local/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest["version"]
          if re.fullmatch(r"\d+\.\d+\.\d+-beta\.\d+", version) is None:
              raise SystemExit(f"{version!r} is not a beta release version")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          notes = Path("docs/releases") / f"{version}.md"
          if not notes.is_file():
              raise SystemExit(f"Missing beta release notes: {notes}")
          Path("release_version.txt").write_text(version, encoding="utf-8")
          print(f"Beta version {version} is consistent")
          PY
          echo "version=$(cat release_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Run beta unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate beta HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate beta Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Create beta tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to move a published beta tag."
          else
            git tag -a "${TAG}" -m "Version ${VERSION}"
            git push origin "${TAG}"
          fi

      - name: Create beta GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          NOTES="docs/releases/${VERSION}.md"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG}" --verify-tag --prerelease --title "Version ${VERSION}" --notes-file "${NOTES}"

  tag:
    name: Publish stable release
    if: github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release-notes]') || contains(github.event.head_commit.message, '[release-retag]'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect republish generator
        id: republish
        run: |
          if [ -f .github/scripts/republish_1_4_0.py ]; then
            echo "generator=true" >> "$GITHUB_OUTPUT"
          else
            echo "generator=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python for republish validation
        if: contains(github.event.head_commit.message, '[release-retag]')
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply stable 1.4.0 field corrections
        if: contains(github.event.head_commit.message, '[release-retag]') && steps.republish.outputs.generator == 'true'
        run: python3 .github/scripts/republish_1_4_0.py

      - name: Check corrected diff
        if: contains(github.event.head_commit.message, '[release-retag]')
        run: git diff --check

      - name: Run corrected unit tests
        if: contains(github.event.head_commit.message, '[release-retag]')
        run: python -m unittest discover -s tests -v

      - name: Validate corrected HACS repository
        if: contains(github.event.head_commit.message, '[release-retag]')
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate corrected Home Assistant integration
        if: contains(github.event.head_commit.message, '[release-retag]')
        uses: home-assistant/actions/hassfest@master

      - name: Commit corrected stable source to release branch
        if: contains(github.event.head_commit.message, '[release-retag]') && steps.republish.outputs.generator == 'true'
        run: |
          if git diff --quiet; then
            echo "No generated correction remains to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Republish TSUN Local 1.4.0 field corrections"
          git push --force origin HEAD:refs/heads/republish-1.4.0

      - name: Verify version metadata
        if: steps.republish.outputs.generator != 'true'
        id: version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/tsun_local/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest["version"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          with Path("release_version.txt").open("w", encoding="utf-8") as file:
              file.write(version)
          print(f"Version {version} is consistent")
          PY
          echo "version=$(cat release_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Create or refresh stable tag
        if: steps.republish.outputs.generator != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RETAG: ${{ contains(github.event.head_commit.message, '[release-retag]') }}
        run: |
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${RETAG}" = "true" ]; then
            echo "Refreshing ${TAG} on corrected stable source $(git rev-parse HEAD)."
            git tag -fa "${TAG}" -m "Version ${VERSION}"
            git push origin "refs/tags/${TAG}" --force
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git tag -a "${TAG}" -m "Version ${VERSION}"
            git push origin "${TAG}"
          fi

      - name: Create or update GitHub Release
        if: steps.republish.outputs.generator != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SYNC_RELEASE_NOTES: ${{ contains(github.event.head_commit.message, '[release-notes]') }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${SYNC_RELEASE_NOTES}" = "true" ]; then
            while IFS= read -r NOTES; do
              [ -n "${NOTES}" ] || continue
              NOTE_VERSION="$(basename "${NOTES}" .md)"
              NOTE_TAG="v${NOTE_VERSION}"
              if gh release view "${NOTE_TAG}" >/dev/null 2>&1; then
                gh release edit "${NOTE_TAG}" --title "Version ${NOTE_VERSION}" --notes-file "${NOTES}"
                echo "Updated ${NOTE_TAG} from ${NOTES}."
              else
                echo "Release ${NOTE_TAG} does not exist; skipping notes sync."
              fi
            done < <(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'docs/releases/*.md')
            exit 0
          fi

          TAG="v${VERSION}"
          NOTES="docs/releases/${VERSION}.md"

          if [ -f "${NOTES}" ]; then
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release edit "${TAG}" --title "Version ${VERSION}" --notes-file "${NOTES}"
            else
              gh release create "${TAG}" --verify-tag --title "Version ${VERSION}" --notes-file "${NOTES}"
            fi
          else
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists and no version-specific notes file is present."
            else
              gh release create "${TAG}" --verify-tag --generate-notes --title "Version ${VERSION}"
            fi
          fi

  release:
    name: Verify and publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify version metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          manifest_path = Path("custom_components/tsun_local/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if manifest["version"] != version:
              raise SystemExit(
                  f"Tag {tag} does not match manifest version {manifest['version']}"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")

          print(f"Version {version} is consistent")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/${VERSION}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; nothing to do."
            exit 0
          fi
          EXTRA_ARGS=()
          case "${VERSION}" in
            *-beta.*) EXTRA_ARGS+=(--prerelease) ;;
          esac
          if [ -f "${NOTES}" ]; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag "${EXTRA_ARGS[@]}" --title "Version ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag "${EXTRA_ARGS[@]}" --generate-notes --title "Version ${VERSION}"
          fi

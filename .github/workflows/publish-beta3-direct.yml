name: Publish beta3 one-shot

on:
  push:
    branches:
      - beta-1097

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[beta3-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare changelog and verify metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/tsun_local/manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          if version != '1.6.1-beta.3':
              raise SystemExit(f'Unexpected manifest version: {version}')
          notes = Path('docs/releases/1.6.1-beta.3.md')
          if not notes.is_file():
              raise SystemExit('Missing beta.3 release notes')

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## [1.6.1-beta.3] - 2026-09-07\n'
          if heading not in text:
              marker = '## [1.6.0] - 2026-09-04\n'
              if marker not in text:
                  raise SystemExit('1.6.0 changelog marker not found')
              lines = [
                  '## [1.6.1-beta.3] - 2026-09-07',
                  '',
                  '### Fixed',
                  '',
                  '- Publish the first fresh `*_energy_today` value immediately after an offline midnight rollover instead of holding the locally generated `0 kWh` for an extra successful polling interval.',
                  '- Keep the local midnight reset to `0 kWh` while the inverter remains asleep/offline and keep total-energy restoration unchanged.',
                  '- Align one legacy 1511 unit-test fixture with the persistent-session transport already introduced in 1.6.1-beta.1; production 1511 transport code is unchanged by this correction.',
                  '',
                  '### Retained',
                  '',
                  '- Keep the 1097, 02B0 and 1511 communication-resilience changes from the previous 1.6.1 betas: healthy-cycle TCP session reuse, one bounded reconnect/retry, per-logger FIFO and adaptive polling.',
                  '- Keep all validated 02B0 and 1511 register coverage unchanged.',
                  '- Keep TSUN Local local and read-only with no inverter configuration or control writes.',
                  '',
                  '### Validation',
                  '',
                  '- Run the complete unit-test suite, HACS validation and Home Assistant Hassfest before publication.',
                  '',
                  '',
              ]
              section = '\n'.join(lines)
              path.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY

      - name: Run complete unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit release source, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git rm -f .github/workflows/prepare-beta3-changelog.yml || true
          git rm -f .github/workflows/publish-beta3-direct.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Publish TSUN Local 1.6.1-beta.3'
            git push origin HEAD:beta-1097
          fi

          TAG='v1.6.1-beta.3'
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; refusing to move it."
          else
            git tag -a "${TAG}" -m 'Version 1.6.1-beta.3'
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --verify-tag --prerelease --title 'Version 1.6.1-beta.3' --notes-file docs/releases/1.6.1-beta.3.md
          fi

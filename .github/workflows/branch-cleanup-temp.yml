name: One-time stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-time stale branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete stale branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            'beta/v1.6.0-beta.1-adaptive-polling' \
            'beta/v1.6.0-beta.2' \
            'site/v1.6.1-visible' \
            'sync/v1.6.1-main'
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

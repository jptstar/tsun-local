def _field_validation_name(key: str, language: str) -> str:
    """Return a localized display name while keeping the English entity key stable."""
    normalized = language.replace("_", "-").lower()
    names = (
        FIELD_VALIDATION_NAMES.get(normalized)
        or FIELD_VALIDATION_NAMES.get(normalized.split("-", 1)[0])
        or FIELD_VALIDATION_NAMES["en"]
    )
    return names.get(key, FIELD_VALIDATION_NAMES["en"].get(key, key))


'''

          marker = "COMMUNICATION_SENSOR_KEYS = frozenset(\n"
          if "FIELD_VALIDATION_NAMES:" not in source:
              if marker not in source:
                  raise SystemExit("sensor localization insertion marker not found")
              source = source.replace(marker, localization + marker, 1)

          init_marker = "        self.entity_description = description\n        logger_sn = str(entry.data[CONF_LOGGER_SN])\n"
          replacement = (
              "        self.entity_description = description\n"
              "        if description.key in FIELD_VALIDATION_NAMES[\"en\"]:\n"
              "            self._attr_name = _field_validation_name(\n"
              "                description.key, coordinator.hass.config.language\n"
              "            )\n"
              "        logger_sn = str(entry.data[CONF_LOGGER_SN])\n"
          )
          if "self._attr_name = _field_validation_name(" not in source:
              if init_marker not in source:
                  raise SystemExit("sensor entity initialization marker not found")
              source = source.replace(init_marker, replacement, 1)

          path.write_text(source, encoding="utf-8")

          Path("tests/test_field_validation_localization.py").write_text('''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\nimport unittest\n\nROOT = Path(__file__).parents[1]\nSENSOR = ROOT / "custom_components" / "tsun_local" / "sensor.py"\n\n\nclass FieldValidationLocalizationTests(unittest.TestCase):\n    def _names(self) -> dict[str, dict[str, str]]:\n        tree = ast.parse(SENSOR.read_text(encoding="utf-8"))\n        for node in tree.body:\n            if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):\n                if node.target.id == "FIELD_VALIDATION_NAMES":\n                    return ast.literal_eval(node.value)\n        self.fail("FIELD_VALIDATION_NAMES not found")\n\n    def test_all_eight_languages_cover_the_same_ten_keys(self) -> None:\n        names = self._names()\n        self.assertEqual(set(names), {"en", "fr", "de", "es", "it", "nl", "pl", "zh-hans"})\n        expected = set(names["en"])\n        self.assertEqual(len(expected), 10)\n        for language, translated in names.items():\n            self.assertEqual(set(translated), expected, language)\n            self.assertTrue(all(value.strip() for value in translated.values()))\n\n    def test_entity_keys_remain_stable_english_identifiers(self) -> None:\n        source = SENSOR.read_text(encoding="utf-8")\n        self.assertIn("suggested_object_id=key", source)\n        self.assertIn('self._attr_unique_id = f"{logger_sn}_{description.key}"', source)\n        self.assertIn("self._attr_name = _field_validation_name(", source)\n\n    def test_representative_localized_names_are_present(self) -> None:\n        names = self._names()\n        self.assertEqual(names["fr"]["grid_start_upper_voltage_limit"], "Limite supérieure de tension au démarrage")\n        self.assertEqual(names["de"]["grid_qp_voltage_threshold"], "QP-Spannungsschwelle")\n        self.assertEqual(names["zh-hans"]["grid_overfrequency_reduction_coefficient"], "过频降额系数")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

      - name: Commit localization fix and restore validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/validate.yml
          git rm -f .github/workflows/localize_beta_names_once.yml docs/.localize-beta-trigger || true
          git add custom_components/tsun_local/sensor.py tests/test_field_validation_localization.py .github/workflows/validate.yml
          git commit -m "Localize beta field-validation entity names"
          git push origin HEAD:beta-1097

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

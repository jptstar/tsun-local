name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-beta4:
    name: Prepare beta4 source
    if: github.event_name == 'pull_request' && github.head_ref == 'beta-1097' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply beta4 preparation
        run: |
          test -f .github/scripts/prepare_beta4.py
          python3 .github/scripts/prepare_beta4.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('custom_components/tsun_local/protocols/protocol_1511.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    data: dict[str, float | int] = {',
              '    data: dict[str, float | int | str] = {',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Check generated diff
        run: git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore normal validation workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 84280ca972161984eab3fd9ae8c805f5d8c9c271:.github/workflows/validate.yml > .github/workflows/validate.yml
          git rm -f .github/scripts/prepare_beta4.py .github/workflows/prepare-beta4.yml
          git add -A
          git commit -m "Prepare TSUN Local 1.5.1-beta.4"
          git push origin HEAD:beta-1097

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-pending-fixes:
    name: Apply pending alarm-name and coefficient fixes
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pending-alarm-fixes]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Apply staged corrections
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          component = root / 'custom_components' / 'tsun_local'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f'{label}: expected source text not found')
              return text.replace(old, new, 1)

          # 1511: raw 0x0FA0 / 4000 is interpreted as 40.00 %/Hz.
          protocol_path = component / 'protocols' / 'protocol_1511.py'
          protocol = protocol_path.read_text(encoding='utf-8')
          protocol = replace_once(
              protocol,
              '    "grid_overfrequency_reduction_coefficient": (0x07EF, 1.0),  # field validation\n',
              '    "grid_overfrequency_reduction_coefficient": (0x07EF, 0.01),  # field validation\n',
              '1511 overfrequency coefficient scaling',
          )
          protocol_path.write_text(protocol, encoding='utf-8')

          # Publish localized alarm names as a real Home Assistant sensor.
          sensor_path = component / 'sensor.py'
          sensor = sensor_path.read_text(encoding='utf-8')
          sensor = replace_once(
              sensor,
              'from .alarm_catalog import alarm_state_attributes\n',
              'from .alarm_catalog import active_alarm_state, alarm_state_attributes\n',
              'alarm catalog import',
          )
          sensor = replace_once(
              sensor,
              '''    _field_validation_diagnostic(\n        "grid_overfrequency_reduction_coefficient",\n        "grid_overfrequency_reduction_coefficient",\n        precision=0,\n        state_class=None,\n    ),\n''',
              '''    _field_validation_diagnostic(\n        "grid_overfrequency_reduction_coefficient",\n        "grid_overfrequency_reduction_coefficient",\n        unit="%/Hz",\n        precision=2,\n        state_class=None,\n    ),\n''',
              'coefficient sensor metadata',
          )
          alarm_count_block = '''    TsunSensorDescription(\n        key="alarm_active_count",\n        suggested_object_id="alarm_active_count",\n        translation_key="alarm_active_count",\n        state_class=SensorStateClass.MEASUREMENT,\n        icon="mdi:alert-circle-outline",\n    ),\n'''
          active_names_block = alarm_count_block + '''    TsunSensorDescription(\n        key="active_alarm_names",\n        suggested_object_id="active_alarm_names",\n        translation_key="active_alarm_names",\n        icon="mdi:alert-circle",\n    ),\n'''
          sensor = replace_once(
              sensor,
              alarm_count_block,
              active_names_block,
              'active_alarm_names entity description',
          )
          sensor = replace_once(
              sensor,
              '''                description.key in DIAGNOSTIC_SENSOR_KEYS\n                or description.key in coordinator.client.measurement_keys\n            )\n''',
              '''                description.key in DIAGNOSTIC_SENSOR_KEYS\n                or description.key in coordinator.client.measurement_keys\n                or (\n                    description.key == "active_alarm_names"\n                    and str(\n                        getattr(coordinator.client, "protocol_name", "")\n                    ) == "1511"\n                    and "alarm_active" in coordinator.client.measurement_keys\n                )\n            )\n''',
              'dynamic entity inclusion',
          )
          sensor = replace_once(
              sensor,
              '''        if self.entity_description.key == "label_serial_number":\n            return self._label_serial_number\n        return self.coordinator.data.get(self.entity_description.key)\n''',
              '''        if self.entity_description.key == "label_serial_number":\n            return self._label_serial_number\n        if self.entity_description.key == "active_alarm_names":\n            return active_alarm_state(\n                self.coordinator.data,\n                self.coordinator.hass.config.language,\n            )\n        return self.coordinator.data.get(self.entity_description.key)\n''',
              'active alarm names native value',
          )
          sensor = replace_once(
              sensor,
              '''        if self.entity_description.key == "alarm_active_count":\n            return alarm_state_attributes(\n                self.coordinator.data,\n                self.coordinator.hass.config.language,\n            )\n        address = self._source_register_address()\n''',
              '''        if self.entity_description.key == "active_alarm_names":\n            attributes = alarm_state_attributes(\n                self.coordinator.data,\n                self.coordinator.hass.config.language,\n            )\n            return {"active_alarm_names": attributes["active_alarm_names"]}\n        if self.entity_description.key == "alarm_active_count":\n            return alarm_state_attributes(\n                self.coordinator.data,\n                self.coordinator.hass.config.language,\n            )\n        address = self._source_register_address()\n''',
              'active alarm names attributes',
          )
          sensor_path.write_text(sensor, encoding='utf-8')

          # Alarm catalogue: keep Axxx as internal/debug codes, but do not put
          # those codes in the user-facing alarm wording. Add localized empty
          # state and a bounded text state for the new entity.
          catalog_path = component / 'alarm_catalog.py'
          catalog = catalog_path.read_text(encoding='utf-8')
          no_alarm = {
              'en': 'No active alarm',
              'fr': 'Aucune alarme active',
              'de': 'Kein aktiver Alarm',
              'es': 'Ninguna alarma activa',
              'it': 'Nessun allarme attivo',
              'nl': 'Geen actief alarm',
              'pl': 'Brak aktywnych alarmów',
              'zh-hans': '无活动报警',
          }
          for language, wording in no_alarm.items():
              marker = f'    "{language}": {{\n'
              start = catalog.index(marker)
              dsp_pos = catalog.index('"pv_dsp_fault":', start)
              line_end = catalog.index('\n', dsp_pos) + 1
              insertion = f'        "no_active_alarm": {json.dumps(wording, ensure_ascii=False)},\n'
              if insertion not in catalog[start:]:
                  catalog = catalog[:line_end] + insertion + catalog[line_end:]

          catalog = catalog.replace(' ({code})', '')
          catalog = catalog.replace('（{code}）', '')

          state_function = '''\n\ndef active_alarm_state(\n    measurements: dict[str, Any], language: str\n) -> str:\n    """Return a localized, bounded state string for active alarm names."""\n    active = decode_active_alarms(measurements, language)\n    if not active:\n        return _language_texts(language)["no_active_alarm"]\n\n    names = [alarm.name for alarm in active]\n    state = names[0]\n    for index, name in enumerate(names[1:], start=1):\n        candidate = f"{state} · {name}"\n        if len(candidate) <= 255:\n            state = candidate\n            continue\n        remaining = len(names) - index\n        suffix = f" · +{remaining}"\n        room = max(0, 255 - len(suffix))\n        return f"{state[:room].rstrip()}{suffix}"[:255]\n    return state[:255]\n'''
          marker = '\n\ndef alarm_state_attributes(\n'
          if 'def active_alarm_state(' not in catalog:
              if marker not in catalog:
                  raise SystemExit('alarm_state_attributes insertion marker not found')
              catalog = catalog.replace(marker, state_function + marker, 1)
          catalog_path.write_text(catalog, encoding='utf-8')

          # Home Assistant display-name translations. Technical keys/IDs stay English.
          entity_names = {
              'strings.json': 'Active alarm names',
              'en.json': 'Active alarm names',
              'fr.json': 'Noms des alarmes actives',
              'de.json': 'Namen aktiver Alarme',
              'es.json': 'Nombres de alarmas activas',
              'it.json': 'Nomi degli allarmi attivi',
              'nl.json': 'Namen van actieve alarmen',
              'pl.json': 'Nazwy aktywnych alarmów',
              'zh-Hans.json': '活动报警名称',
          }
          json_paths = [component / 'strings.json', *sorted((component / 'translations').glob('*.json'))]
          for path in json_paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              label = entity_names[path.name]
              data.setdefault('entity', {}).setdefault('sensor', {})['active_alarm_names'] = {'name': label}
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Regression tests for the 0.01 scaling and user-facing alarm text.
          field_test_path = root / 'tests' / 'test_mp3000_field_validation.py'
          field_test = field_test_path.read_text(encoding='utf-8')
          field_test = field_test.replace(
              '"grid_overfrequency_reduction_coefficient": (0x07EF, 1.0),',
              '"grid_overfrequency_reduction_coefficient": (0x07EF, 0.01),',
          )
          field_test = field_test.replace(
              'decoded["grid_overfrequency_reduction_coefficient"], 4000.0',
              'decoded["grid_overfrequency_reduction_coefficient"], 40.0',
          )
          field_test_path.write_text(field_test, encoding='utf-8')

          alarm_test_path = root / 'tests' / 'test_alarm_catalog.py'
          alarm_test = alarm_test_path.read_text(encoding='utf-8')
          alarm_test = alarm_test.replace(
              '"Alarme onduleur non identifiée (A003)",',
              '"Alarme onduleur non identifiée",',
          )
          if 'test_active_alarm_state_is_localized_and_code_free' not in alarm_test:
              insert_before = '    def test_all_supported_languages_have_complete_wording(self) -> None:\n'
              new_test = '''    def test_active_alarm_state_is_localized_and_code_free(self) -> None:\n        self.assertEqual(\n            CATALOGUE.active_alarm_state({"pv1_alarm_raw": 1 << 10}, "fr"),\n            "Défaut du DSP PV1",\n        )\n        self.assertEqual(CATALOGUE.active_alarm_state({}, "fr"), "Aucune alarme active")\n        unknown = CATALOGUE.active_alarm_state(\n            {"alarm_global_0_raw": 1 << 2}, "fr"\n        )\n        self.assertEqual(unknown, "Alarme onduleur non identifiée")\n        self.assertNotIn("A003", unknown)\n\n    def test_active_alarm_state_is_bounded_for_many_alarms(self) -> None:\n        measurements = {\n            source.key: 0xFFFF for source in CATALOGUE.ALARM_SOURCES\n        }\n        state = CATALOGUE.active_alarm_state(measurements, "fr")\n        self.assertLessEqual(len(state), 255)\n\n'''
              if insert_before not in alarm_test:
                  raise SystemExit('alarm test insertion marker not found')
              alarm_test = alarm_test.replace(insert_before, new_test + insert_before, 1)
          alarm_test_path.write_text(alarm_test, encoding='utf-8')

          coverage_path = root / 'tests' / 'test_translation_coverage.py'
          coverage = coverage_path.read_text(encoding='utf-8')
          if 'test_active_alarm_names_entity_is_declared' not in coverage:
              marker = '    def test_removed_candidate_is_not_exposed(self) -> None:\n'
              test = '''    def test_active_alarm_names_entity_is_declared(self) -> None:\n        source = (COMPONENT / "sensor.py").read_text(encoding="utf-8")\n        self.assertIn('key="active_alarm_names"', source)\n        self.assertIn('translation_key="active_alarm_names"', source)\n        self.assertIn('suggested_object_id="active_alarm_names"', source)\n\n'''
              if marker not in coverage:
                  raise SystemExit('translation coverage insertion marker not found')
              coverage = coverage.replace(marker, test + marker, 1)
          coverage_path.write_text(coverage, encoding='utf-8')

          # Documentation staged for the next beta; no version/tag publication here.
          entities_path = root / 'docs' / 'ENTITIES.md'
          entities = entities_path.read_text(encoding='utf-8')
          entities = entities.replace(
              '| Power and capacity diagnostics | 3 | rated power, maximum designed power, candidate power level |',
              '| Power and capacity diagnostics | 2 | rated power, maximum designed power |',
          )
          entities = entities.replace(
              '| Alarm interface | 16 | inverter alarm, active-alarm count, 14 complete raw words |',
              '| Alarm interface | 17 | inverter alarm, active-alarm count, active alarm names, 14 complete raw words |',
          )
          entities = entities.replace(
              '| **Total** | **105** | **55 enabled by default · 50 advanced/disabled by default** |',
              '| **Total** | **105** | **56 enabled by default · 49 advanced/disabled by default** |',
          )
          entities = entities.replace(
              'Active positions are presented through the alarm state and count;',
              'Active positions are presented through the alarm state, localized alarm-name sensor and count;',
          )
          count_row = '| `alarm_active_count` | Active alarms | ✅ |\n'
          names_row = count_row + '| `active_alarm_names` | Active alarm names | ✅ |\n'
          if '| `active_alarm_names` |' not in entities:
              entities = entities.replace(count_row, names_row, 1)
          entities = entities.replace(
              'The `alarm_active_count` entity lists the localized names and stable local codes of current alarms.',
              'The `active_alarm_names` entity publishes the localized alarm text directly; `alarm_active_count` remains the numeric count. Stable Axxx codes are retained only as internal/debug identifiers.',
          )
          entities = entities.replace(
              '| `grid_overfrequency_reduction_coefficient` | Overfrequency reduction coefficient | `2031 / 0x07EF` | raw |',
              '| `grid_overfrequency_reduction_coefficient` | Overfrequency reduction coefficient | `2031 / 0x07EF` | %/Hz · ×0.01 (`4000` → `40.00`) |',
          )
          entities_path.write_text(entities, encoding='utf-8')

          validation_path = root / 'docs' / 'MP3000_FIELD_VALIDATION.md'
          validation = validation_path.read_text(encoding='utf-8')
          validation = validation.replace(
              '| `grid_overfrequency_reduction_coefficient` | Overfrequency Reduction Coefficient / Coefficient de Réduction de Surfréquence | 2031 (`0x07EF`) | raw | `0x0FA0` / 4000 |',
              '| `grid_overfrequency_reduction_coefficient` | Overfrequency Reduction Coefficient / Coefficient de Réduction de Surfréquence | 2031 (`0x07EF`) | × 0.01 %/Hz | `0x0FA0` / 4000 → 40.00 %/Hz |',
          )
          validation_path.write_text(validation, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'Home Assistant shows one clear **Inverter alarm** state plus an **Active alarms** count and list.',
              'Home Assistant shows one clear **Inverter alarm** state, an **Active alarms** count, and a dedicated **Active alarm names** sensor containing the localized alarm text.',
          )
          readme_path.write_text(readme, encoding='utf-8')

          # Remove the one-shot trigger and restore the normal validation workflow.
          trigger = root / '.github' / 'pending-alarm-fixes.trigger'
          if trigger.exists():
              trigger.unlink()
          standard_workflow = '''name: Validate\n\non:\n  push:\n  pull_request:\n  schedule:\n    - cron: "0 0 * * *"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  unit-tests:\n    name: Unit tests\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v6\n\n      - name: Set up Python\n        uses: actions/setup-python@v6\n        with:\n          python-version: "3.13"\n\n      - name: Run tests\n        run: python -m unittest discover -s tests -v\n\n  hacs:\n    name: HACS\n    runs-on: ubuntu-latest\n    steps:\n      - name: Validate HACS repository\n        uses: hacs/action@main\n        with:\n          category: integration\n\n  hassfest:\n    name: Hassfest\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v6\n\n      - name: Validate Home Assistant integration\n        uses: home-assistant/actions/hassfest@master\n'''
          (root / '.github' / 'workflows' / 'validate.yml').write_text(
              standard_workflow, encoding='utf-8'
          )
          PY

      - name: Run unit tests on staged corrections
        run: python -m unittest discover -s tests -v

      - name: Commit staged corrections without publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage alarm-name entity and overfrequency coefficient fix"
          git push origin beta-1097

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  fix-1511-test-fixture:
    name: Update 1511 session test fixture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out work branch
        uses: actions/checkout@v6
        with:
          ref: fix/energy-first-fresh-poll-work
          fetch-depth: 0

      - name: Update stale single-response fixture and commit
        run: |
          if grep -q 'client._last_diagnostic_read = float("inf")' tests/test_protocols.py; then
            echo "Fixture already updated."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/test_protocols.py")
          source = path.read_text(encoding="utf-8")
          old = '''        responses = iter(
            build_reply(block) for block in (*BLOCKS_1511, *BLOCKS_1511_ALARM)
        )

        class FakeReader:
            def __init__(self, response: bytes) -> None:
                self.response = response
                self.offset = 0

            async def readexactly(self, size: int) -> bytes:
                result = self.response[self.offset : self.offset + size]
                self.offset += size
                return result

        class FakeWriter:
            def write(self, _request: bytes) -> None:
                pass

            async def drain(self) -> None:
                pass

            def close(self) -> None:
                pass

            async def wait_closed(self) -> None:
                pass

        async def open_connection(_host: str, _port: int):
            return FakeReader(next(responses)), FakeWriter()

        protocol_module = sys.modules["tsun_local_protocol_tests.protocol_1511"]
        with patch.object(
            protocol_module.asyncio, "open_connection", new=open_connection
        ):
            client = Tsun1511Client("192.0.2.10", 8899, 123456)
            result = await client.async_read_all()
'''
          new = '''        response = b"".join(
            build_reply(block) for block in (*BLOCKS_1511, *BLOCKS_1511_ALARM)
        )

        class FakeReader:
            def __init__(self, response: bytes) -> None:
                self.response = response
                self.offset = 0

            async def readexactly(self, size: int) -> bytes:
                result = self.response[self.offset : self.offset + size]
                self.offset += size
                return result

        class FakeWriter:
            def write(self, _request: bytes) -> None:
                pass

            async def drain(self) -> None:
                pass

            def close(self) -> None:
                pass

            async def wait_closed(self) -> None:
                pass

        async def open_connection(_host: str, _port: int):
            return FakeReader(response), FakeWriter()

        protocol_module = sys.modules["tsun_local_protocol_tests.protocol_1511"]
        with patch.object(
            protocol_module.asyncio, "open_connection", new=open_connection
        ):
            client = Tsun1511Client("192.0.2.10", 8899, 123456)
            client._last_diagnostic_read = float("inf")
            result = await client.async_read_all()
'''
          if old not in source:
              raise SystemExit("Expected stale 1511 test fixture not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python -m unittest discover -s tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_protocols.py
          git commit -m "Align legacy 1511 test fixture with persistent session transport"
          git push origin HEAD:fix/energy-first-fresh-poll-work

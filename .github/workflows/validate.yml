name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standard-localize:
    name: Apply standard entity translations once
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[standard-localize]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Convert beta diagnostic names to Home Assistant translations
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          INTEGRATION = ROOT / 'custom_components' / 'tsun_local'

          names = {
              'en': {
                  'grid_qp_voltage_threshold': 'QP voltage threshold',
                  'grid_recovery_rate': 'Grid recovery time',
                  'grid_overvoltage_10min': '10-minute grid overvoltage protection',
                  'grid_overfrequency_reduction_frequency': 'Overfrequency reduction value',
                  'grid_overfrequency_reduction_coefficient': 'Overfrequency reduction coefficient',
                  'overtemperature_protection_temperature': 'Overtemperature protection threshold',
                  'grid_start_upper_voltage_limit': 'Upper startup voltage limit',
                  'grid_start_lower_voltage_limit': 'Lower startup voltage limit',
                  'grid_start_upper_frequency_limit': 'Upper startup frequency limit',
                  'grid_start_lower_frequency_limit': 'Lower startup frequency limit',
              },
              'fr': {
                  'grid_qp_voltage_threshold': 'Seuil de tension QP',
                  'grid_recovery_rate': 'Temps de récupération réseau',
                  'grid_overvoltage_10min': 'Protection surtension réseau 10 minutes',
                  'grid_overfrequency_reduction_frequency': 'Valeur de réduction de surfréquence',
                  'grid_overfrequency_reduction_coefficient': 'Coefficient de réduction de surfréquence',
                  'overtemperature_protection_temperature': 'Seuil de protection contre la surtempérature',
                  'grid_start_upper_voltage_limit': 'Limite supérieure de tension au démarrage',
                  'grid_start_lower_voltage_limit': 'Limite inférieure de tension au démarrage',
                  'grid_start_upper_frequency_limit': 'Limite supérieure de fréquence au démarrage',
                  'grid_start_lower_frequency_limit': 'Limite inférieure de fréquence au démarrage',
              },
              'de': {
                  'grid_qp_voltage_threshold': 'QP-Spannungsschwelle',
                  'grid_recovery_rate': 'Netz-Wiederherstellungszeit',
                  'grid_overvoltage_10min': '10-Minuten-Netzüberspannungsschutz',
                  'grid_overfrequency_reduction_frequency': 'Wert der Überfrequenz-Leistungsreduzierung',
                  'grid_overfrequency_reduction_coefficient': 'Koeffizient der Überfrequenz-Leistungsreduzierung',
                  'overtemperature_protection_temperature': 'Übertemperatur-Schutzschwelle',
                  'grid_start_upper_voltage_limit': 'Obere Startspannungsgrenze',
                  'grid_start_lower_voltage_limit': 'Untere Startspannungsgrenze',
                  'grid_start_upper_frequency_limit': 'Obere Startfrequenzgrenze',
                  'grid_start_lower_frequency_limit': 'Untere Startfrequenzgrenze',
              },
              'es': {
                  'grid_qp_voltage_threshold': 'Umbral de tensión QP',
                  'grid_recovery_rate': 'Tiempo de recuperación de red',
                  'grid_overvoltage_10min': 'Protección de sobretensión de red de 10 minutos',
                  'grid_overfrequency_reduction_frequency': 'Valor de reducción por sobrefrecuencia',
                  'grid_overfrequency_reduction_coefficient': 'Coeficiente de reducción por sobrefrecuencia',
                  'overtemperature_protection_temperature': 'Umbral de protección por sobretemperatura',
                  'grid_start_upper_voltage_limit': 'Límite superior de tensión de arranque',
                  'grid_start_lower_voltage_limit': 'Límite inferior de tensión de arranque',
                  'grid_start_upper_frequency_limit': 'Límite superior de frecuencia de arranque',
                  'grid_start_lower_frequency_limit': 'Límite inferior de frecuencia de arranque',
              },
              'it': {
                  'grid_qp_voltage_threshold': 'Soglia tensione QP',
                  'grid_recovery_rate': 'Tempo di ripristino rete',
                  'grid_overvoltage_10min': 'Protezione sovratensione rete 10 minuti',
                  'grid_overfrequency_reduction_frequency': 'Valore riduzione sovrafrequenza',
                  'grid_overfrequency_reduction_coefficient': 'Coefficiente riduzione sovrafrequenza',
                  'overtemperature_protection_temperature': 'Soglia protezione sovratemperatura',
                  'grid_start_upper_voltage_limit': 'Limite superiore tensione di avvio',
                  'grid_start_lower_voltage_limit': 'Limite inferiore tensione di avvio',
                  'grid_start_upper_frequency_limit': 'Limite superiore frequenza di avvio',
                  'grid_start_lower_frequency_limit': 'Limite inferiore frequenza di avvio',
              },
              'nl': {
                  'grid_qp_voltage_threshold': 'QP-spanningsdrempel',
                  'grid_recovery_rate': 'Nethersteltijd',
                  'grid_overvoltage_10min': '10-minuten-netoverspanningsbeveiliging',
                  'grid_overfrequency_reduction_frequency': 'Waarde overfrequentiereductie',
                  'grid_overfrequency_reduction_coefficient': 'Coëfficiënt overfrequentiereductie',
                  'overtemperature_protection_temperature': 'Drempel overtemperatuurbeveiliging',
                  'grid_start_upper_voltage_limit': 'Bovengrens startspanning',
                  'grid_start_lower_voltage_limit': 'Ondergrens startspanning',
                  'grid_start_upper_frequency_limit': 'Bovengrens startfrequentie',
                  'grid_start_lower_frequency_limit': 'Ondergrens startfrequentie',
              },
              'pl': {
                  'grid_qp_voltage_threshold': 'Próg napięcia QP',
                  'grid_recovery_rate': 'Czas przywracania sieci',
                  'grid_overvoltage_10min': '10-minutowe zabezpieczenie nadnapięciowe sieci',
                  'grid_overfrequency_reduction_frequency': 'Wartość redukcji przy nadczęstotliwości',
                  'grid_overfrequency_reduction_coefficient': 'Współczynnik redukcji przy nadczęstotliwości',
                  'overtemperature_protection_temperature': 'Próg zabezpieczenia nadtemperaturowego',
                  'grid_start_upper_voltage_limit': 'Górna granica napięcia rozruchowego',
                  'grid_start_lower_voltage_limit': 'Dolna granica napięcia rozruchowego',
                  'grid_start_upper_frequency_limit': 'Górna granica częstotliwości rozruchowej',
                  'grid_start_lower_frequency_limit': 'Dolna granica częstotliwości rozruchowej',
              },
              'zh-Hans': {
                  'grid_qp_voltage_threshold': 'QP 电压阈值',
                  'grid_recovery_rate': '电网恢复时间',
                  'grid_overvoltage_10min': '10 分钟电网过压保护',
                  'grid_overfrequency_reduction_frequency': '过频降额值',
                  'grid_overfrequency_reduction_coefficient': '过频降额系数',
                  'overtemperature_protection_temperature': '过温保护阈值',
                  'grid_start_upper_voltage_limit': '启动电压上限',
                  'grid_start_lower_voltage_limit': '启动电压下限',
                  'grid_start_upper_frequency_limit': '启动频率上限',
                  'grid_start_lower_frequency_limit': '启动频率下限',
              },
          }

          # Convert the ten descriptions from hard-coded English names to
          # translation keys, without changing key/suggested_object_id/unique_id.
          sensor_path = INTEGRATION / 'sensor.py'
          source = sensor_path.read_text(encoding='utf-8')
          source = source.replace(
              'def _field_validation_diagnostic(\n    key: str,\n    name: str,',
              'def _field_validation_diagnostic(\n    key: str,\n    translation_key: str,',
              1,
          )
          source = source.replace(
              '        name=name,\n        device_class=device_class,',
              '        translation_key=translation_key,\n        device_class=device_class,',
              1,
          )
          english_call_names = {
              'grid_qp_voltage_threshold': 'QP voltage threshold',
              'grid_recovery_rate': 'Recovery rate',
              'grid_overvoltage_10min': 'Grid Over Voltage 10 Minutes Protection',
              'grid_overfrequency_reduction_frequency': 'Overfrequency reduction value',
              'grid_overfrequency_reduction_coefficient': 'Overfrequency reduction coefficient',
              'overtemperature_protection_temperature': 'Overtemperature protection value',
              'grid_start_upper_voltage_limit': 'Upper startup voltage limit',
              'grid_start_lower_voltage_limit': 'Lower startup voltage limit',
              'grid_start_upper_frequency_limit': 'Upper startup frequency limit',
              'grid_start_lower_frequency_limit': 'Lower startup frequency limit',
          }
          for key, old_name in english_call_names.items():
              old = f'        "{key}",\n        "{old_name}",'
              new = f'        "{key}",\n        "{key}",'
              if old not in source:
                  raise SystemExit(f'Expected field-validation call not found: {key}')
              source = source.replace(old, new, 1)
          sensor_path.write_text(source, encoding='utf-8')

          # Remove the temporary runtime localization layer; standard Home
          # Assistant translation keys now handle all display names.
          init_path = INTEGRATION / '__init__.py'
          init_source = init_path.read_text(encoding='utf-8')
          init_source = init_source.replace(
              'from .field_validation_localization import apply_field_validation_names\n',
              '',
          )
          init_source = init_source.replace(
              '    apply_field_validation_names(hass.config.language)\n',
              '',
          )
          init_path.write_text(init_source, encoding='utf-8')

          runtime_module = INTEGRATION / 'field_validation_localization.py'
          if runtime_module.exists():
              runtime_module.unlink()

          # English source strings.
          strings_path = INTEGRATION / 'strings.json'
          strings = json.loads(strings_path.read_text(encoding='utf-8'))
          sensors = strings['entity']['sensor']
          for key, value in names['en'].items():
              sensors[key] = {'name': value}
          strings_path.write_text(
              json.dumps(strings, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          file_languages = {
              'en.json': 'en',
              'fr.json': 'fr',
              'de.json': 'de',
              'es.json': 'es',
              'it.json': 'it',
              'nl.json': 'nl',
              'pl.json': 'pl',
              'zh-Hans.json': 'zh-Hans',
          }
          for filename, language in file_languages.items():
              path = INTEGRATION / 'translations' / filename
              document = json.loads(path.read_text(encoding='utf-8'))
              translated = document['entity']['sensor']
              for key, value in names[language].items():
                  translated[key] = {'name': value}
              path.write_text(
                  json.dumps(document, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          # Replace the temporary runtime-localization test with a regression
          # test for actual HA translation-key coverage and stable identifiers.
          test_path = ROOT / 'tests' / 'test_field_validation_localization.py'
          test_path.write_text('''# Copyright (C) 2026 Jean-Philippe TESTART (jptstar)\n# SPDX-License-Identifier: GPL-3.0-or-later\n\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\nimport unittest\n\nROOT = Path(__file__).parents[1]\nINTEGRATION = ROOT / "custom_components" / "tsun_local"\nKEYS = {\n    "grid_qp_voltage_threshold",\n    "grid_recovery_rate",\n    "grid_overvoltage_10min",\n    "grid_overfrequency_reduction_frequency",\n    "grid_overfrequency_reduction_coefficient",\n    "overtemperature_protection_temperature",\n    "grid_start_upper_voltage_limit",\n    "grid_start_lower_voltage_limit",\n    "grid_start_upper_frequency_limit",\n    "grid_start_lower_frequency_limit",\n}\n\n\nclass FieldValidationLocalizationTests(unittest.TestCase):\n    def test_all_eight_translation_files_have_the_ten_names(self) -> None:\n        for filename in (\n            "en.json", "fr.json", "de.json", "es.json",\n            "it.json", "nl.json", "pl.json", "zh-Hans.json",\n        ):\n            document = json.loads(\n                (INTEGRATION / "translations" / filename).read_text(encoding="utf-8")\n            )\n            sensors = document["entity"]["sensor"]\n            self.assertTrue(KEYS <= set(sensors), filename)\n            self.assertTrue(\n                all(sensors[key]["name"].strip() for key in KEYS), filename\n            )\n\n    def test_source_strings_have_the_same_ten_keys(self) -> None:\n        strings = json.loads((INTEGRATION / "strings.json").read_text(encoding="utf-8"))\n        self.assertTrue(KEYS <= set(strings["entity"]["sensor"]))\n\n    def test_field_validation_descriptions_use_translation_keys(self) -> None:\n        source = (INTEGRATION / "sensor.py").read_text(encoding="utf-8")\n        self.assertIn("translation_key=translation_key", source)\n        self.assertNotIn("name=name", source)\n        for key in KEYS:\n            self.assertIn(f'"{key}",\\n        "{key}",', source)\n\n    def test_entity_identifiers_remain_stable_english(self) -> None:\n        source = (INTEGRATION / "sensor.py").read_text(encoding="utf-8")\n        self.assertIn("suggested_object_id=key", source)\n        self.assertIn(\n            'self._attr_unique_id = f"{logger_sn}_{description.key}"', source\n        )\n\n    def test_representative_names_are_localized(self) -> None:\n        fr = json.loads(\n            (INTEGRATION / "translations" / "fr.json").read_text(encoding="utf-8")\n        )["entity"]["sensor"]\n        de = json.loads(\n            (INTEGRATION / "translations" / "de.json").read_text(encoding="utf-8")\n        )["entity"]["sensor"]\n        zh = json.loads(\n            (INTEGRATION / "translations" / "zh-Hans.json").read_text(encoding="utf-8")\n        )["entity"]["sensor"]\n        self.assertEqual(\n            fr["grid_start_upper_voltage_limit"]["name"],\n            "Limite supérieure de tension au démarrage",\n        )\n        self.assertEqual(\n            de["grid_qp_voltage_threshold"]["name"], "QP-Spannungsschwelle"\n        )\n        self.assertEqual(\n            zh["grid_overfrequency_reduction_coefficient"]["name"], "过频降额系数"\n        )\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Commit standard translations and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^^:.github/workflows/validate.yml > .github/workflows/validate.yml
          git rm -f docs/.standard-localize-trigger || true
          git add -A
          git commit -m "Use Home Assistant translations for beta diagnostic names"
          git push origin HEAD:beta-1097

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

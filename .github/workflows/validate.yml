name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-beta4:
    name: Prepare beta4 source
    if: github.event_name == 'pull_request' && github.head_ref == 'beta-1097' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply beta4 preparation
        run: |
          test -f .github/scripts/prepare_beta4.py
          python3 .github/scripts/prepare_beta4.py
          python3 - <<'PY'
          from pathlib import Path

          protocol = Path('custom_components/tsun_local/protocols/protocol_1511.py')
          text = protocol.read_text(encoding='utf-8')
          text = text.replace(
              '    data: dict[str, float | int] = {',
              '    data: dict[str, float | int | str] = {',
              1,
          )
          protocol.write_text(text, encoding='utf-8')

          Path('tests/test_mp3000_firmware_versions.py').unlink(missing_ok=True)
          test_path = Path('tests/test_protocol_1511_diagnostics.py')
          test = test_path.read_text(encoding='utf-8')
          old_import = '''from tsun_local_1511_diagnostic_tests.protocol_1511 import (  # noqa: E402
              DIAGNOSTIC_BLOCKS,
              Tsun1511Client,
              build_1511_request,
              decode_measurements,
          )'''
          new_import = '''from tsun_local_1511_diagnostic_tests.protocol_1511 import (  # noqa: E402
              DIAGNOSTIC_BLOCKS,
              FIRMWARE_VERSION_REGISTERS,
              Tsun1511Client,
              build_1511_request,
              decode_firmware_versions,
              decode_measurements,
              firmware_version,
          )'''
          if old_import not in test:
              raise SystemExit('Expected protocol 1511 test import block not found')
          test = test.replace(old_import, new_import, 1)
          marker = '    def test_decodes_3017_and_3028_as_temperatures_and_keeps_3018_raw(self) -> None:\n'
          firmware_test = '\n'.join([
              '    def test_decodes_mp3000_packed_firmware_versions(self) -> None:',
              '        self.assertEqual(firmware_version(0x1172), "V1.1.72")',
              '        self.assertEqual(firmware_version(0x1154), "V1.1.54")',
              '        self.assertEqual(firmware_version(0x1304), "V1.3.04")',
              '        self.assertEqual(',
              '            FIRMWARE_VERSION_REGISTERS,',
              '            {',
              '                "dsp_firmware_version": 0x0BC0,',
              '                "qcpu1_firmware_version": 0x0E26,',
              '                "qcpu2_firmware_version": 0x0EEE,',
              '            },',
              '        )',
              '        self.assertEqual(',
              '            decode_firmware_versions(',
              '                {0x0BC0: 0x1172, 0x0E26: 0x1154, 0x0EEE: 0x1154}',
              '            ),',
              '            {',
              '                "dsp_firmware_version": "V1.1.72",',
              '                "qcpu1_firmware_version": "V1.1.54",',
              '                "qcpu2_firmware_version": "V1.1.54",',
              '            },',
              '        )',
              '',
              '',
          ])
          if marker not in test:
              raise SystemExit('Expected insertion point not found in protocol test')
          test = test.replace(marker, firmware_test + marker, 1)
          test_path.write_text(test, encoding='utf-8')

          metadata = Path('tests/test_metadata.py')
          text = metadata.read_text(encoding='utf-8')
          text = text.replace(
              '<strong>56</strong><span>enabled by default</span>',
              '<strong>59</strong><span>enabled by default</span>',
          )
          text = text.replace('self.assertIn("105", entities)', 'self.assertIn("108", entities)')
          text = text.replace('self.assertIn("56", entities)', 'self.assertIn("59", entities)')
          metadata.write_text(text, encoding='utf-8')

          release_test = Path('tests/test_release_141_field_updates.py')
          text = release_test.read_text(encoding='utf-8')
          text = text.replace(
              'self.assertEqual(manifest["version"], "1.5.1-beta.3")',
              'self.assertEqual(manifest["version"], "1.5.1-beta.4")',
          )
          release_test.write_text(text, encoding='utf-8')
          PY

      - name: Check generated diff
        run: git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore normal validation workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 84280ca972161984eab3fd9ae8c805f5d8c9c271:.github/workflows/validate.yml > .github/workflows/validate.yml
          git rm -f .github/scripts/prepare_beta4.py .github/workflows/prepare-beta4.yml
          git add -A
          git commit -m "Prepare TSUN Local 1.5.1-beta.4"
          git push origin HEAD:beta-1097

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

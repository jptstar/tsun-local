name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  patch-energy:
    name: Apply focused energy patch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out work branch
        uses: actions/checkout@v6
        with:
          ref: fix/energy-first-fresh-poll-work
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Patch, test, clean and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sensor_path = Path("custom_components/tsun_local/sensor.py")
          source = sensor_path.read_text(encoding="utf-8")
          source = source.replace(
              '        """Release a daily reset only after two fresh successful protocol polls."""\n',
              '        """Use the first fresh daily-energy sample after an offline rollover."""\n',
              1,
          )
          old = (
              "            self._daily_reset_successes += 1\n"
              "            if self._daily_reset_successes >= 2:\n"
              "                self._daily_reset_override = False\n"
          )
          new = "            self._daily_reset_override = False\n"
          if old not in source:
              raise SystemExit("Expected two-poll rollover block not found")
          source = source.replace(old, new, 1)
          source = source.replace("        self._daily_reset_successes = 0\n", "")
          source = source.replace("                self._daily_reset_successes = 0\n", "")
          if "_daily_reset_successes" in source:
              raise SystemExit("Obsolete daily-reset counter still present")
          sensor_path.write_text(source, encoding="utf-8")
          test_path = Path("tests/test_energy_restore_contract.py")
          tests = test_path.read_text(encoding="utf-8")
          old_assert = '        self.assertIn("self._daily_reset_successes >= 2", source)\n'
          new_assert = (
              '        self.assertIn("self._daily_reset_override = False", source)\n'
              '        self.assertNotIn("_daily_reset_successes", source)\n'
          )
          if old_assert not in tests:
              raise SystemExit("Expected rollover assertion not found")
          test_path.write_text(tests.replace(old_assert, new_assert, 1), encoding="utf-8")
          PY
          python -m unittest discover -s tests -v
          git show HEAD^:.github/workflows/validate.yml > .github/workflows/validate.yml
          git rm -f .github/workflows/patch-energy-first-fresh-poll.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/tsun_local/sensor.py tests/test_energy_restore_contract.py .github/workflows/validate.yml
          git commit -m "Use first fresh daily energy after offline rollover"
          git push origin HEAD:fix/energy-first-fresh-poll-work

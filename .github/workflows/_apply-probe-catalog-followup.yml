name: Apply V5 diagnostic follow-up

on:
  push:
    branches:
      - feature/diagnostic-probe-catalogs
    paths:
      - tools/_apply_probe_catalog_followup.py
      - .github/workflows/_apply-probe-catalog-followup.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/diagnostic-probe-catalogs
          fetch-depth: 0

      - name: Apply V5 follow-up
        run: python tools/_apply_probe_catalog_followup.py

      - name: Compile diagnostic
        run: python -m py_compile tools/tsun_dump.py

      - name: Run diagnostic regression tests
        run: python -m unittest discover -s tests -p 'test_tsun_dump_tool.py' -v

      - name: Remove temporary patch machinery
        run: |
          rm tools/_apply_probe_catalog_followup.py
          rm .github/workflows/_apply-probe-catalog-followup.yml

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_dump.py tests/test_tsun_dump_tool.py tools/_apply_probe_catalog_followup.py .github/workflows/_apply-probe-catalog-followup.yml
          git commit -m "fix: tolerate interleaved Solarman V5 frames"
          git push origin HEAD:feature/diagnostic-probe-catalogs

name: Prepare TSUN Local 1.5.3

on:
  push:
    branches:
      - release/1.5.3
    paths:
      - .github/workflows/prepare-release-1.5.3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/1.5.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Import validated 1.5.3 beta implementation
        run: |
          git fetch origin beta-1097
          git checkout origin/beta-1097 -- \
            CHANGELOG.md \
            README.md \
            custom_components/tsun_local/alarm_catalog.py \
            custom_components/tsun_local/binary_sensor.py \
            custom_components/tsun_local/coordinator.py \
            custom_components/tsun_local/manifest.json \
            custom_components/tsun_local/protocols/protocol_02b0.py \
            custom_components/tsun_local/protocols/protocol_1097.py \
            docs/ENTITIES.md \
            docs/PLAY2_LOCAL_RESEARCH.md \
            docs/README_DE.md \
            docs/README_ES.md \
            docs/README_FR.md \
            docs/README_IT.md \
            docs/README_NL.md \
            docs/README_PL.md \
            docs/README_ZH.md \
            docs/releases/1.5.3-beta.1.md \
            docs/releases/1.5.3-beta.2.md \
            tests/test_alarm_catalog.py \
            tests/test_play2_beta_communication.py \
            tests/test_stable_151_localized_readmes.py

      - name: Promote documentation and metadata to stable 1.5.3
        run: python .github/scripts/prepare_1_5_3.py

      - name: Check generated diff
        run: git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit prepared stable release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/prepare_1_5_3.py .github/workflows/prepare-release-1.5.3.yml
          git add -A
          git diff --cached --check
          git commit -m "Prepare TSUN Local 1.5.3 stable"
          git push origin HEAD:refs/heads/release/1.5.3

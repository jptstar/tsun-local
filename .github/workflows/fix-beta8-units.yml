name: Correct 1.4.0 beta.8 diagnostic units

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/fix-beta8-units.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Correct advanced diagnostic metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("custom_components/tsun_local/sensor.py")
          text = path.read_text(encoding="utf-8")
          time_keys = (
              "grid_undervoltage_time_1",
              "grid_undervoltage_time_2",
              "grid_overvoltage_time_1",
              "grid_overvoltage_time_2",
              "grid_underfrequency_time_1",
              "grid_underfrequency_time_2",
              "grid_overfrequency_time_1",
              "grid_overfrequency_time_2",
              "grid_undervoltage_time_3",
          )
          for key in time_keys:
              pattern = re.compile(
                  rf'    _advanced_diagnostic\(\n        "{re.escape(key)}",\n        "{re.escape(key)}",\n.*?    \),\n',
                  re.S,
              )
              replacement = (
                  "    _advanced_diagnostic(\n"
                  f'        "{key}",\n'
                  f'        "{key}",\n'
                  "        device_class=SensorDeviceClass.DURATION,\n"
                  "        unit=UnitOfTime.MILLISECONDS,\n"
                  "        precision=2,\n"
                  "    ),\n"
              )
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f"Could not correct {key}")
          path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "<br>**1.4.0-beta.8**</p>",
              "<br><strong>1.4.0-beta.8</strong><!-- **1.4.0-beta.8** --></p>",
              1,
          )
          readme.write_text(text, encoding="utf-8")

          test = Path("tests/test_beta8_sensor_metadata.py")
          test.write_text('''from pathlib import Path\nimport unittest\n\n\nclass Beta8SensorMetadataTests(unittest.TestCase):\n    def test_advanced_timing_entities_are_durations(self) -> None:\n        source = Path("custom_components/tsun_local/sensor.py").read_text(encoding="utf-8")\n        keys = (\n            "grid_undervoltage_time_1", "grid_undervoltage_time_2",\n            "grid_overvoltage_time_1", "grid_overvoltage_time_2",\n            "grid_underfrequency_time_1", "grid_underfrequency_time_2",\n            "grid_overfrequency_time_1", "grid_overfrequency_time_2",\n            "grid_undervoltage_time_3",\n        )\n        for key in keys:\n            start = source.index(f'        "{key}",')\n            block = source[start:start + 280]\n            self.assertIn("SensorDeviceClass.DURATION", block)\n            self.assertIn("UnitOfTime.MILLISECONDS", block)\n\n    def test_advanced_entities_are_disabled_by_default(self) -> None:\n        source = Path("custom_components/tsun_local/sensor.py").read_text(encoding="utf-8")\n        self.assertIn("entity_registry_enabled_default=False", source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

      - name: Run validation
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components/tsun_local
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/tsun_local").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("JSON validation OK")
          PY

      - name: Commit corrected beta.8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-beta8-units.yml
          git add -A
          git commit -m "fix: correct beta.8 diagnostic entity units"
          git push origin HEAD:beta-1097

      - name: Replace beta.8 tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.4.0-beta.8 --cleanup-tag --yes
          git tag -d v1.4.0-beta.8 || true
          git tag -a v1.4.0-beta.8 -m "TSUN Local 1.4.0 beta.8"
          git push origin v1.4.0-beta.8
          cat > /tmp/release-notes.md <<'EOF'
          ## TSUN Local 1.4.0-beta.8

          ### Added
          - Complete read-only advanced grid diagnostics for 1511 and 02B0.
          - Read-only 02B0 output coefficient.
          - Experimental 1097 advanced diagnostics: protocol/inverter versions, temperature, insulation impedance RX/RY and raw country/profile code.
          - New entity translations in all 8 supported languages.
          - New concise README prepared for the final 1.4 release.

          ### Fixed
          - Correct 1511 PV daily-energy register offsets for PV1-PV6.
          - Correct Home Assistant duration metadata for grid-protection timing diagnostics.

          ### Safety
          - Read-only only. No inverter configuration writes.

          ### 1097 acknowledgement
          The experimental 1097 mapping is informed by publicly available protocol research from Stefan Allius / `s-allius/tsun-gen3-proxy`, adapted for direct local use in TSUN Local.
          EOF
          gh release create v1.4.0-beta.8 --verify-tag --prerelease --title "Version 1.4.0-beta.8" --notes-file /tmp/release-notes.md

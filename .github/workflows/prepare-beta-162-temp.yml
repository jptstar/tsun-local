name: Prepare TSUN Local 1.6.2 beta.1

on:
  push:
    branches:
      - beta-1097
    paths:
      - .github/workflows/prepare-beta-162-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare beta metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = "1.6.2-beta.1"
          date = "2026-09-12"

          manifest_path = Path("custom_components/tsun_local/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = f"## [{version}] - {date}"
          if heading not in changelog:
              marker = "\n## ["
              pos = changelog.find(marker)
              if pos == -1:
                  raise SystemExit("Could not locate first changelog release section")
              section = f'''\n## [{version}] - {date}\n\n### Added\n\n- Extend read-only 02B0 diagnostic/signature coverage through the remaining `0x2000..0x205F` gaps and the `0x302B..0x302F` telemetry tail while keeping the new values raw until their semantics are independently validated.\n- Treat protocol 1097 as the validated GEN4 family, including the real Sunology PLAY2 GEN4 path.\n- Add fail-safe automatic protocol detection across the validated runtime families 1511, 1097 and 02B0.\n- Add protocol selection to Reconfigure so Auto, Force detection and strict manual 1511/1097/02B0 choices can be retested before being saved.\n\n### Detection safety\n\n- Use the logger firmware only as a priority hint; it never forces the selected family and never adds confidence points.\n- Require protocol transport/framing validation before scoring, then require a confidence score of at least 80/100 and a minimum 20-point margin over another valid candidate.\n- Treat zero solar production as neutral so detection remains usable at night.\n- Reject ambiguous detection instead of selecting the least-bad candidate.\n- Keep explicit manual protocol selection strict with no silent fallback to another family.\n- Keep the selected protocol locked after setup; normal polling failures do not trigger runtime family switching.\n- Keep experimental 3026 diagnostic-only and excluded from runtime detection.\n\n### Validation\n\n- Add regression coverage for wrong firmware hints, night/zero-production reads, implausible values, incomplete core reads, ambiguity handling, Force mode and strict manual validation.\n- Pass the complete unit-test suite, HACS validation and Home Assistant Hassfest before beta publication.\n'''
              changelog = changelog[:pos] + section + changelog[pos:]
              changelog_path.write_text(changelog, encoding="utf-8")

          notes_path = Path("docs/releases") / f"{version}.md"
          notes_path.write_text(f'''# TSUN Local {version}\n\nThis beta introduces conservative, fail-safe protocol detection for TSUN Local 1.6.2 and includes the latest read-only protocol coverage work.\n\n## Automatic protocol detection\n\n- Logger firmware is used only as the first protocol to try.\n- All validated runtime families (`1511`, `1097`, `02B0`) can be evaluated when needed.\n- A candidate must first pass the existing protocol/transport validation, then reach at least **80/100** confidence.\n- If another valid candidate is within **20 points**, detection stops as ambiguous instead of guessing.\n- Zero production is neutral, so setup is intended to remain valid at night.\n- Once a protocol is selected and stored, normal polling never switches family automatically.\n\n## Manual and Reconfigure\n\n- Manual `1511`, `1097` and `02B0` selections remain strict: the chosen family must validate and there is no silent fallback.\n- Reconfigure now allows Auto, Force detection, 1511, 1097 or 02B0.\n- Reconfiguration is transactional: the existing entry remains unchanged unless the new connection/protocol validates successfully.\n\n## Protocol coverage\n\n- 02B0 read-only diagnostic/signature coverage now includes `0x2011..0x2013`, `0x202D..0x205F` and `0x302B..0x302F`; the additional values remain raw pending semantic validation.\n- 1097 is classified as the validated **GEN4** family, including the Sunology PLAY2 GEN4 path.\n- Experimental `3026` remains diagnostic-only and is not part of runtime automatic detection.\n\n## Validation requested\n\nPlease test normal setup and Reconfigure on known 1511, 02B0 and 1097 hardware. In particular, report any case where Auto refuses a known device, selects an unexpected family, or a deliberately wrong manual family is accepted.\n\n## Safety\n\nTSUN Local remains local and strictly read-only. This beta adds no inverter configuration or write operation.\n''', encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/prepare-beta-162-temp.yml

      - name: Validate beta metadata and tests
        run: |
          python -m compileall -q custom_components/tsun_local tests
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check

      - name: Commit beta source
        run: |
          set -euo pipefail
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add -A
          git commit -m "[beta-release] Prepare TSUN Local 1.6.2-beta.1"
          git push origin HEAD:beta-1097

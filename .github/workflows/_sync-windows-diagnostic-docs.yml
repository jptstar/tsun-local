name: Sync Windows diagnostic docs

on:
  push:
    branches: [docs/windows-diagnostic-docs]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update documentation
        run: python tools/_sync_windows_diagnostic_docs.py
      - name: Run public-site tests
        run: python -m unittest tests.test_release_154_web
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/_sync_windows_diagnostic_docs.py .github/workflows/_sync-windows-diagnostic-docs.yml
          git add README.md docs/README_*.md docs/HARDWARE_DUMP.md docs/index.html docs/test-your-inverter.html tools/README.md tests/test_release_154_web.py
          git commit -m "Document portable Windows diagnostic across public docs"
          git push origin HEAD:docs/windows-diagnostic-docs

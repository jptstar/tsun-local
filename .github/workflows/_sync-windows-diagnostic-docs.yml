name: Sync Windows diagnostic documentation

on:
  push:
    branches:
      - docs/windows-diagnostic-docs

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize README and website documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          EXE = "https://github.com/jptstar/tsun-local/releases/latest/download/TSUN-Local-Diagnostic.exe"
          SHA = "https://github.com/jptstar/tsun-local/releases/latest/download/TSUN-Local-Diagnostic.exe.sha256"
          SCRIPT = "https://raw.githubusercontent.com/jptstar/tsun-local/main/tools/tsun_dump.py"

          def replace_section(path: str, heading: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              pattern = re.escape(heading) + r"\n.*?\n### Sunology PLAY2"
              new, count = re.subn(pattern, replacement.rstrip() + "\n\n### Sunology PLAY2", text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Could not replace diagnostic section in {path}: {count}")
              p.write_text(new, encoding="utf-8")

          sections = {
              "README.md": ("## 🔬 Validate another TSUN model", f'''## 🔬 Validate another TSUN model

TSUN Local provides a privacy-safe, **strictly read-only** hardware diagnostic for unlisted models and communication issues.

### Windows — easiest option

**⬇️ [Download `TSUN-Local-Diagnostic.exe`]({EXE})**

No installation and no Python environment are required. The portable app uses the same read-only dump engine, discovers TSUN loggers, tests the supported **1511 / 02B0 / 1097** protocol families and creates an anonymized JSON report.

If you are investigating a communication problem or unavailable entities, **disable the affected TSUN Local config entry before starting the capture**, then re-enable it afterwards.

### macOS / Linux / advanced users

**⬇️ [Download `tsun_dump.py`]({SCRIPT})** — Python 3.10+.

```bash
python3 tsun_dump.py --full
```

On Windows, the script remains available with `py tsun_dump.py --full` if preferred.

📚 **[Hardware Validation Dump Tool guide](docs/HARDWARE_DUMP.md)**'''),
              "docs/README_FR.md": ("## 🔬 Valider un autre modèle TSUN", f'''## 🔬 Valider un autre modèle TSUN

TSUN Local propose un diagnostic matériel respectueux de la confidentialité et **strictement en lecture seule** pour les modèles non listés et les problèmes de communication.

### Windows — solution la plus simple

**⬇️ [Télécharger `TSUN-Local-Diagnostic.exe`]({EXE})**

Aucune installation et aucun environnement Python ne sont nécessaires. L’application portable utilise le même moteur de diagnostic en lecture seule, découvre les loggers TSUN, teste les protocoles **1511 / 02B0 / 1097** et génère un rapport JSON anonymisé.

Pour diagnostiquer une perte de communication ou des entités indisponibles, **désactivez l’entrée de configuration TSUN Local concernée avant de lancer la capture**, puis réactivez-la ensuite.

### macOS / Linux / utilisateurs avancés

**⬇️ [Télécharger `tsun_dump.py`]({SCRIPT})** — Python 3.10+.

```bash
python3 tsun_dump.py --full
```

Sous Windows, le script reste utilisable avec `py tsun_dump.py --full` si vous le préférez.

📚 **[Guide de l’outil Hardware Validation Dump](HARDWARE_DUMP.md)**'''),
              "docs/README_DE.md": ("## 🔬 Ein anderes TSUN-Modell validieren", f'''## 🔬 Ein anderes TSUN-Modell validieren

TSUN Local bietet eine datenschutzfreundliche, **streng schreibgeschützte** Hardware-Diagnose für nicht aufgeführte Modelle und Kommunikationsprobleme.

### Windows — einfachste Variante

**⬇️ [`TSUN-Local-Diagnostic.exe` herunterladen]({EXE})**

Keine Installation und keine Python-Umgebung erforderlich. Die portable Anwendung verwendet dieselbe schreibgeschützte Diagnose-Engine, erkennt TSUN-Logger, prüft die Protokolle **1511 / 02B0 / 1097** und erstellt einen anonymisierten JSON-Bericht.

Bei Kommunikationsproblemen oder nicht verfügbaren Entitäten **den betroffenen TSUN-Local-Konfigurationseintrag vor der Erfassung deaktivieren** und danach wieder aktivieren.

### macOS / Linux / fortgeschrittene Benutzer

**⬇️ [`tsun_dump.py` herunterladen]({SCRIPT})** — Python 3.10+.

```bash
python3 tsun_dump.py --full
```

Unter Windows kann das Skript weiterhin mit `py tsun_dump.py --full` verwendet werden.

📚 **[Hardware Validation Dump Tool Leitfaden](HARDWARE_DUMP.md)**'''),
              "docs/README_NL.md": ("## 🔬 Een ander TSUN-model valideren", f'''## 🔬 Een ander TSUN-model valideren

TSUN Local biedt een privacyvriendelijke en **strikt alleen-lezen** hardwarediagnose voor niet-vermelde modellen en communicatieproblemen.

### Windows — eenvoudigste optie

**⬇️ [`TSUN-Local-Diagnostic.exe` downloaden]({EXE})**

Geen installatie of Python-omgeving nodig. De draagbare toepassing gebruikt dezelfde alleen-lezen diagnose-engine, ontdekt TSUN-loggers, test de protocollen **1511 / 02B0 / 1097** en maakt een geanonimiseerd JSON-rapport.

Bij communicatieproblemen of niet-beschikbare entiteiten: **schakel de betreffende TSUN Local-configuratie-entry uit voordat de capture start** en schakel die daarna weer in.

### macOS / Linux / gevorderde gebruikers

**⬇️ [`tsun_dump.py` downloaden]({SCRIPT})** — Python 3.10+.

```bash
python3 tsun_dump.py --full
```

Onder Windows blijft het script beschikbaar via `py tsun_dump.py --full`.

📚 **[Handleiding Hardware Validation Dump Tool](HARDWARE_DUMP.md)**'''),
              "docs/README_IT.md": ("## 🔬 Valida un altro modello TSUN", f'''## 🔬 Valida un altro modello TSUN

TSUN Local offre una diagnostica hardware rispettosa della privacy e **rigorosamente in sola lettura** per modelli non elencati e problemi di comunicazione.

### Windows — opzione più semplice

**⬇️ [Scarica `TSUN-Local-Diagnostic.exe`]({EXE})**

Non servono installazione né ambiente Python. L’app portatile usa lo stesso motore diagnostico in sola lettura, rileva i logger TSUN, prova i protocolli **1511 / 02B0 / 1097** e crea un rapporto JSON anonimizzato.

Per problemi di comunicazione o entità non disponibili, **disattiva la voce di configurazione TSUN Local interessata prima della cattura** e riattivala al termine.

### macOS / Linux / utenti avanzati

**⬇️ [Scarica `tsun_dump.py`]({SCRIPT})** — Python 3.10+.

```bash
python3 tsun_dump.py --full
```

Su Windows lo script resta utilizzabile con `py tsun_dump.py --full`.

📚 **[Guida Hardware Validation Dump Tool](HARDWARE_DUMP.md)**'''),
              "docs/README_ES.md": ("## 🔬 Validar otro modelo TSUN", f'''## 🔬 Validar otro modelo TSUN

TSUN Local ofrece un diagnóstico de hardware respetuoso con la privacidad y **estrictamente de solo lectura** para modelos no listados y problemas de comunicación.

### Windows — opción más sencilla

**⬇️ [Descargar `TSUN-Local-Diagnostic.exe`]({EXE})**

No requiere instalación ni entorno Python. La aplicación portátil utiliza el mismo motor de diagnóstico de solo lectura, descubre loggers TSUN, prueba los protocolos **1511 / 02B0 / 1097** y genera un informe JSON anonimizado.

Para investigar problemas de comunicación o entidades no disponibles, **desactiva la entrada de configuración TSUN Local afectada antes de iniciar la captura** y vuelve a activarla después.

### macOS / Linux / usuarios avanzados

**⬇️ [Descargar `tsun_dump.py`]({SCRIPT})** — Python 3.10+.

```bash
python3 tsun_dump.py --full
```

En Windows el script sigue disponible con `py tsun_dump.py --full`.

📚 **[Guía Hardware Validation Dump Tool](HARDWARE_DUMP.md)**'''),
              "docs/README_PL.md": ("## 🔬 Zweryfikuj inny model TSUN", f'''## 🔬 Zweryfikuj inny model TSUN

TSUN Local udostępnia bezpieczną dla prywatności i **ściśle tylko do odczytu** diagnostykę sprzętową dla modeli spoza listy oraz problemów z komunikacją.

### Windows — najprostsza opcja

**⬇️ [Pobierz `TSUN-Local-Diagnostic.exe`]({EXE})**

Nie wymaga instalacji ani środowiska Python. Przenośna aplikacja używa tego samego silnika diagnostycznego tylko do odczytu, wykrywa loggery TSUN, testuje protokoły **1511 / 02B0 / 1097** i tworzy zanonimizowany raport JSON.

Przy problemach z komunikacją lub niedostępnych encjach **wyłącz odpowiedni wpis konfiguracji TSUN Local przed rozpoczęciem zrzutu**, a po zakończeniu włącz go ponownie.

### macOS / Linux / użytkownicy zaawansowani

**⬇️ [Pobierz `tsun_dump.py`]({SCRIPT})** — Python 3.10+.

```bash
python3 tsun_dump.py --full
```

W Windows skrypt nadal można uruchomić poleceniem `py tsun_dump.py --full`.

📚 **[Przewodnik Hardware Validation Dump Tool](HARDWARE_DUMP.md)**'''),
              "docs/README_ZH.md": ("## 🔬 验证其他 TSUN 型号", f'''## 🔬 验证其他 TSUN 型号

TSUN Local 为未列出的型号和通信问题提供注重隐私且 **严格只读** 的硬件诊断工具。

### Windows — 最简单的方式

**⬇️ [下载 `TSUN-Local-Diagnostic.exe`]({EXE})**

无需安装，也无需 Python 环境。便携应用使用相同的只读诊断引擎，可发现 TSUN Logger、测试 **1511 / 02B0 / 1097** 协议并生成匿名化 JSON 报告。

如果正在排查通信问题或实体不可用，**请在开始采集前禁用受影响的 TSUN Local 配置项**，完成后再重新启用。

### macOS / Linux / 高级用户

**⬇️ [下载 `tsun_dump.py`]({SCRIPT})** — 需要 Python 3.10+。

```bash
python3 tsun_dump.py --full
```

在 Windows 上仍可使用 `py tsun_dump.py --full` 运行脚本。

📚 **[Hardware Validation Dump Tool 指南](HARDWARE_DUMP.md)**'''),
          }

          for path, (heading, replacement) in sections.items():
              replace_section(path, heading, replacement)

          # Detailed hardware-dump guide: Windows executable first, Python script retained.
          p = Path("docs/HARDWARE_DUMP.md")
          text = p.read_text(encoding="utf-8")
          replacement = f'''## ⬇️ Choose the easiest diagnostic

### Windows — portable executable (recommended for end users)

**[Download `TSUN-Local-Diagnostic.exe`]({EXE})**  
**[SHA-256 checksum]({SHA})**

No installation and no Python environment are required. The executable is built from the same **strictly read-only** `tsun_dump.py` engine and creates the same privacy-safe JSON reports.

When diagnosing a communication failure or unavailable entities:

1. reproduce the problem and **do not reload TSUN Local first**;
2. download the Home Assistant diagnostic when possible;
3. **disable the affected TSUN Local config entry** so it does not compete for the logger connection;
4. run `TSUN-Local-Diagnostic.exe` and start the full diagnostic;
5. re-enable TSUN Local when the capture is finished;
6. send the generated JSON file(s) together with the Home Assistant diagnostic.

The Windows executable is currently unsigned, so Windows SmartScreen may show an **Unknown publisher** warning. The published SHA-256 file can be used to verify the download.

### Python script — macOS, Linux and advanced users

**[Download `tsun_dump.py`]({SCRIPT})**

The single Python file uses **only the Python standard library**: no Home Assistant, pip package, Node.js or cloned repository is required. Python **3.10 or newer** is required.

macOS / Linux:

```bash
python3 tsun_dump.py --full
```

Windows terminal alternative:

```powershell
py tsun_dump.py --full
```

If the Monitor SN is already known, it can be passed directly:

```powershell
py tsun_dump.py --host 192.168.1.50 --monitor-sn 1234567890 --full
```

`--monitor-sn` is an alias for the existing `--serial` option.

## Automatic discovery: all devices by default'''
          new, count = re.subn(r"## ⬇️ Download one file\n.*?\n## Automatic discovery: all devices by default", replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Could not update HARDWARE_DUMP.md: {count}")
          p.write_text(new, encoding="utf-8")

          # Tools README: present the end-user executable before terminal instructions.
          p = Path("tools/README.md")
          text = p.read_text(encoding="utf-8")
          replacement = f'''## Hardware validation dump

[`tsun_dump.py`](tsun_dump.py) is the single-file, standalone, privacy-safe and **strictly read-only** hardware dumper for protocols **1511**, **02B0** and **1097**.

### Windows portable diagnostic

For users who are not comfortable with Python or a command prompt:

**⬇️ [Download `TSUN-Local-Diagnostic.exe`]({EXE})**  
**[SHA-256 checksum]({SHA})**

No installation or Python environment is required. The French/English GUI uses the same read-only dump engine and writes anonymized JSON reports into the folder selected by the user.

If the capture is intended to diagnose a communication problem, take the Home Assistant diagnostic first when possible, then **disable the affected TSUN Local config entry before running the executable**. Re-enable it after the capture.

### Python / command-line version

Direct download:

[`{SCRIPT}`]({SCRIPT})

Run with Python 3.10+:

```bash
python3 tsun_dump.py --full
```

The tool tries local discovery first. IP address and Monitor SN are requested only when automatic discovery cannot resolve them, and neither is stored in the output JSON. `--monitor-sn` and the legacy `--serial` option are equivalent.

For capture ranges, safety, privacy, snapshots and before/after comparison, see [Hardware Validation Dump Tool](../docs/HARDWARE_DUMP.md).

## Sunology PLAY2 super-probe'''
          new, count = re.subn(r"## Hardware validation dump\n.*?\n## Sunology PLAY2 super-probe", replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Could not update tools/README.md: {count}")
          p.write_text(new, encoding="utf-8")

          # Public compatibility test page: current stable version + explicit easy diagnostic path.
          p = Path("docs/test-your-inverter.html")
          text = p.read_text(encoding="utf-8")
          text = text.replace("TSUN Local 1.5.3", "TSUN Local 1.6.0")
          text = text.replace('"dateModified":"2026-08-27"', '"dateModified":"2026-09-05"')
          text = text.replace(
              'Share the exact model, firmware, number of PV inputs and the Home Assistant diagnostic when available.',
              'Share the exact model, firmware, number of PV inputs and the Home Assistant diagnostic when available. If discovery fails, run the portable Windows diagnostic before reloading the integration.'
          )
          marker = '  <section>\n    <h2>What to share</h2>'
          diagnostic_section = f'''  <section>\n    <h2>If discovery fails or entities stay unavailable</h2>\n    <p class="intro">Capture the problem before reloading the integration. On Windows, the portable diagnostic requires no Python or command prompt and uses the same strictly read-only diagnostic engine.</p>\n    <div class="callout">\n      <strong>Before the capture</strong>\n      Download the Home Assistant diagnostic when possible, then disable the affected TSUN Local config entry. Run the diagnostic, re-enable the entry afterwards, and send both reports together.\n    </div>\n    <div class="actions">\n      <a class="button primary" href="{EXE}">Download Windows diagnostic</a>\n      <a class="button secondary" href="HARDWARE_DUMP.html">Diagnostic guide</a>\n    </div>\n  </section>\n\n'''
          # HARDWARE_DUMP.md is the real guide; GitHub Pages cannot serve Markdown as HARDWARE_DUMP.html reliably.
          diagnostic_section = diagnostic_section.replace('href="HARDWARE_DUMP.html"', 'href="https://github.com/jptstar/tsun-local/blob/main/docs/HARDWARE_DUMP.md"')
          if "TSUN-Local-Diagnostic.exe" not in text:
              if marker not in text:
                  raise SystemExit("Could not locate What to share section")
              text = text.replace(marker, diagnostic_section + marker, 1)
          p.write_text(text, encoding="utf-8")

          # Homepage: expose the Windows diagnostic beside the community test page.
          p = Path("docs/index.html")
          text = p.read_text(encoding="utf-8")
          if "TSUN-Local-Diagnostic.exe" not in text:
              pattern = r'(<a class="card" style="display:block;color:inherit;text-decoration:none" href="test-your-inverter\.html">.*?</a>)'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise SystemExit("Could not locate test-your-inverter card on homepage")
              diag_card = f'''\n      <a class="card" style="display:block;color:inherit;text-decoration:none" href="{EXE}"><strong>Windows diagnostic →</strong><span class="muted">Portable read-only diagnostic for unlisted models, unavailable entities and communication issues. No Python required.</span></a>'''
              text = text[:match.end()] + diag_card + text[match.end():]
          text = text.replace(
              "Monitor TSUN microinverters locally in Home Assistant with TSUN Local 1.6.0, including adaptive polling.",
              "Monitor TSUN microinverters locally in Home Assistant with TSUN Local 1.6.0, including adaptive polling and a portable Windows diagnostic."
          )
          p.write_text(text, encoding="utf-8")

          # Web contract: keep the user-facing diagnostic link and current test page version from regressing.
          p = Path("tests/test_release_154_web.py")
          text = p.read_text(encoding="utf-8")
          needle = '        self.assertIn("NEW IN 1.6.0", text)\n'
          if 'self.assertIn("TSUN-Local-Diagnostic.exe", text)' not in text:
              text = text.replace(needle, needle + '        self.assertIn("TSUN-Local-Diagnostic.exe", text)\n', 1)
          before = '\n\nif __name__ == "__main__":\n'
          test_method = '''\n    def test_hardware_test_page_promotes_current_diagnostic(self) -> None:\n        text = (DOCS / "test-your-inverter.html").read_text(encoding="utf-8")\n        self.assertIn("TSUN Local 1.6.0", text)\n        self.assertNotIn("TSUN Local 1.5.3", text)\n        self.assertIn("TSUN-Local-Diagnostic.exe", text)\n        self.assertIn("disable the affected TSUN Local config entry", text)\n'''
          if "test_hardware_test_page_promotes_current_diagnostic" not in text:
              if before not in text:
                  raise SystemExit("Could not locate unittest footer")
              text = text.replace(before, test_method + before, 1)
          p.write_text(text, encoding="utf-8")

          # Basic synchronization contract.
          for path in sections:
              content = Path(path).read_text(encoding="utf-8")
              if "TSUN-Local-Diagnostic.exe" not in content:
                  raise SystemExit(f"EXE link missing from {path}")
          for path in ("docs/HARDWARE_DUMP.md", "tools/README.md", "docs/index.html", "docs/test-your-inverter.html"):
              if "TSUN-Local-Diagnostic.exe" not in Path(path).read_text(encoding="utf-8"):
                  raise SystemExit(f"EXE link missing from {path}")
          if "TSUN Local 1.5.3" in Path("docs/test-your-inverter.html").read_text(encoding="utf-8"):
              raise SystemExit("test-your-inverter.html still advertises 1.5.3")
          PY

      - name: Run documentation contract tests
        shell: bash
        run: |
          python -m unittest tests.test_release_154_web

      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_sync-windows-diagnostic-docs.yml
          git add README.md docs/README_*.md docs/HARDWARE_DUMP.md docs/index.html docs/test-your-inverter.html tools/README.md tests/test_release_154_web.py
          git commit -m "Document portable Windows diagnostic across public docs"
          git push origin HEAD:docs/windows-diagnostic-docs

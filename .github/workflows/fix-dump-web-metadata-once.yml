name: Fix dump web metadata once

on:
  push:
    branches:
      - fix/dump-web-metadata-251
    paths:
      - .diagnostic-metadata-251-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/dump-web-metadata-251
          fetch-depth: 0

      - name: Apply metadata parser fix
        run: python tools/_fix_dump_web_metadata_251.py

      - name: Validate Python sources
        run: |
          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic_gui.py tests/test_tsun_dump_tool.py
          python tests/test_tsun_dump_tool.py
          git diff --check

      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_dump.py tests/test_tsun_dump_tool.py tools/README.md docs/HARDWARE_DUMP.md
          git commit -m "Fix logger web metadata parsing"
          git push origin HEAD:fix/dump-web-metadata-251

name: Prepare beta3 once

on:
  push:
    branches:
      - beta-1097
    paths:
      - docs/.prepare-beta3

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare 1.5.1-beta.3 content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import struct

          VERSION = "1.5.1-beta.3"
          ROOT = Path(".")

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing expected text in {label}: {old!r}")
              return text.replace(old, new)

          # Manifest version.
          manifest_path = Path("custom_components/tsun_local/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = VERSION
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          # README: keep the existing presentation, update beta version and user-facing beta3 changes.
          p = "README.md"
          text = read(p)
          text = text.replace("1.5.1-beta.2", VERSION)
          text = replace_required(
              text,
              "| 🚨 | **224 alarm positions preserved** with the same compact Home Assistant interface |\n| 🔒 | Fully local and read-only |",
              "| 🚨 | **Dedicated Active alarm names entity** publishes the localized alarm text directly in Home Assistant |\n| 📐 | **Overfrequency reduction coefficient corrected** — `0x07EF` raw `4000` is exposed as `40.00 %/Hz` with `×0.01` scaling |\n| 🌐 | Entity IDs stay stable in English while display names and alarm text follow the Home Assistant language |\n| 🚨 | **224 alarm positions preserved** with the same compact Home Assistant interface |\n| 🔒 | Fully local and read-only |",
              p,
          )
          write(p, text)

          # Technical entity reference.
          p = "docs/ENTITIES.md"
          text = read(p)
          text = text.replace("1.5.1-beta.1", VERSION).replace("1.5.1-beta.2", VERSION)
          text = text.replace(
              "The maximum 1.5.1-beta.1 MP3000 configuration exposes **105 Home Assistant entities**.",
              f"The maximum {VERSION} MP3000 configuration exposes **105 Home Assistant entities**.",
          )
          text = text.replace(
              "| Power and capacity diagnostics | 3 | rated power, maximum designed power, candidate power level |",
              "| Power and capacity diagnostics | 2 | rated power, maximum designed power |",
          )
          text = text.replace(
              "| Power and capacity diagnostics | 3 | Rated power, maximum designed power, candidate power level |",
              "| Power and capacity diagnostics | 2 | Rated power, maximum designed power |",
          )
          text = text.replace(
              "| Alarm interface | 16 | inverter alarm, active-alarm count, 14 complete raw words |",
              "| Alarm interface | 17 | inverter alarm, active-alarm count, dedicated active-alarm names, 14 complete raw words |",
          )
          text = text.replace(
              "| **Total** | **105** | **55 enabled by default · 50 advanced/disabled by default** |",
              "| **Total** | **105** | **56 enabled by default · 49 advanced/disabled by default** |",
          )
          text = text.replace(
              "Active positions are presented through the alarm state and count;",
              "Active positions are presented through the alarm state, count and dedicated localized-name sensor;",
          )
          if "| `active_alarm_names` | Active alarm names | ✅ |" not in text:
              text = text.replace(
                  "| `alarm_active_count` | Active alarms | ✅ |",
                  "| `alarm_active_count` | Active alarms | ✅ |\n| `active_alarm_names` | Active alarm names | ✅ |",
              )
          text = text.replace(
              "The `alarm_active_count` entity lists the localized names and stable local codes of current alarms.",
              "The `active_alarm_names` entity publishes the localized alarm text directly. Stable `A001`–`A224` identifiers remain internal diagnostic identifiers and are not included in the user-facing alarm-name state.",
          )
          text = text.replace(
              "| `grid_overfrequency_reduction_coefficient` | Overfrequency reduction coefficient | `2031 / 0x07EF` | raw |",
              "| `grid_overfrequency_reduction_coefficient` | Overfrequency reduction coefficient | `2031 / 0x07EF` | %/Hz · ×0.01 (`4000` → `40.00`) |",
          )
          write(p, text)

          # Website home page: same design, beta3 content and corrected entity counts.
          p = "docs/index.html"
          text = read(p)
          text = text.replace("1.5.1-beta.2", VERSION)
          text = text.replace("🧪 NEW IN 1.5.1 BETA 1", "🧪 NEW IN 1.5.1 BETA 3")
          text = text.replace("<strong>55</strong><span>enabled by default</span>", "<strong>56</strong><span>enabled by default</span>")
          text = text.replace("<strong>50</strong><span>advanced diagnostics</span>", "<strong>49</strong><span>advanced diagnostics</span>")
          text = text.replace(
              "The 1.5.0 presentation and alarm architecture stay intact. Beta 1 adds read-only MP3000/TITAN evidence and fixes logger RSSI traversal.",
              "The 1.5.0 presentation and alarm architecture stay intact. Beta 3 consolidates the MP3000 diagnostics, localized alarm-name entity and logger RSSI fixes.",
          )
          old_grid = '''      <div class="grid">\n        <div class="card"><strong>📶 Wi-Fi RSSI fallback fixed</strong><span class="muted">A valid index page without RSSI no longer stops the search. TSUN Local continues until `/status.html` exposes `cover_sta_rssi`; a live post-fix dump read 30%.</span></div>\n        <div class="card"><strong>🛡️ 10 A1/21 diagnostics</strong><span class="muted">Ten additional MP3000 field-validation sensors are available as advanced entities and remain disabled by default.</span></div>\n      </div>'''
          new_grid = '''      <div class="grid">\n        <div class="card"><strong>📶 Wi-Fi RSSI fallback fixed</strong><span class="muted">A valid index page without RSSI no longer stops the search. TSUN Local continues until `/status.html` exposes `cover_sta_rssi`.</span></div>\n        <div class="card"><strong>🛡️ 10 A1/21 diagnostics</strong><span class="muted">Ten additional MP3000 field-validation sensors are available as advanced entities and remain disabled by default.</span></div>\n        <div class="card"><strong>🚨 Active alarm names</strong><span class="muted">A dedicated Home Assistant sensor now exposes the localized active alarm text directly; internal Axxx identifiers stay out of the user-facing state.</span></div>\n        <div class="card"><strong>📐 40.00 %/Hz coefficient</strong><span class="muted">The MP3000 overfrequency reduction coefficient at <code>0x07EF</code> now decodes raw 4000 with ×0.01 scaling.</span></div>\n      </div>'''
          text = replace_required(text, old_grid, new_grid, p)
          text = text.replace("Active names and local codes without a wall of permanent entities.", "Localized active alarm names without a wall of permanent entities.")
          text = text.replace("Unidentified inverter alarm (A030)", "Unidentified inverter alarm")
          text = text.replace("unique local codes", "stable internal positions")
          text = text.replace("1511 country/profile raw candidate and power-level candidate", "1511 country/profile raw candidate")
          text = text.replace("<li>Inverter alarm and active alarm count</li>", "<li>Inverter alarm, active alarm count and localized active alarm names</li>")
          text = text.replace("What is beta in 1.5.1-beta.2?", f"What is beta in {VERSION}?")
          write(p, text)

          # Visual entity page: correct counts, alarm-name entity and 0x07EF presentation.
          p = "docs/entities.html"
          text = read(p)
          text = text.replace("1.5.1-beta.1", VERSION).replace("1.5.1-beta.2", VERSION)
          text = text.replace("<strong>55</strong><span>enabled by default</span>", "<strong>56</strong><span>enabled by default</span>")
          text = text.replace("<strong>50</strong><span>advanced diagnostics</span>", "<strong>49</strong><span>advanced diagnostics</span>")
          text = text.replace(
              "<tr><td>Power and capacity diagnostics</td><td>3</td><td>Rated power, maximum designed power and candidate power level</td></tr>",
              "<tr><td>Power and capacity diagnostics</td><td>2</td><td>Rated power and maximum designed power</td></tr>",
          )
          text = text.replace(
              "<tr><td>Alarm interface</td><td>16</td><td>Inverter alarm, active count and 14 complete raw words</td></tr>",
              "<tr><td>Alarm interface</td><td>17</td><td>Inverter alarm, active count, localized active alarm names and 14 complete raw words</td></tr>",
          )
          text = text.replace(
              "Inverter alarm · active count · localized names · stable local codes.",
              "Inverter alarm · active count · dedicated localized alarm names.",
          )
          text = text.replace(
              "22 core grid protections · 10 field-validation values · temperatures · candidate power level · raw country/profile candidate.",
              "22 core grid protections · 10 field-validation values · temperatures · raw country/profile candidate.",
          )
          text = text.replace(
              "active positions are decoded inside two everyday entities",
              "active positions are decoded through three everyday entities",
          )
          old_groups = '''        <div class="group"><strong>🚨 Inverter alarm</strong><span class="muted">A problem binary sensor that turns on when an alarm position is active. Its attributes list active localized names and stable local codes.</span></div>\n        <div class="group"><strong>🔢 Active alarms</strong><span class="muted">Counts every active position, including positions whose exact physical meaning is still awaiting validation.</span></div>\n        <div class="group"><strong>🧰 Fourteen raw words</strong><span class="muted">Four inverter words, four secondary words and six PV words. They are disabled by default.</span></div>'''
          new_groups = '''        <div class="group"><strong>🚨 Inverter alarm</strong><span class="muted">A problem binary sensor that turns on when an alarm position is active.</span></div>\n        <div class="group"><strong>🔢 Active alarms</strong><span class="muted">Counts every active position, including positions whose exact physical meaning is still awaiting validation.</span></div>\n        <div class="group"><strong>📝 Active alarm names</strong><span class="muted">Publishes the localized alarm text directly in Home Assistant. Internal Axxx identifiers are kept out of the user-facing state.</span></div>\n        <div class="group"><strong>🧰 Fourteen raw words</strong><span class="muted">Four inverter words, four secondary words and six PV words. They are disabled by default.</span></div>'''
          text = replace_required(text, old_groups, new_groups, p)
          text = text.replace(
              "<tr><td><code>grid_overfrequency_reduction_coefficient</code></td><td><code>0x07EF</code></td><td>4000 raw</td></tr>",
              "<tr><td><code>grid_overfrequency_reduction_coefficient</code></td><td><code>0x07EF</code></td><td>4000 × 0.01 = 40.00 %/Hz</td></tr>",
          )
          write(p, text)

          # Changelog beta3 section.
          p = "CHANGELOG.md"
          text = read(p)
          if f"## [{VERSION}]" not in text:
              marker = "All notable changes to this project are documented here. The project follows [Semantic Versioning](https://semver.org/).\n\n"
              section = f'''## [{VERSION}] - 2026-08-19\n\n### Added\n\n- Add a dedicated MP3000/1511 `active_alarm_names` Home Assistant sensor so localized active alarm text is directly visible and usable without reading attributes.\n- Keep technical entity IDs stable in English while display names and alarm text remain localized in all eight supported languages.\n\n### Fixed\n\n- Decode MP3000/1511 `0x07EF` raw `4000` with candidate factor `0.01`, exposing the overfrequency reduction coefficient as `40.00 %/Hz` instead of raw `4000`.\n- Keep stable `A001`–`A224` identifiers as internal diagnostic identifiers and remove them from user-facing unknown alarm text.\n- Refresh the website and entity pages for the beta3 entity counts: 105 maximum MP3000 entities with six PV inputs, 56 enabled by default and 49 advanced/disabled by default.\n- Remove stale website references to the discarded MP3000 power-level candidate and keep the public beta presentation concise.\n- Verify the Home Assistant 2026.3+ local brand assets (`brand/icon.png`, `icon@2x.png`, `logo.png`, `logo@2x.png`) and HACS repository metadata.\n\n### Changed\n\n- Preserve the beta1 logger RSSI fix and ten read-only MP3000 A1/21 diagnostics.\n- Preserve the beta2 translation coverage and removal of the unvalidated `output_coefficient_candidate` entity.\n- Keep new research correlations outside beta3 semantic entities until independently validated.\n\n### Safety\n\n- All MP3000 diagnostic and alarm access remains local and read-only.\n- No inverter configuration, grid-protection, country/profile or control write is added.\n\n'''
              text = replace_required(text, marker, marker + section, p)
          write(p, text)

          # Research backlog: keep the newly observed correlations out of beta3 entities and public web/release highlights.
          p = "docs/PENDING_1.5.1.md"
          pending = '''# TSUN Local 1.5.1 research backlog\n\nThe following MP3000/1511 correlations are intentionally **not exposed as new semantic Home Assistant entities in 1.5.1-beta.3**. They are retained for later controlled validation.\n\n## Very strong correlations\n\n- `0x07F1` → Reactive mode candidate, live raw `0x0066`.\n- `0x07F2` → GFCI enable candidate, live raw `1000`.\n- `0x07F9` → Calibration K3 candidate, live raw `1003`.\n- `0x080D` → Anti-current / anti-reflux delay candidate, live raw `10`, profile value `10 s`.\n\n## Strong but order-indeterminate\n\n- `0x07F7` / `0x07F8` → Calibration K1 / K2 candidate pair, both live raw `1024`; individual order is not assigned.\n\n## Very promising cluster\n\n- `0x080B`–`0x080E` → anti-reflux / zero-export configuration cluster. Individual semantic assignments remain pending.\n\n## Still too ambiguous\n\n- `0x07ED` / `0x0809` → reduction-signal candidates.\n- `0x0BD2` → isolation candidate around `60 MΩ`; Rx/Ry assignment is not distinguishable from the current profile.\n\nNo write command is implemented or required for this backlog.\n'''
          write(p, pending)

          # Keep release metadata tests aligned if a test pins the prerelease string.
          for test_path in Path("tests").glob("test_*.py"):
              t = test_path.read_text(encoding="utf-8")
              if "1.5.1-beta.2" in t:
                  test_path.write_text(t.replace("1.5.1-beta.2", VERSION), encoding="utf-8")

          # Verify local HA brand assets already shipped in the integration package.
          def png_size(path: Path) -> tuple[int, int]:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG: {path}")
              return struct.unpack(">II", data[16:24])

          for name in ("icon.png", "icon@2x.png", "logo.png", "logo@2x.png"):
              path = Path("custom_components/tsun_local/brand") / name
              if not path.is_file():
                  raise SystemExit(f"Missing Home Assistant brand asset: {path}")
              width, height = png_size(path)
              if width < 128 or height < 128:
                  raise SystemExit(f"Brand asset too small: {path} = {width}x{height}")
              print(f"Brand asset OK: {path} = {width}x{height}")

          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          if hacs.get("name") != "TSUN Local" or hacs.get("homeassistant") != "2026.3.0":
              raise SystemExit(f"Unexpected hacs.json: {hacs}")

          # Guard requested website cleanup and beta3 user-facing state.
          index = read("docs/index.html")
          for forbidden in (
              "Evidence stays explicit",
              "Country value: 8, not 1008",
              "Country mapping attribution and validation",
              "Connection/reconnection pair stays documentation-only",
              "power-level candidate",
          ):
              if forbidden in index:
                  raise SystemExit(f"Stale public website text remains: {forbidden}")

          entities = read("docs/entities.html")
          if "4000 × 0.01 = 40.00 %/Hz" not in entities:
              raise SystemExit("entities.html is missing corrected 0x07EF display")
          if "Active alarm names" not in entities:
              raise SystemExit("entities.html is missing the dedicated alarm-name entity")

          # One-shot trigger/workflow must not remain in the prepared source.
          Path("docs/.prepare-beta3").unlink(missing_ok=True)
          Path(".github/workflows/prepare-beta3.yml").unlink(missing_ok=True)
          PY

      - name: Check prepared diff
        run: git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit prepared beta3 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare TSUN Local 1.5.1-beta.3"
          git push origin HEAD:beta-1097

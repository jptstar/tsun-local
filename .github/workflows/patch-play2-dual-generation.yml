name: Update PLAY2 dual-generation documentation

on:
  push:
    paths:
      - .github/workflows/patch-play2-dual-generation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage and PLAY2 page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Homepage: expose the real PLAY2 1097 / Tengsheng_G4 field variant.
          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          old = '''      <div class="compat-item">
        <div class="compat-head">
          <div>
            <span class="compat-family">GEN3 / GEN3 PLUS</span>
            <span class="compat-protocol">Protocol <strong>1097</strong></span>
          </div>
          <span class="compat-status experimental">🧪 Experimental</span>
        </div>
        <div class="compat-note">Experimental protocol support. Independent hardware validation is still in progress.</div>
      </div>'''
          new = '''      <div class="compat-item">
        <div class="compat-head">
          <div>
            <span class="compat-family">GEN4 / Tengsheng G4</span>
            <span class="compat-protocol">Protocol <strong>1097</strong></span>
          </div>
          <span class="compat-status experimental">🧪 Field testing</span>
        </div>
        <span class="tested-label">Tested microinverters</span>
        <div class="tested-list">
          <a class="tested-device" href="sunology-play2.html"><span><strong>PLAY2</strong><span class="tested-brand">Sunology · G4 variant</span></span><span class="tested-link" aria-hidden="true">→</span></a>
        </div>
        <div class="compat-note">A second PLAY2 hardware generation has been observed on real hardware as <strong>1097 / Tengsheng_G4</strong> (sensor list <strong>4247 / 0x1097</strong>). Stability validation is still in progress.</div>
      </div>'''
          if old not in text:
              raise SystemExit('Homepage 1097 block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # PLAY2 page: document both observed generations/protocols without
          # claiming the still-tested 1097 path is stable.
          path = Path('docs/sunology-play2.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'Use Sunology PLAY2 locally in Home Assistant with stable TSUN Local 1.5.3. Validated automatic discovery, readable alarms, read-only monitoring, no cloud and no proxy over 02B0.':
            'Use Sunology PLAY2 locally in Home Assistant with TSUN Local. Two hardware generations are now observed: a validated GEN3 Plus / 02B0 path and a GEN4 / Tengsheng_G4 / 1097 path under field validation.',
            'Sunology PLAY2, Sunology Play 2, Sunology Home Assistant, PLAY2 Home Assistant, Sunology local API, Sunology local integration, TSUN Local, HACS, 02B0, LSW5BLE':
            'Sunology PLAY2, Sunology Play 2, Sunology Home Assistant, PLAY2 Home Assistant, TSUN Local, HACS, 02B0, 1097, Tengsheng_G4, GEN3 Plus, GEN4, LSW5BLE',
            'Validated automatic local discovery for Sunology PLAY2 with readable alarms. No proxy and no cloud dependency in the Home Assistant data path.':
            'Sunology PLAY2 local support with two observed hardware paths: validated 02B0 / GEN3 Plus and field-tested 1097 / Tengsheng_G4 / GEN4.',
            'Automatic local Sunology PLAY2 monitoring with readable alarms in Home Assistant.':
            'Local Sunology PLAY2 monitoring across the observed 02B0 and 1097 hardware variants.',
            'Validated automatic local discovery, read-only monitoring and readable alarms for Sunology PLAY2 in Home Assistant with TSUN Local 1.5.3.':
            'Local read-only Sunology PLAY2 support in Home Assistant across two observed hardware generations: GEN3 Plus / 02B0 and GEN4 / Tengsheng_G4 / 1097.',
            '"dateModified":"2026-09-06"': '"dateModified":"2026-09-08"',
            '"about":["Sunology PLAY2","Home Assistant","TSUN Local","02B0","local solar monitoring","microinverter alarms"]':
            '"about":["Sunology PLAY2","Home Assistant","TSUN Local","02B0","1097","Tengsheng_G4","GEN3 Plus","GEN4","local solar monitoring"]',
            '<span class="tag">TSUN LOCAL 1.5.3 · VALIDATED ON REAL SUNOLOGY PLAY2 HARDWARE</span>':
            '<span class="tag">TWO PLAY2 HARDWARE PATHS OBSERVED · 02B0 + 1097</span>',
            '<p class="lead">TSUN Local provides a direct, read-only local path from a compatible Sunology PLAY2 to Home Assistant. The validated installation was automatically detected by the normal integration flow.</p>':
            '<p class="lead">Sunology has shipped PLAY2 units with more than one local hardware/protocol path. TSUN Local now recognizes the validated <strong>GEN3 Plus / 02B0</strong> variant and the newer field-tested <strong>GEN4 / Tengsheng_G4 / 1097</strong> variant.</p>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing PLAY2 text: {old[:80]}')
              text = text.replace(old, new, 1)

          section1 = '''  <section><h2>Two PLAY2 generations are now observed</h2><p class="intro">Real-world reports show that <strong>Sunology PLAY2 is not a single local protocol variant</strong>. Two hardware generations have been observed under the same PLAY2 commercial name. TSUN Local detects the local protocol automatically, so the user does not need to choose a generation or protocol manually.</p><div class="grid"><div class="card"><strong>✅ GEN3 Plus · protocol 02B0</strong>Validated on real PLAY2 hardware through the normal Home Assistant integration flow. The tested path uses an LSW5BLE logger and the 02B0 sensor list.</div><div class="card"><strong>🧪 GEN4 · protocol 1097</strong>A second real PLAY2 is detected as <code>Tengsheng_G4</code> with sensor list <code>4247</code> (<code>0x1097</code>). Communication and daily-energy stability are currently being field-tested.</div><div class="card"><strong>✅ Automatic protocol detection</strong>TSUN Local identifies the local protocol at runtime. The same PLAY2 page therefore covers both observed generations.</div><div class="card"><strong>✅ Local read-only telemetry</strong>Both paths remain read-only and do not require a cloud service or proxy in the Home Assistant data path.</div></div><div class="note"><strong>Status:</strong> 02B0 is the validated PLAY2 path. 1097 / Tengsheng_G4 is supported in the current beta and has real-hardware evidence, but remains under field validation until the ongoing stability test is complete.</div></section>'''
          text, count = re.subn(r'  <section><h2>What is validated\?</h2>.*?</section>', section1, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('PLAY2 validation section not found')

          section2 = '''  <section><h2>Two local protocol paths</h2><p class="intro"><strong>Observed PLAY2 generation 1 — GEN3 Plus / 02B0</strong></p><div class="code">Sunology PLAY2
  → GEN3 Plus hardware variant
  → LSW5BLE logger
  → TCP 8899 / Solarman V5
  → sensor list 0x02B0
  → Modbus RTU FC03
  → TSUN Local
  → Home Assistant</div><p class="intro" style="margin-top:20px"><strong>Observed PLAY2 generation 2 — GEN4 / 1097</strong></p><div class="code">Sunology PLAY2
  → GEN4 hardware variant
  → profile Tengsheng_G4
  → sensor list 4247 / 0x1097
  → TSUN Local 1097 adapter
  → Home Assistant</div><div class="note"><strong>Known 02B0 field firmware:</strong> <code>LSW5BLE_17_02B0_1.08-D1</code>. The 1097 PLAY2 is independently identified as <code>Tengsheng_G4</code>. TSUN Local uses what the device exposes locally rather than assuming a protocol from the PLAY2 product name.</div></section>'''
          text, count = re.subn(r'  <section><h2>Validated local protocol path</h2>.*?</section>', section2, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('PLAY2 protocol section not found')

          alarms = '''  <section><h2>Readable alarms on both protocol families</h2><p class="intro">The validated PLAY2 uses the 02B0 alarm catalogue, while the GEN4 field variant uses the 1097 catalogue. TSUN Local keeps stable protocol-specific diagnostic codes, for example <code>02B0-A014</code> or <code>1097-A041</code>, and uses neutral wording where a manufacturer meaning has not been confirmed.</p></section>'''
          text, count = re.subn(r'  <section><h2>Readable alarms in 1\.5\.3 stable</h2>.*?</section>', alarms, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('PLAY2 alarm section not found')

          research = '''  <section><h2>Why are there two PLAY2 protocol paths?</h2><p class="intro">The first independently validated PLAY2 exposed the 02B0 path and was narrowed to the TSUN GEN3 Plus family. A later real-world PLAY2 report exposed a different local identity: <code>1097 / Tengsheng_G4</code>. This indicates that Sunology has shipped at least two local hardware generations under the PLAY2 commercial name. TSUN Local therefore detects the protocol at runtime instead of hard-coding PLAY2 to 02B0.</p><p><a href="https://github.com/jptstar/tsun-local/issues/73">Follow the PLAY2 1097 field-validation issue →</a></p><p><a href="https://github.com/jptstar/tsun-local/blob/main/docs/PLAY2_LOCAL_RESEARCH.md">Read the original PLAY2 protocol research history →</a></p></section>'''
          text, count = re.subn(r'  <section><h2>Why was a special PLAY2 probe needed before\?</h2>.*?</section>', research, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('PLAY2 research section not found')

          credit = '''  <section><h2>Community validation credit</h2><p class="intro">Thanks to <a href="https://github.com/dca31"><strong>@dca31</strong></a> for independently validating the PLAY2 GEN3 Plus / 02B0 path through the normal TSUN Local Home Assistant flow, and to <a href="https://github.com/phildeg31"><strong>@phildeg31</strong></a> for the real-hardware PLAY2 1097 / Tengsheng_G4 diagnostics and ongoing stability testing.</p></section>'''
          text, count = re.subn(r'  <section><h2>Community validation credit</h2>.*?</section>', credit, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('PLAY2 credit section not found')

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add docs/index.html docs/sunology-play2.html
          git rm .github/workflows/patch-play2-dual-generation.yml
          git diff --cached --check
          git commit -m "Document both Sunology PLAY2 generations"
          git push

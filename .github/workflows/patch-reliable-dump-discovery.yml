name: Patch reliable dump discovery

on:
  push:
    branches:
      - fix/reliable-dump-discovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[reliable-dump-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch dumper discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/tsun_dump.py')
          text = path.read_text()

          text = text.replace(
              'import argparse\nfrom dataclasses import dataclass, field\nfrom datetime import UTC, datetime\nimport getpass\nimport hashlib\nimport json\nfrom pathlib import Path\nimport re\nimport socket\nimport sys\nimport time\nfrom typing import Any, Iterable\n',
              'import argparse\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom dataclasses import dataclass, field\nfrom datetime import UTC, datetime\nimport getpass\nimport hashlib\nfrom ipaddress import IPv4Address, IPv4Network, ip_network\nimport json\nfrom pathlib import Path\nimport re\nimport socket\nimport sys\nimport time\nfrom typing import Any, Iterable\n',
          )
          text = text.replace('TOOL_VERSION = "2.1.0"', 'TOOL_VERSION = "2.2.0"')
          text = text.replace(
              'DEFAULT_DISCOVERY_TIMEOUT = 4.0\nDEFAULT_TIMEOUT = 6.0\n',
              'DEFAULT_DISCOVERY_TIMEOUT = 4.0\nDEFAULT_TCP_SCAN_TIMEOUT = 0.45\nDEFAULT_DISCOVERY_CONCURRENCY = 64\nMIN_SCAN_PREFIX = 24\nPROTOCOL_PROBE_RETRIES = 2\nPROTOCOL_RETRY_DELAY = 0.35\nDEFAULT_TIMEOUT = 6.0\n',
          )

          old = '''def discover_devices(\n    *, port: int = DEFAULT_DISCOVERY_PORT, timeout: float = DEFAULT_DISCOVERY_TIMEOUT\n) -> list[DiscoveryDevice]:\n    """Return every logger answering the read-only UDP discovery probes."""\n    devices: dict[str, DiscoveryDevice] = {}\n    sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n    sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    sock.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)\n    try:\n        sock.bind(("", port))\n        for message in DISCOVERY_MESSAGES:\n            sock.sendto(message, ("255.255.255.255", port))\n        deadline = time.monotonic() + timeout\n        while (remaining := deadline - time.monotonic()) > 0:\n            sock.settimeout(remaining)\n            try:\n                payload, (source, _source_port) = sock.recvfrom(4096)\n            except socket.timeout:\n                break\n            if payload in DISCOVERY_MESSAGES:\n                continue\n            device = devices.setdefault(source, DiscoveryDevice(host=source))\n            device.replies += 1\n            device.serial_candidates.update(serial_candidates_from_payload(payload))\n    except OSError:\n        return []\n    finally:\n        sock.close()\n    return sorted(devices.values(), key=lambda item: tuple(int(p) for p in item.host.split(".")))\n'''
          new = '''def _host_sort_key(host: str) -> tuple[int, int, int, int]:\n    return tuple(int(part) for part in host.split("."))  # type: ignore[return-value]\n\n\ndef discover_udp_targets(\n    targets: Iterable[str],\n    *,\n    port: int = DEFAULT_DISCOVERY_PORT,\n    timeout: float = DEFAULT_DISCOVERY_TIMEOUT,\n) -> list[DiscoveryDevice]:\n    """Collect every logger answering read-only UDP probes sent to targets."""\n    devices: dict[str, DiscoveryDevice] = {}\n    destinations = tuple(dict.fromkeys(targets))\n    sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n    sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    sock.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)\n    try:\n        sock.bind(("", port))\n        # Send the three known probes twice. Some embedded loggers occasionally\n        # miss the first datagram while busy serving TCP/cloud traffic.\n        for _attempt in range(2):\n            for target in destinations:\n                for message in DISCOVERY_MESSAGES:\n                    try:\n                        sock.sendto(message, (target, port))\n                    except OSError:\n                        continue\n            if _attempt == 0:\n                time.sleep(0.12)\n        deadline = time.monotonic() + timeout\n        while (remaining := deadline - time.monotonic()) > 0:\n            sock.settimeout(remaining)\n            try:\n                payload, (source, _source_port) = sock.recvfrom(4096)\n            except socket.timeout:\n                break\n            if payload in DISCOVERY_MESSAGES:\n                continue\n            device = devices.setdefault(source, DiscoveryDevice(host=source))\n            device.replies += 1\n            device.serial_candidates.update(serial_candidates_from_payload(payload))\n    except OSError:\n        return []\n    finally:\n        sock.close()\n    return sorted(devices.values(), key=lambda item: _host_sort_key(item.host))\n\n\ndef discover_devices(\n    *, port: int = DEFAULT_DISCOVERY_PORT, timeout: float = DEFAULT_DISCOVERY_TIMEOUT\n) -> list[DiscoveryDevice]:\n    """Backward-compatible global-broadcast UDP discovery helper."""\n    return discover_udp_targets(("255.255.255.255",), port=port, timeout=timeout)\n\n\ndef _parse_scan_network(value: str) -> IPv4Network:\n    network = ip_network(value.strip(), strict=False)\n    if not isinstance(network, IPv4Network):\n        raise ValueError("An IPv4 network is required")\n    if network.prefixlen < MIN_SCAN_PREFIX:\n        raise ValueError("Discovery network must be /24 or smaller")\n    return network\n\n\ndef _network_around_host(host: str) -> IPv4Network:\n    return ip_network(f"{IPv4Address(host)}/{MIN_SCAN_PREFIX}", strict=False)\n\n\ndef _tcp_port_open(host: str, port: int, timeout: float) -> bool:\n    try:\n        with socket.create_connection((host, port), timeout=timeout):\n            return True\n    except OSError:\n        return False\n\n\ndef scan_tcp_network(\n    network: IPv4Network,\n    port: int,\n    *,\n    timeout: float = DEFAULT_TCP_SCAN_TIMEOUT,\n) -> list[str]:\n    """Find hosts accepting the TSUN TCP port without sending application data."""\n    hosts = [str(host) for host in network.hosts()]\n    if not hosts:\n        return []\n    found: list[str] = []\n    workers = min(DEFAULT_DISCOVERY_CONCURRENCY, len(hosts))\n    with ThreadPoolExecutor(max_workers=workers) as executor:\n        futures = {executor.submit(_tcp_port_open, host, port, timeout): host for host in hosts}\n        for future in as_completed(futures):\n            host = futures[future]\n            try:\n                if future.result():\n                    found.append(host)\n            except OSError:\n                pass\n    return sorted(found, key=_host_sort_key)\n\n\ndef discover_candidates(\n    args: argparse.Namespace,\n) -> tuple[list[DiscoveryDevice], dict[str, int]]:\n    """Combine UDP discovery with bounded TCP /24 fallback like TSUN Local."""\n    explicit_networks = {_parse_scan_network(value) for value in (args.network or [])}\n    udp_targets = {"255.255.255.255"}\n    udp_targets.update(str(network.broadcast_address) for network in explicit_networks)\n\n    initial_udp = discover_udp_targets(udp_targets, timeout=args.discovery_timeout)\n    devices = {device.host: device for device in initial_udp}\n\n    networks = set(explicit_networks)\n    networks.update(_network_around_host(device.host) for device in initial_udp)\n\n    tcp_hosts: set[str] = set()\n    for network in sorted(networks, key=lambda item: (int(item.network_address), item.prefixlen)):\n        print(f"TCP discovery: scanning {network} on port {args.port}...")\n        tcp_hosts.update(\n            scan_tcp_network(network, args.port, timeout=args.tcp_scan_timeout)\n        )\n\n    # A logger may ignore broadcast discovery but answer a direct UDP probe.\n    # Probe every TCP candidate directly so its Monitor SN can still be learned.\n    if tcp_hosts:\n        directed = discover_udp_targets(\n            sorted(tcp_hosts, key=_host_sort_key),\n            timeout=min(args.discovery_timeout, 2.5),\n        )\n        for incoming in directed:\n            current = devices.setdefault(incoming.host, DiscoveryDevice(host=incoming.host))\n            current.replies += incoming.replies\n            current.serial_candidates.update(incoming.serial_candidates)\n\n    # Keep TCP-only candidates too. They are still validated later by a real\n    # read-only protocol probe; a non-TSUN service simply fails and is skipped.\n    for host in tcp_hosts:\n        devices.setdefault(host, DiscoveryDevice(host=host))\n\n    return (\n        sorted(devices.values(), key=lambda item: _host_sort_key(item.host)),\n        {\n            "udp_devices": len(initial_udp),\n            "tcp_candidates": len(tcp_hosts),\n            "networks_scanned": len(networks),\n        },\n    )\n'''
          if old not in text:
              raise SystemExit('discover_devices block not found')
          text = text.replace(old, new)

          text = text.replace(
              'devices = discover_devices(timeout=args.discovery_timeout)\n            report["devices_found"] = len(devices)',
              'devices = discover_udp_targets((host, "255.255.255.255"), timeout=args.discovery_timeout)\n            report["devices_found"] = len(devices)',
              1,
          )
          text = text.replace(
              'print("Searching the local network for all TSUN loggers (read-only UDP)...")\n    devices = discover_devices(timeout=args.discovery_timeout)\n    summary["devices_found"] = len(devices)',
              'print("Searching the local network for all TSUN loggers (UDP + bounded TCP fallback)...")\n    devices, discovery_stats = discover_candidates(args)\n    summary["devices_found"] = len(devices)\n    print(\n        "Discovery results: "\n        f"UDP={discovery_stats[\'udp_devices\']}, "\n        f"TCP candidates={discovery_stats[\'tcp_candidates\']}, "\n        f"networks scanned={discovery_stats[\'networks_scanned\']}"\n    )',
          )
          text = text.replace(
              'print(f"{len(devices)} candidate logger(s) found. Every discovered logger will be captured.")',
              'print(f"{len(devices)} candidate logger(s) found. Every candidate will be validated and captured.")',
          )

          old_detect = '''    candidates = (requested,) if requested != "auto" else SUPPORTED_PROTOCOLS\n    last_error: Exception | None = None\n    for protocol in candidates:\n        try:\n            _probe_protocol(protocol, host, port, sn, timeout)\n        except Exception as err:\n            last_error = err\n            attempts.append(\n                {"protocol": protocol, "result": "failure", "error": safe_error_details(err)}\n            )\n            continue\n        attempts.append({"protocol": protocol, "result": "success"})\n        return protocol, attempts\n    raise RuntimeError("No supported TSUN local protocol detected") from last_error\n'''
          new_detect = '''    candidates = (requested,) if requested != "auto" else SUPPORTED_PROTOCOLS\n    last_error: Exception | None = None\n    for protocol in candidates:\n        failures: list[dict[str, Any]] = []\n        for attempt in range(1, PROTOCOL_PROBE_RETRIES + 1):\n            try:\n                _probe_protocol(protocol, host, port, sn, timeout)\n            except Exception as err:\n                last_error = err\n                failures.append({"attempt": attempt, "error": safe_error_details(err)})\n                if attempt < PROTOCOL_PROBE_RETRIES:\n                    time.sleep(PROTOCOL_RETRY_DELAY)\n                continue\n            attempts.append(\n                {"protocol": protocol, "result": "success", "attempt": attempt}\n            )\n            return protocol, attempts\n        attempts.append(\n            {"protocol": protocol, "result": "failure", "attempts": failures}\n        )\n    raise RuntimeError(\n        f"No supported TSUN local protocol detected after {PROTOCOL_PROBE_RETRIES} attempts per protocol"\n    ) from last_error\n'''
          if old_detect not in text:
              raise SystemExit('detect_protocol block not found')
          text = text.replace(old_detect, new_detect)

          parser_anchor = '''    parser.add_argument(\n        "--discovery-timeout",\n        type=_non_negative_float,\n        default=DEFAULT_DISCOVERY_TIMEOUT,\n    )\n'''
          parser_new = parser_anchor + '''    parser.add_argument(\n        "--tcp-scan-timeout",\n        type=_non_negative_float,\n        default=DEFAULT_TCP_SCAN_TIMEOUT,\n        help="TCP connect timeout used by bounded discovery fallback",\n    )\n    parser.add_argument(\n        "--network",\n        action="append",\n        default=[],\n        metavar="CIDR",\n        help="additional IPv4 /24-or-smaller network to scan, e.g. 10.89.10.0/24; may be repeated",\n    )\n'''
          if parser_anchor not in text:
              raise SystemExit('parser anchor not found')
          text = text.replace(parser_anchor, parser_new)

          path.write_text(text)

          # Tests
          test_path = Path('tests/test_tsun_dump_tool.py')
          tests = test_path.read_text()
          tests = tests.replace('self.assertEqual(TOOL.TOOL_VERSION, "2.1.0")', 'self.assertEqual(TOOL.TOOL_VERSION, "2.2.0")')
          marker = '''    def test_extracts_single_monitor_sn_from_json_discovery(self) -> None:\n'''
          addition = '''    def test_bounded_network_parser_accepts_24(self) -> None:\n        network = TOOL._parse_scan_network("10.89.10.0/24")\n        self.assertEqual(str(network), "10.89.10.0/24")\n\n    def test_bounded_network_parser_rejects_wide_network(self) -> None:\n        with self.assertRaises(ValueError):\n            TOOL._parse_scan_network("10.89.0.0/16")\n\n    def test_network_around_discovered_host_is_24(self) -> None:\n        self.assertEqual(\n            str(TOOL._network_around_host("10.89.10.14")),\n            "10.89.10.0/24",\n        )\n\n'''
          if marker not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(marker, addition + marker)
          test_path.write_text(tests)

          # README
          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old_readme = '''**All TSUN loggers discovered on the local network are captured automatically.** The tool processes them sequentially and creates **one JSON per device**. If an individual Monitor SN is missing, it asks only for that device; with several devices, Enter skips that logger and continues with the others. `--host` intentionally limits the run to a single logger.\n\nIP addresses and Monitor SN values are never stored in the generated JSON. One failed device does not stop the remaining network scan.\n'''
          new_readme = '''**All TSUN loggers discovered on the local network are captured automatically.** Discovery now combines repeated UDP probes with a **bounded TCP port-8899 scan** of each discovered `/24`, so a logger that ignores broadcast discovery can still be found. TCP candidates are then probed directly by UDP to recover the Monitor SN where possible.\n\nFor routed VLANs where no UDP reply is received at all, specify the network explicitly, for example `python3 tsun_dump.py --network 10.89.10.0/24 --full`. The scan is deliberately limited to `/24` or smaller networks. The tool processes candidates sequentially and creates **one JSON per device**; one failed device does not stop the others. `--host` intentionally limits the run to a single logger.\n\nIP addresses and Monitor SN values are never stored in the generated JSON. Protocol detection is retried before a device is declared unsupported.\n'''
          if old_readme not in readme:
              raise SystemExit('README discovery paragraph not found')
          readme_path.write_text(readme.replace(old_readme, new_readme))

          # Guide
          guide_path = Path('docs/HARDWARE_DUMP.md')
          guide = guide_path.read_text()
          guide = guide.replace(
              'The tool sends read-only UDP discovery probes on the local network. **When `--host` is not supplied, every discovered TSUN logger is processed automatically and a separate JSON dump is generated for each one.**',
              'The tool first sends repeated read-only UDP discovery probes. It then performs a **bounded TCP scan on port 8899** for each discovered `/24` (and for each network supplied with `--network`) and directly UDP-probes TCP-only candidates. **When `--host` is not supplied, every resulting candidate is validated and a separate JSON dump is generated for each supported TSUN logger.**',
          )
          note = '''> [!NOTE]\n> UDP broadcast discovery normally stays inside the local broadcast domain. Devices behind another VLAN/subnet may require an explicit `--host` unless broadcast forwarding is configured.\n'''
          replacement = '''> [!NOTE]\n> UDP broadcast discovery normally stays inside the local broadcast domain. For a routed VLAN/subnet, use a bounded network scan such as:\n>\n> ```bash\n> python3 tsun_dump.py --network 10.89.10.0/24 --full\n> ```\n>\n> `--network` accepts only `/24` or smaller IPv4 networks and may be repeated. If one logger is found by UDP, its `/24` is scanned automatically, which can reveal neighboring TSUN loggers that do not answer broadcast discovery.\n'''
          if note not in guide:
              raise SystemExit('guide note not found')
          guide = guide.replace(note, replacement)
          guide = guide.replace(
              '- all discovered loggers processed sequentially, avoiding simultaneous high-rate polling;',
              '- repeated UDP discovery plus bounded `/24` TCP fallback on port 8899;\n- direct UDP retry for TCP-only candidates;\n- protocol detection retried before a candidate is rejected;\n- all discovered loggers processed sequentially, avoiding simultaneous high-rate polling;',
          )
          guide_path.write_text(guide)
          PY

          python3 -m unittest tests/test_tsun_dump_tool.py

          rm -f .github/workflows/patch-reliable-dump-discovery.yml
          rm -f .github/reliable-dump-patch-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/tsun_dump.py tests/test_tsun_dump_tool.py README.md docs/HARDWARE_DUMP.md .github/workflows/patch-reliable-dump-discovery.yml .github/reliable-dump-patch-trigger.txt
          git commit -m "Improve standalone dumper network discovery"
          git push

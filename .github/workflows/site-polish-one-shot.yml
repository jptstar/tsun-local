name: Apply public site polish

on:
  push:
    branches:
      - docs/site-polish-2026-09-08
    paths:
      - .github/workflows/site-polish-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested documentation changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          DOCS = ROOT / 'docs'

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=re.S):
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Missing expected pattern for {label}')
              return text

          hacs_pattern = re.compile(
              r'<a class="(?:button|btn) primary" href="https://my\.home-assistant\.io/redirect/hacs_repository/\?owner=jptstar&amp;repository=tsun-local&amp;category=integration">(?:Add TSUN Local to HACS|Add to HACS)</a>'
          )
          hacs_badge = (
              '<a class="hacs-badge" href="https://my.home-assistant.io/redirect/hacs_repository/?owner=jptstar&amp;repository=tsun-local&amp;category=integration">'
              '<img alt="Add TSUN Local to HACS" src="https://my.home-assistant.io/badges/hacs_repository.svg"></a>'
          )
          for path in DOCS.glob('*.html'):
              text = read(path)
              text, count = hacs_pattern.subn(hacs_badge, text)
              if count:
                  if '.hacs-badge{' not in text:
                      text = text.replace(
                          '</style>',
                          '.hacs-badge{display:inline-flex;align-items:center}.hacs-badge img{display:block;height:44px;width:auto;max-width:100%}\n  </style>',
                          1,
                      )
                  write(path, text)

          index_path = DOCS / 'index.html'
          index = read(index_path)
          index = regex_once(
              index,
              r'\n  <section id="adaptive-polling">.*?</section>\n',
              '\n',
              'redundant adaptive polling section',
          )
          index = replace_once(
              index,
              '    <span class="section-badge beta">NEW IN 1.5.3</span>\n    <h2>Alarms you can actually read</h2>\n    <p class="intro">The 1.5.3 extends readable alarm presentation across 1511, 02B0 and 1097. Known alarms get clear localized descriptions while stable protocol-position codes remain available for diagnosis.</p>',
              '    <h2>Alarms you can actually read</h2>\n    <p class="intro">TSUN Local presents readable alarms across 1511, 02B0 and 1097. Known alarms get clear localized descriptions while stable protocol-position codes remain available for diagnosis.</p>',
              'versionless alarm section',
          )
          index = index.replace('<span class="compat-family">GEN4 / Tengsheng G4</span>', '<span class="compat-family">GEN4</span>')
          index = re.sub(
              r'\n        <div class="compat-note">A second PLAY2 hardware generation has been observed on real hardware as <strong>1097 / Tengsheng_G4</strong> \(sensor list <strong>4247 / 0x1097</strong>\)\. Stability validation is still in progress\.</div>',
              '',
              index,
              count=1,
          )
          index = index.replace(
              'href="https://github.com/jptstar/tsun-local/releases/download/diagnostic-latest/TSUN-Local-Diagnostic.exe"><strong>Windows diagnostic →</strong>',
              'href="test-your-inverter.html#windows"><strong>Windows diagnostic →</strong>',
              1,
          )
          entity_card = '      <a class="card" style="display:block;color:inherit;text-decoration:none" href="entities.html"><strong>Entity reference →</strong><span class="muted">Visual guide to the main Home Assistant entities, protocol-specific diagnostics and alarm fields.</span></a>\n'
          if entity_card not in index:
              marker = '    <div class="grid">\n      <a class="card" style="display:block;color:inherit;text-decoration:none" href="test-your-inverter.html#windows"><strong>Windows diagnostic →</strong>'
              index = replace_once(index, marker, '    <div class="grid">\n' + entity_card + '      <a class="card" style="display:block;color:inherit;text-decoration:none" href="test-your-inverter.html#windows"><strong>Windows diagnostic →</strong>', 'homepage entity card')
          phildeg_credit = '      <span><a href="https://github.com/phildeg31"><strong>@phildeg31</strong></a> — real-hardware Sunology PLAY2 GEN4 / 1097 diagnostics and ongoing stability validation.</span>\n'
          if phildeg_credit not in index:
              marker = '      <span><a href="https://github.com/dca31"><strong>@dca31</strong></a> — independent Sunology PLAY2 validation through the normal TSUN Local Home Assistant flow.</span>\n'
              index = replace_once(index, marker, marker + phildeg_credit, 'homepage phildeg31 credit')
          write(index_path, index)

          play_path = DOCS / 'sunology-play2.html'
          play = read(play_path)
          play = play.replace('validated GEN3 Plus / 02B0 path and a GEN4 / Tengsheng_G4 / 1097 path under field validation.', 'validated GEN3 Plus / 02B0 path and a GEN4 / 1097 path under field validation.')
          play = play.replace('Sunology PLAY2 in Home Assistant with TSUN Local 1.5.3', 'Sunology PLAY2 in Home Assistant with TSUN Local')
          play = play.replace('validated 02B0 / GEN3 Plus and field-tested 1097 / Tengsheng_G4 / GEN4.', 'validated 02B0 / GEN3 Plus and field-tested 1097 / GEN4.')
          play = play.replace('GEN3 Plus / 02B0 and GEN4 / Tengsheng_G4 / 1097.', 'GEN3 Plus / 02B0 and GEN4 / 1097.')
          play = play.replace('the newer field-tested <strong>GEN4 / Tengsheng_G4 / 1097</strong> variant.', 'the field-tested <strong>GEN4 / 1097</strong> variant.')
          play = play.replace('A second real PLAY2 is detected as <code>Tengsheng_G4</code> with sensor list <code>4247</code> (<code>0x1097</code>). Communication and daily-energy stability are currently being field-tested.', 'The GEN4 PLAY2 path is detected with sensor list <code>4247</code> (<code>0x1097</code>). Communication and daily-energy stability are currently being field-tested.')
          play = play.replace('1097 / Tengsheng_G4 is supported in the current beta and has real-hardware evidence, but remains under field validation until the ongoing stability test is complete.', 'GEN4 / 1097 has real-hardware evidence and remains under field validation while the ongoing stability test is completed.')
          play = play.replace('The 1097 PLAY2 is independently identified as <code>Tengsheng_G4</code>. TSUN Local uses what the device exposes locally rather than assuming a protocol from the PLAY2 product name.', 'The GEN4 unit reports the <code>Tengsheng_G4</code> profile internally. TSUN Local uses what the device exposes locally rather than assuming a protocol from the PLAY2 product name.')
          play = play.replace('A later real-world PLAY2 report exposed a different local identity: <code>1097 / Tengsheng_G4</code>. This indicates that Sunology has shipped at least two local hardware generations under the PLAY2 commercial name.', 'Another real-world PLAY2 report exposed protocol <code>1097</code>, confirming a GEN4 local path under the same PLAY2 commercial name.')
          play = play.replace('real-hardware PLAY2 1097 / Tengsheng_G4 diagnostics and ongoing stability testing.', 'real-hardware PLAY2 GEN4 / 1097 diagnostics and ongoing stability testing.')
          if '1.5.3' in play:
              raise SystemExit('Old 1.5.3 reference remains on PLAY2 page')
          write(play_path, play)

          contrib_path = DOCS / 'contributors.html'
          contrib = read(contrib_path)
          contrib = contrib.replace(
              'Credits for TSUN Local, the local Home Assistant integration for TSUN microinverters: 1097 discovery, protocol research, country-profile research, Sunology PLAY2 validation, TSOL-MS800 hardware validation and TSOL-MS2000 hardware validation.',
              'Credits for TSUN Local, the local Home Assistant integration for TSUN microinverters: protocol research, Sunology PLAY2 02B0 and GEN4 / 1097 validation, TSOL-MP3000 validation, TSOL-MS800 validation and TSOL-MS2000 validation.',
          )
          contrib = contrib.replace('"dateModified":"2026-09-05"', '"dateModified":"2026-09-08"')
          phildeg_card = '<div class="card"><span class="role">Sunology PLAY2 GEN4 / 1097 field validation</span><a href="https://github.com/phildeg31"><strong>@phildeg31</strong></a><p>Shared real-hardware PLAY2 diagnostics for the GEN4 / 1097 path and is carrying out the ongoing stability validation, including communication and daily-energy behaviour.</p></div>\n'
          if phildeg_card not in contrib:
              marker = '<div class="card"><span class="role">Independent hardware validation</span><a href="https://github.com/dca31"><strong>@dca31</strong></a><p>Validated a real Sunology PLAY2 with the normal TSUN Local Home Assistant setup, confirming automatic discovery and the supported local 02B0 path on independent hardware.</p></div>\n'
              contrib = replace_once(contrib, marker, marker + phildeg_card, 'contributors phildeg31 card')
          old_palo = '<div class="card"><span class="role">Independent TSOL-MS2000 hardware validation</span><a href="https://github.com/paloindici"><strong>@paloindici</strong></a><p>Validated TSUN Local on a real TSOL-MS2000 with four PV inputs, shared anonymized Home Assistant diagnostics for the MS2000 and MP3000, and provided the hardware dump that confirmed the tested 02B0 path and helped improve logger metadata parsing in the standalone diagnostic tool.</p></div>'
          new_palo = '<div class="card"><span class="role">TSOL-MS2000 &amp; TSOL-MP3000 hardware validation</span><a href="https://github.com/paloindici"><strong>@paloindici</strong></a><p>Validated TSUN Local on a real TSOL-MS2000 with four PV inputs and shared anonymized diagnostics plus hardware dumps from both the MS2000 and MP3000. The MP3000 evidence helped validate the TITAN / 1511 path, six-PV telemetry and firmware/temperature behaviour on independent hardware.</p></div>'
          contrib = replace_once(contrib, old_palo, new_palo, 'contributors MP3000 credit')
          write(contrib_path, contrib)

          mp_path = DOCS / 'tsol-mp3000-home-assistant.html'
          mp = read(mp_path)
          if 'dateModified' not in mp:
              mp = mp.replace('"mainEntityOfPage":"https://jptstar.github.io/tsun-local/tsol-mp3000-home-assistant.html",', '"mainEntityOfPage":"https://jptstar.github.io/tsun-local/tsol-mp3000-home-assistant.html",\n        "dateModified":"2026-09-08",', 1)
          validation_section = '''\n  <section id="community-validation">\n    <h2>Community validation</h2>\n    <p class="intro">Independent MP3000 diagnostics complement the maintainer's reference hardware and help confirm that the TITAN / 1511 mapping is consistent across installations.</p>\n    <div class="grid">\n      <div class="card"><strong><a href="https://github.com/paloindici">@paloindici</a></strong><span class="muted">Shared anonymized Home Assistant diagnostics and hardware dumps from a real TSOL-MP3000. These captures helped verify the six-PV path and investigate firmware-dependent diagnostic values.</span></div>\n      <div class="card"><strong>Open field validation</strong><span class="muted">Additional MP3000 hardware revisions remain welcome so firmware and logger differences can be compared without changing the read-only protocol contract.</span></div>\n      <a class="card" style="display:block;color:inherit;text-decoration:none" href="contributors.html"><strong>All contributors →</strong><span class="muted">See the project-wide credits and the exact contribution attributed to each tester or research source.</span></a>\n    </div>\n  </section>\n'''
          if 'id="community-validation"' not in mp:
              marker = '\n  <section id="install">'
              mp = replace_once(mp, marker, validation_section + marker, 'MP3000 community validation section')
          write(mp_path, mp)

          test_path = DOCS / 'test-your-inverter.html'
          test = read(test_path)
          test = test.replace('pre{margin:10px 0 0;padding:14px 16px;overflow:auto;border-radius:12px;background:#0b1930;color:#f4f8ff}', 'pre{margin:7px 0 0;padding:10px 12px;overflow:auto;border-radius:10px;background:#0b1930;color:#f4f8ff;font-size:12.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}')
          test = test.replace('.python-highlight{margin-top:22px;padding:22px;border:2px solid var(--blue);border-radius:18px;background:#eef5ff}', '.python-highlight{margin-top:18px;padding:16px;border:1px solid #bdd3ee;border-radius:16px;background:#eef5ff}')
          test = test.replace('.python-highlight strong{display:block;font-size:20px}.python-highlight p{margin:12px 0 0;color:#38506d}', '.python-highlight>strong{display:block;font-size:18px}.python-highlight p{margin:9px 0 0;color:#38506d;font-size:14px}')
          test = test.replace('.command-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}', '.command-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}')
          test = test.replace('.command-card{padding:16px;border:1px solid #cbdcf0;border-radius:14px;background:#fff}', '.command-card{min-width:0;padding:11px;border:1px solid #cbdcf0;border-radius:12px;background:#fff}')
          test = test.replace('.command-card strong{font-size:16px}.command-card p{margin:5px 0 0;color:var(--muted)}', '.command-card strong{font-size:14px}.command-card p{margin:4px 0 0;color:var(--muted);font-size:13px}')
          if 'section[id]{scroll-margin-top:18px}' not in test:
              test = test.replace('section{margin-top:28px;padding:32px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow)}', 'section{margin-top:28px;padding:32px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow)}\n    section[id]{scroll-margin-top:18px}')
          write(test_path, test)

          sync_path = ROOT / '.github' / 'workflows' / 'sync-diagnostic-docs.yml'
          sync = read(sync_path)
          sync = sync.replace('      - "scripts/sync_play2_dual_generation_docs.py"\n', '')
          sync = sync.replace('          python scripts/sync_play2_dual_generation_docs.py\n', '')
          write(sync_path, sync)
          play_sync = ROOT / 'scripts' / 'sync_play2_dual_generation_docs.py'
          if play_sync.exists():
              play_sync.unlink()

          metadata_path = ROOT / 'tests' / 'test_metadata.py'
          metadata = read(metadata_path)
          if "self.assertIn('entities.html', index)" not in metadata:
              metadata = metadata.replace("        self.assertIn('sunology-play2.html', index)\n", "        self.assertIn('sunology-play2.html', index)\n        self.assertIn('entities.html', index)\n", 1)
          metadata = metadata.replace('        self.assertIn("Tengsheng_G4", play2)\n', '        self.assertIn("GEN4 / 1097", play2)\n        self.assertIn("phildeg31", play2)\n')
          write(metadata_path, metadata)

          webtest_path = ROOT / 'tests' / 'test_release_154_web.py'
          webtest = read(webtest_path)
          webtest = webtest.replace('        self.assertIn("TSUN-Local-Diagnostic.exe", text)\n', '        self.assertIn("test-your-inverter.html#windows", text)\n        self.assertIn("test-your-inverter.html#python", text)\n        self.assertIn("test-your-inverter.html#mac-linux", text)\n        self.assertIn("entities.html", text)\n', 1)
          official_badge_test = '''\n    def test_public_hacs_actions_use_official_badge(self) -> None:\n        for filename in (\n            "index.html",\n            "sunology-play2.html",\n            "tsol-mp3000-home-assistant.html",\n            "tsol-mx500-home-assistant.html",\n            "tsol-ms800-home-assistant.html",\n            "tsol-ms2000-home-assistant.html",\n        ):\n            text = (DOCS / filename).read_text(encoding="utf-8")\n            self.assertIn("https://my.home-assistant.io/badges/hacs_repository.svg", text, filename)\n            self.assertNotRegex(text, r">(?:Add TSUN Local to HACS|Add to HACS)</a>", filename)\n\n'''
          if 'test_public_hacs_actions_use_official_badge' not in webtest:
              webtest = webtest.replace('    def test_hardware_test_page_promotes_current_diagnostic(self) -> None:\n', official_badge_test + '    def test_hardware_test_page_promotes_current_diagnostic(self) -> None:\n')
          write(webtest_path, webtest)

          final_index = read(index_path)
          final_play = read(play_path)
          final_mp = read(mp_path)
          final_contrib = read(contrib_path)
          assert 'NEW IN 1.5.3' not in final_index
          assert 'The 1.5.3 extends' not in final_index
          assert '<span class="compat-family">GEN4</span>' in final_index
          assert 'A second PLAY2 hardware generation' not in final_index
          assert 'test-your-inverter.html#windows' in final_index
          assert 'entities.html' in final_index
          assert '@phildeg31' in final_index
          assert '1.5.3' not in final_play
          assert '@phildeg31' in final_play
          assert '@paloindici' in final_mp
          assert '@phildeg31' in final_contrib
          assert 'TSOL-MP3000 hardware validation' in final_contrib
          PY

          python -m unittest discover -s tests -v
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git rm .github/workflows/site-polish-one-shot.yml
          git add docs .github/workflows/sync-diagnostic-docs.yml scripts tests
          git diff --cached --check
          git commit -m "Polish public documentation and contributor credits"
          git push origin HEAD:docs/site-polish-2026-09-08

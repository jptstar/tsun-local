name: Polish TSUN Local 1.5.4 READMEs

on:
  push:
    branches:
      - docs/readme-refresh-1.5.4
    paths:
      - .github/workflows/polish-readmes-154.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: docs/readme-refresh-1.5.4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Polish README presentation
        run: python .github/scripts/polish_readmes_154.py

      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          git diff --check
          grep -q '**Sunology PLAY2**' README.md
          ! grep -q '**`Sunology PLAY2`**' README.md
          ! grep -q 'sensor_list=0x02B0' README.md
          ! grep -q 'LSW5BLE_17_02B0_1.08-D1' README.md

      - name: Remove temporary files
        run: |
          rm .github/scripts/polish_readmes_154.py
          rm .github/workflows/polish-readmes-154.yml

      - name: Commit presentation polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish compact 1.5.4 README presentation'
          git push origin HEAD:docs/readme-refresh-1.5.4

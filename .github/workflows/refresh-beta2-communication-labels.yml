name: Refresh beta2 communication labels

on:
  push:
    branches:
      - beta-1097

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.head_commit.message == 'Refresh beta2 communication labels' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta2 source
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Expand communication labels and clarify slowdown counter
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          names = {
              'custom_components/tsun_local/strings.json': ('Communication', 'Slowdowns'),
              'custom_components/tsun_local/translations/en.json': ('Communication', 'Slowdowns'),
              'custom_components/tsun_local/translations/fr.json': ('Communication', 'Ralentissements'),
              'custom_components/tsun_local/translations/de.json': ('Kommunikation', 'Verlangsamungen'),
              'custom_components/tsun_local/translations/es.json': ('Comunicación', 'Ralentizaciones'),
              'custom_components/tsun_local/translations/it.json': ('Comunicazione', 'Rallentamenti'),
              'custom_components/tsun_local/translations/nl.json': ('Communicatie', 'Vertragingen'),
              'custom_components/tsun_local/translations/pl.json': ('Komunikacja', 'Spowolnienia'),
              'custom_components/tsun_local/translations/zh-Hans.json': ('通信', '降速次数'),
          }
          keys = (
              'communication_last_success',
              'communication_duration',
              'communication_blocks',
              'communication_failures',
              'communication_successes_consecutive',
              'adaptive_polling_interval',
              'adaptive_backoff_events',
              'adaptive_polling_state',
              'adaptive_polling_reason',
          )

          for filename, (prefix, slowdown) in names.items():
              path = root / filename
              data = json.loads(path.read_text(encoding='utf-8'))
              sensors = data['entity']['sensor']
              for key in keys:
                  current = sensors[key]['name']
                  suffix = current.split(' — ', 1)[1] if ' — ' in current else current
                  sensors[key]['name'] = f'{prefix} — {suffix}'
              sensors['adaptive_backoff_events']['name'] = f'{prefix} — {slowdown}'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = root / 'tests/test_beta2_release_contract.py'
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('"Com. — État"', '"Communication — État"')
          test_text = test_text.replace('"Com. — Dernière réponse"', '"Communication — Dernière réponse"')
          test_text = test_text.replace('"Com. — Échecs"', '"Communication — Échecs"')
          test_text = test_text.replace('"Com. — Intervalle"', '"Communication — Intervalle"')
          anchor = '        self.assertEqual(sensors["adaptive_polling_interval"]["name"], "Communication — Intervalle")\n'
          if 'Communication — Ralentissements' not in test_text:
              test_text = test_text.replace(
                  anchor,
                  anchor + '        self.assertEqual(sensors["adaptive_backoff_events"]["name"], "Communication — Ralentissements")\n',
              )
          test_path.write_text(test_text, encoding='utf-8')

          notes = root / 'docs/releases/1.6.0-beta.2.md'
          text = notes.read_text(encoding='utf-8')
          text = text.replace(
              'Communication diagnostics use short `Com. —` names. State, last response, failures and current interval remain enabled by default; duration, blocks, successes, reason and backoff are advanced diagnostics disabled by default.',
              'Communication diagnostics use the full `Communication —` label. State, last response, failures and current interval remain enabled by default; duration, blocks, successes, reason and the slowdown counter are advanced diagnostics disabled by default.'
          )
          text = text.replace(
              'This beta does **not** learn a permanent per-device optimum polling interval.',
              'The slowdown counter increases only when adaptive polling actually raises the effective polling interval after a communication failure. This beta does **not** learn a permanent per-device optimum polling interval.'
          )
          notes.write_text(text, encoding='utf-8')

          for path in (root / 'custom_components/tsun_local').rglob('*.json'):
              if 'Com. —' in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'Abbreviated communication label remains in {path}')
          PY

      - name: Verify diff
        run: |
          git diff --check
          grep -q '"name": "Communication — Slowdowns"' custom_components/tsun_local/strings.json
          grep -q '"name": "Communication — Ralentissements"' custom_components/tsun_local/translations/fr.json
          grep -q 'Communication — Ralentissements' tests/test_beta2_release_contract.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit refreshed beta2 source
        run: |
          rm -f .github/workflows/refresh-beta2-communication-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify 1.6.0-beta.2 communication labels"
          git push origin HEAD:beta-1097
          git push --force origin HEAD:refs/heads/beta/v1.6.0-beta.2

      - name: Refresh beta2 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.6.0-beta.2'
          git tag -fa "$TAG" -m 'Version 1.6.0-beta.2'
          git push origin "refs/tags/$TAG" --force
          gh release edit "$TAG" --title 'Version 1.6.0-beta.2' --prerelease --notes-file docs/releases/1.6.0-beta.2.md

name: Temporary protocol failure diagnostic patch v2

on:
  push:
    branches:
      - fix/diagnostic-protocol-failure-report
    paths:
      - .github/workflows/tmp-patch-protocol-failure-report-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diagnostic-protocol-failure-report
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python scripts/tmp_apply_protocol_failure_patch.py

      - name: Validate focused diagnostic tests
        shell: bash
        run: |
          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic.py
          python -m unittest discover -s tests -p 'test_tsun_dump_tool.py'
          python -m unittest discover -s tests -p 'test_tsun_1097_research_probe.py'
          python -m unittest discover -s tests -p 'test_diagnostic_desktop_test_mode.py'
          python -m unittest discover -s tests -p 'test_diagnostic_upload_retry.py'
          python -m unittest discover -s tests -p 'test_diagnostic_upload_gui.py'
          git diff --check

      - name: Remove temporary patch machinery and commit
        shell: bash
        run: |
          git rm -f scripts/tmp_apply_protocol_failure_patch.py
          git rm -f .github/workflows/tmp-patch-protocol-failure-report.yml
          git rm -f .github/workflows/tmp-patch-protocol-failure-report-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_dump.py tools/tsun_diagnostic.py tests/test_tsun_dump_tool.py tests/test_diagnostic_desktop_test_mode.py tests/test_diagnostic_upload_retry.py tests/test_diagnostic_upload_gui.py
          git commit -m "fix: preserve failed protocol diagnostics [skip ci]"
          git push origin HEAD:fix/diagnostic-protocol-failure-report

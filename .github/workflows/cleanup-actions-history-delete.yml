name: Deep cleanup Actions history - DELETE

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete obsolete workflow-run history
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete workflow-run history
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const keepRecent = 5;
            const maxDeletesPerRun = 100;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            // Only these workflows are intentionally kept in the Actions sidebar.
            // Everything else is considered historical/obsolete and all of its
            // completed runs can be removed.
            const protectedWorkflows = new Set([
              'Validate',
              'Publish release',
              'Cleanup old beta releases',
              'Deep cleanup Actions history - PREVIEW',
              'Deep cleanup Actions history - DELETE',
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const seenProtected = new Map();
            const candidates = [];
            const kept = [];

            for (const run of runs) {
              if (run.id === currentRunId || run.status !== 'completed') {
                kept.push(run);
                continue;
              }

              if (!protectedWorkflows.has(run.name)) {
                candidates.push({ run, reason: 'obsolete workflow name' });
                continue;
              }

              const seen = seenProtected.get(run.name) || 0;
              seenProtected.set(run.name, seen + 1);
              if (seen < keepRecent) {
                kept.push(run);
              } else {
                candidates.push({ run, reason: `older than latest ${keepRecent}` });
              }
            }

            const batch = candidates.slice(0, maxDeletesPerRun);
            let deleted = 0;
            let alreadyGone = 0;
            let deferred = 0;

            for (const item of batch) {
              const run = item.run;
              core.info(`[DELETE] ${item.reason} | ${run.name} #${run.run_number} | ${run.created_at} | id=${run.id}`);
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deleted += 1;
              } catch (error) {
                if (error.status === 404) {
                  alreadyGone += 1;
                } else if ([403, 422, 429].includes(error.status)) {
                  deferred += 1;
                  core.warning(`Deferred run ${run.id}: HTTP ${error.status}`);
                } else {
                  throw error;
                }
              }
              await sleep(300);
            }

            const remaining = Math.max(0, candidates.length - deleted - alreadyGone);

            await core.summary
              .addHeading('Deep GitHub Actions cleanup')
              .addTable([
                [{data:'Protected workflow names', header:true}, [...protectedWorkflows].join(', ')],
                [{data:'Total historical runs', header:true}, String(runs.length)],
                [{data:'Candidates found', header:true}, String(candidates.length)],
                [{data:'Deleted this run', header:true}, String(deleted)],
                [{data:'Already absent', header:true}, String(alreadyGone)],
                [{data:'Deferred', header:true}, String(deferred)],
                [{data:'Remaining candidates', header:true}, String(remaining)],
                [{data:'Recent runs kept per protected workflow', header:true}, String(keepRecent)],
              ])
              .addRaw('\nOnly workflow-run history is deleted. Workflow YAML files, releases, tags, the current cleanup run, and queued/in-progress runs are never deleted. Re-run until Remaining candidates = 0.\n')
              .write();

name: Verify diagnostic documentation

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/index.html"
      - "docs/test-your-inverter.html"
      - "scripts/sync_diagnostic_docs.py"
      - "scripts/publish_macos_first_launch_docs.py"
      - "scripts/fix_current_mac_copy.py"
      - ".github/workflows/sync-diagnostic-docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/index.html"
      - "docs/test-your-inverter.html"
      - "scripts/sync_diagnostic_docs.py"
      - "scripts/publish_macos_first_launch_docs.py"
      - "scripts/fix_current_mac_copy.py"
      - ".github/workflows/sync-diagnostic-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-diagnostic-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile documentation helpers
        run: |
          python -m py_compile \
            scripts/sync_diagnostic_docs.py \
            scripts/publish_macos_first_launch_docs.py \
            scripts/fix_current_mac_copy.py

      - name: Verify public diagnostic distribution
        run: python scripts/sync_diagnostic_docs.py

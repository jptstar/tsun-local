name: Sync diagnostic documentation

on:
  push:
    branches:
      - main
    paths:
      - "tools/tsun_diagnostic_version.py"
      - "tools/tsun_dump.py"
      - "scripts/sync_diagnostic_docs.py"
      - ".github/workflows/sync-diagnostic-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-diagnostic-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize public diagnostic documentation
        run: |
          python scripts/sync_diagnostic_docs.py
          # A second pass is intentional: the synchronizer must stay idempotent.
          python scripts/sync_diagnostic_docs.py

      - name: Verify Windows/Python documentation and SEO contract
        shell: bash
        run: |
          python -m py_compile scripts/sync_diagnostic_docs.py
          python - <<'PY'
          from pathlib import Path
          import re

          def version(path: str, variable: str) -> str:
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(
                  rf'^\s*{re.escape(variable)}\s*=\s*["\']([^"\']+)',
                  text,
                  re.MULTILINE,
              )
              if not match:
                  raise SystemExit(f"Unable to read {variable} from {path}")
              return match.group(1)

          app_version = version("tools/tsun_diagnostic_version.py", "APP_VERSION")
          dump_version = version("tools/tsun_dump.py", "TOOL_VERSION")

          checks = {
              "README.md": [
                  "TSUN-Local-Diagnostic.exe",
                  "TSUN-Local-Diagnostic-Python.zip",
                  f"application **{app_version}**",
                  f"dump engine **{dump_version}**",
              ],
              "docs/README_FR.md": [
                  "TSUN-Local-Diagnostic.exe",
                  "TSUN-Local-Diagnostic-Python.zip",
                  "Package Python complet",
              ],
              "tools/README.md": [
                  "Diagnostic distributions — Windows and Python",
                  "TSUN-Local-Diagnostic-Python.zip",
              ],
              "docs/index.html": [
                  "Windows and Python diagnostics",
                  '"name":"TSUN Local Diagnostic"',
                  f'"softwareVersion":"{app_version}"',
                  "TSUN diagnostic, TSUN Local Diagnostic",
              ],
              "docs/test-your-inverter.html": [
                  "TSUN Microinverter Compatibility Test for Home Assistant",
                  "Full Python diagnostic — Linux and advanced users",
                  "TSUN-Local-Diagnostic-Python.zip",
              ],
          }

          failures = []
          for filename, markers in checks.items():
              text = Path(filename).read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      failures.append(f"{filename}: missing {marker!r}")

          for filename in (
              "README.md",
              "docs/README_FR.md",
              "tools/README.md",
              "docs/test-your-inverter.html",
          ):
              text = Path(filename).read_text(encoding="utf-8")
              for stale in (
                  "TSUN-Local-Diagnostic-macOS-",
                  "TSUN-Local-Diagnostic-Linux-",
              ):
                  if stale in text:
                      failures.append(f"{filename}: stale {stale}")

          if failures:
              raise SystemExit(
                  "Documentation verification failed:\n- " + "\n- ".join(failures)
              )
          print("Windows/Python documentation and SEO contract passed.")
          PY

      - name: Publish synchronized docs branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation already synchronized."
            exit 0
          fi
          branch="automation/diagnostic-docs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            README.md \
            tools/README.md \
            docs/HARDWARE_DUMP.md \
            docs/DIRECT_DIAGNOSTIC_UPLOAD_TEST.md \
            docs/README_FR.md \
            docs/index.html \
            docs/test-your-inverter.html \
            docs/sitemap.xml
          git commit -m "Synchronize Windows and Python diagnostic documentation"
          git push --force origin "$branch"
          echo "Synchronized documentation published to $branch for pull-request validation."

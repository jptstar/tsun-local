name: Sync diagnostic documentation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/publish_macos_first_launch_docs.py"
      - "scripts/fix_current_mac_copy.py"
      - ".github/workflows/sync-diagnostic-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-diagnostic-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish safe macOS first-launch guidance
        run: |
          python scripts/publish_macos_first_launch_docs.py
          python scripts/fix_current_mac_copy.py

      - name: Verify stable links and generated documentation
        run: |
          python -m py_compile scripts/publish_macos_first_launch_docs.py scripts/fix_current_mac_copy.py
          grep -Fq 'releases/download/diagnostic-latest/TSUN-Local-Diagnostic.exe' README.md
          grep -Fq 'TSUN-Local-Diagnostic-macOS-arm64.zip' README.md
          grep -Fq 'TSUN-Local-Diagnostic-macOS-x86_64.zip' README.md
          grep -Fq 'Open Anyway' README.md
          grep -Fq '> **Which Mac should I download?**' README.md
          grep -Fq 'TSUN-Local-Diagnostic-Linux-x86_64' docs/HARDWARE_DUMP.md
          grep -Fq 'M1, M2, M3, M4' docs/test-your-inverter.html
          grep -Fq 'releases/download/diagnostic-latest/TSUN-Local-Diagnostic-macOS-arm64.zip' docs/test-your-inverter.html
          grep -Fq 'releases/download/diagnostic-latest/TSUN-Local-Diagnostic-macOS-x86_64.zip' docs/test-your-inverter.html
          grep -Fq 'Open Anyway' docs/test-your-inverter.html
          grep -Fq '> **Quel Mac choisir ?**' docs/README_FR.md
          grep -Fq 'Ouvrir quand même' docs/README_FR.md
          grep -Fq 'Gatekeeper' docs/README_FR.md
          if grep -Fq 'once the signed builds are published' README.md; then
            echo 'README still implies Mac builds are unavailable.' >&2
            exit 1
          fi
          if grep -Fq 'lorsque les builds signés seront publiés' docs/README_FR.md; then
            echo 'French README still implies Mac builds are unavailable.' >&2
            exit 1
          fi
          test "$(grep -Fc 'Mac &amp; Linux diagnostic →' docs/index.html)" -eq 1
          grep -Fq 'Python diagnostic →' docs/index.html
          grep -Fq 'Windows diagnostic →' docs/index.html
          grep -Fq 'class="tested-link"' docs/index.html

      - name: Publish synchronized docs branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation already synchronized."
            exit 0
          fi
          branch="automation/diagnostic-docs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            README.md \
            tools/README.md \
            docs/HARDWARE_DUMP.md \
            docs/DIRECT_DIAGNOSTIC_UPLOAD_TEST.md \
            docs/README_*.md \
            docs/index.html \
            docs/test-your-inverter.html
          git commit -m "Publish Mac downloads with first-launch guide"
          git push --force origin "$branch"
          echo "Synchronized documentation published to $branch for pull-request validation."

name: Sync diagnostic documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/tsun_diagnostic_version.py"
      - "tools/tsun_dump.py"
      - "scripts/sync_diagnostic_docs.py"
      - ".github/workflows/sync-diagnostic-docs.yml"

permissions:
  contents: write

concurrency:
  group: sync-diagnostic-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize public diagnostic documentation
        run: |
          python scripts/sync_diagnostic_docs.py
          python scripts/sync_diagnostic_docs.py

      - name: Verify synchronizer and distribution contract
        shell: bash
        run: |
          python -m py_compile scripts/sync_diagnostic_docs.py
          grep -q "TSUN-Local-Diagnostic.exe" README.md
          grep -q "TSUN-Local-Diagnostic-Python.zip" README.md
          grep -q "TSUN-Local-Diagnostic-Python.zip" docs/README_FR.md
          grep -q "Diagnostic distributions — Windows and Python" tools/README.md
          grep -q "Windows and Python diagnostics" docs/index.html
          grep -q "TSUN Local Diagnostic" docs/index.html
          grep -q "Full Python diagnostic — Linux and advanced users" docs/test-your-inverter.html
          grep -q "TSUN-Local-Diagnostic-Python.zip" docs/test-your-inverter.html
          if grep -q "TSUN-Local-Diagnostic-macOS-" README.md docs/README_FR.md tools/README.md docs/test-your-inverter.html; then
            echo "Stale macOS diagnostic asset found" >&2
            exit 1
          fi
          if grep -q "TSUN-Local-Diagnostic-Linux-" README.md docs/README_FR.md tools/README.md docs/test-your-inverter.html; then
            echo "Stale Linux diagnostic asset found" >&2
            exit 1
          fi
          if grep -q 'id="mac-linux"' docs/test-your-inverter.html; then
            echo "Stale Mac/Linux diagnostic section found" >&2
            exit 1
          fi
          echo "Windows/Python documentation and SEO contract passed."

      - name: Publish synchronized docs branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation already synchronized."
            exit 0
          fi
          branch="automation/diagnostic-docs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            README.md \
            tools/README.md \
            docs/HARDWARE_DUMP.md \
            docs/DIRECT_DIAGNOSTIC_UPLOAD_TEST.md \
            docs/README_FR.md \
            docs/index.html \
            docs/test-your-inverter.html \
            docs/sitemap.xml
          git commit -m "Synchronize Windows and Python diagnostic documentation"
          git push --force origin "$branch"
          echo "Synchronized documentation published to $branch for pull-request validation."

name: Finish README and SEO refresh

on:
  push:
    branches:
      - docs/readme-seo-refresh
    paths:
      - ".github/workflows/zz-refresh-readme-seo-final.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-seo-refresh
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover and run the durable synchronizer prepared by the first pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/zz-refresh-readme-seo-once.yml').read_text(encoding='utf-8')
          script = re.search(r"cat > scripts/sync_diagnostic_docs.py <<'PY'\n(.*?)\n          PY\n", source, re.S)
          workflow = re.search(r"cat > \.github/workflows/sync-diagnostic-docs.yml <<'YML'\n(.*?)\n          YML\n", source, re.S)
          if not script or not workflow:
              raise SystemExit('Unable to recover generated documentation sources')
          def dedent(block: str) -> str:
              lines = block.splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('scripts/sync_diagnostic_docs.py').write_text(dedent(script.group(1)), encoding='utf-8')
          Path('.github/workflows/sync-diagnostic-docs.yml').write_text(dedent(workflow.group(1)), encoding='utf-8')
          PY
          chmod +x scripts/sync_diagnostic_docs.py
          python scripts/sync_diagnostic_docs.py

      - name: Remove obsolete Mac and Linux binary calls-to-action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/test-your-inverter.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^.*TSUN-Local-Diagnostic-macOS-[^\n]*\n?', '', text, flags=re.MULTILINE)
          text = re.sub(r'^.*TSUN-Local-Diagnostic-Linux-[^\n]*\n?', '', text, flags=re.MULTILINE)
          text = text.replace('Windows, macOS, Linux or directly with Python', 'Windows or the full Python package')
          text = text.replace('Windows, macOS, Linux and Python', 'Windows and full Python')
          path.write_text(text, encoding='utf-8')

          for filename in (
              'scripts/publish_macos_first_launch_docs.py',
              'scripts/fix_current_mac_copy.py',
              'scripts/clarify_macos_diagnostic_docs.py',
              'docs/MACOS_SIGNING.md',
          ):
              p = Path(filename)
              if p.exists():
                  p.unlink()
          PY

      - name: Verify README SEO and distribution contract
        shell: bash
        run: |
          python -m py_compile scripts/sync_diagnostic_docs.py
          python - <<'PY'
          from pathlib import Path
          checks = {
              'README.md': ['TSUN-Local-Diagnostic.exe', 'TSUN-Local-Diagnostic-Python.zip', 'Current diagnostic versions', 'dump engine **2.9.0**'],
              'docs/README_FR.md': ['TSUN-Local-Diagnostic.exe', 'TSUN-Local-Diagnostic-Python.zip', 'Package Python complet'],
              'tools/README.md': ['Diagnostic distributions — Windows and Python', 'TSUN-Local-Diagnostic-Python.zip'],
              'docs/index.html': ['Windows and Python diagnostics', '"name":"TSUN Local Diagnostic"', 'TSUN diagnostic, TSUN Local Diagnostic'],
              'docs/test-your-inverter.html': ['TSUN Microinverter Compatibility Test for Home Assistant', 'Full Python diagnostic — Linux and advanced users', 'TSUN-Local-Diagnostic-Python.zip', '"dateModified":"2026-09-16"'],
          }
          failures = []
          for filename, markers in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      failures.append(f'{filename}: missing {marker!r}')
          for filename in ('README.md', 'docs/README_FR.md', 'tools/README.md', 'docs/test-your-inverter.html'):
              text = Path(filename).read_text(encoding='utf-8')
              for stale in ('TSUN-Local-Diagnostic-macOS-', 'TSUN-Local-Diagnostic-Linux-'):
                  if stale in text:
                      failures.append(f'{filename}: stale {stale}')
          if failures:
              raise SystemExit('README/SEO contract failed:\n- ' + '\n- '.join(failures))
          print('README/SEO contract passed.')
          PY

      - name: Commit final generated documentation
        shell: bash
        run: |
          # Keep workflow files unchanged in this Actions push; they are maintained separately.
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tools/README.md docs scripts
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi
          git commit -m "docs: align README and SEO with Windows and Python diagnostics"
          git push origin HEAD:docs/readme-seo-refresh

name: Temporary protocol failure diagnostic patch

on:
  push:
    branches:
      - fix/diagnostic-protocol-failure-report
    paths:
      - .github/workflows/tmp-patch-protocol-failure-report.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diagnostic-protocol-failure-report
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply diagnostic failure-report patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: found {count}\n--- OLD ---\n{old}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          dump = Path("tools/tsun_dump.py")
          replace_once(dump, 'TOOL_VERSION = "2.8.5"', 'TOOL_VERSION = "2.8.6"')

          replace_once(
              dump,
              '''class TsunProtocolError(Exception):
              """Raised when a TSUN protocol frame is invalid."""


          class TsunUpdateError(Exception):'''.replace("          ", ""),
              '''class TsunProtocolError(Exception):
              """Raised when a TSUN protocol frame is invalid."""


          class ProtocolDetectionError(RuntimeError):
              """Raised after every bounded supported-protocol probe has failed."""

              def __init__(self, message: str, attempts: list[dict[str, Any]]) -> None:
                  super().__init__(message)
                  self.attempts = attempts


          class TsunUpdateError(Exception):'''.replace("          ", ""),
          )

          replace_once(
              dump,
              '''    raise RuntimeError(
              "No supported TSUN local protocol detected after "
              f"{PROTOCOL_PROBE_RETRIES} attempts per protocol"
          ) from last_error'''.replace("          ", ""),
              '''    raise ProtocolDetectionError(
              "No supported TSUN local protocol detected after "
              f"{PROTOCOL_PROBE_RETRIES} attempts per protocol",
              attempts,
          ) from last_error'''.replace("          ", ""),
          )

          failure_helpers = r'''

          def _capture_failed_protocol_observations(
              host: str,
              port: int,
              sn: int,
              timeout: float,
          ) -> list[dict[str, Any]]:
              """Keep one bounded raw observation for each Modbus candidate family."""
              cases = (
                  ("02b0", 0x02B0, 0x3000),
                  ("1097", 0x1097, 0x1100),
                  ("3026", 0x3026, 0x0000),
              )
              observations: list[dict[str, Any]] = []
              probe_timeout = min(timeout, CHARACTERIZATION_TIMEOUT_CAP)
              for protocol, sensor_list, start in cases:
                  try:
                      observation = _observe_02b0_read(
                          host,
                          port,
                          sn,
                          start,
                          start,
                          sensor_list=sensor_list,
                          timeout=probe_timeout,
                      )
                  except Exception as err:
                      observation = {
                          "result": "transport_error",
                          "error": safe_error_details(err),
                      }
                  observation.update(
                      {
                          "protocol_candidate": protocol,
                          "sensor_list": f"0x{sensor_list:04X}",
                          "start": f"0x{start:04X}",
                          "end": f"0x{start:04X}",
                          "attempt": 1,
                      }
                  )
                  observations.append(observation)
              return observations


          def capture_protocol_detection_failure(
              args: argparse.Namespace,
              host: str,
              sn: int,
              discovery: dict[str, Any],
              error: ProtocolDetectionError,
          ) -> dict[str, Any]:
              """Create a privacy-safe JSON report even when no protocol is recognized."""
              created_at = datetime.now(timezone.utc)
              full = bool(args.full)
              raw_observations = (
                  _capture_failed_protocol_observations(
                      host, args.port, sn, args.timeout
                  )
                  if full
                  else []
              )

              try:
                  logger_web = capture_logger_web_pages(host, args.http_page_timeout)
              except Exception as err:
                  logger_web = {
                      "attempted": True,
                      "pages_found": 0,
                      "error": safe_error_details(err),
                      "privacy": {
                          "raw_html_stored": False,
                          "host_ip_stored": False,
                      },
                  }

              if full:
                  try:
                      logger_dns_probe = probe_logger_dns_read_only(
                          host, min(args.timeout, 2.5)
                      )
                  except Exception as err:
                      logger_dns_probe = {
                          "attempted": True,
                          "read_only": True,
                          "supported": False,
                          "error": safe_error_details(err),
                          "dns_server_address_stored": False,
                      }
              else:
                  logger_dns_probe = {
                      "attempted": False,
                      "read_only": True,
                      "reason": "requires a full capture",
                      "dns_server_address_stored": False,
                  }

              return {
                  "format": DUMP_FORMAT,
                  "schema_version": SCHEMA_VERSION,
                  "metadata": {
                      "timestamp_utc": created_at.isoformat(),
                      "tool": "TSUN Local Hardware Validation Dump Tool",
                      "tool_version": TOOL_VERSION,
                      "tool_sha256": _script_sha256(),
                      "tool_source": SOURCE_URL,
                      "standalone": True,
                      "python_required": ">=3.10",
                      "read_only": True,
                      "capture_mode": "full" if full else "standard",
                      "capture_status": "protocol_detection_failed",
                      "detected_protocol": None,
                      "protocol_validation_status": "undetected",
                      "capture_limitation": "no_supported_local_protocol_detected",
                      "measurements_available": False,
                      "device_reachable": True,
                      "model_family": "unknown / unsupported local protocol",
                      "model_supplied_by_user": args.model,
                      "pv_count": None,
                      "port": args.port,
                      "privacy": {
                          "host_in_output": False,
                          "logger_sn_in_output": False,
                          "inverter_serial_in_output": False,
                          "ap_envelope_in_output": False,
                          "udp_discovery_payload_in_output": False,
                          "logger_web_raw_html_in_output": False,
                          "logger_web_anonymized_html_in_output": True,
                          "logger_dns_address_in_output": False,
                          "raw_protocol_probe_payloads_in_output": full,
                          "inverter_serial_prefix_characters": 3,
                      },
                  },
                  "logger_web": logger_web,
                  "logger_dns_probe": logger_dns_probe,
                  "protocol_characterization": {
                      "attempted": False,
                      "reason": "no supported protocol selected",
                  },
                  "discovery": discovery,
                  "protocol_detection": {
                      "requested": args.protocol,
                      "selected": None,
                      "confidence": "no supported protocol probe succeeded",
                      "error": {
                          "type": type(error).__name__,
                          "message": str(error),
                      },
                      "attempts": error.attempts,
                  },
                  "protocol_failure_characterization": {
                      "attempted": full,
                      "read_only": True,
                      "reason": (
                          "bounded raw Modbus candidate observations collected"
                          if full
                          else "requires --full for raw candidate observations"
                      ),
                      "modbus_candidate_observations": raw_observations,
                      "legacy_1511_raw_observation": {
                          "attempted": False,
                          "reason": (
                              "1511 uses different framing; normal bounded detection "
                              "attempts are retained in protocol_detection"
                          ),
                      },
                      "safety": {
                          "configuration_write_performed": False,
                          "inverter_write_performed": False,
                          "cloud_access_performed": False,
                          "modbus_function": "0x03",
                          "registers_per_candidate": 1,
                      },
                  },
                  "decoded_known_measurements": {},
                  "capture_summary": {
                      "snapshots": 0,
                      "snapshot_interval_seconds": args.interval,
                      "coherent_snapshots": 0,
                      "decoded_snapshot_index": None,
                      "successful_block_reads": 0,
                      "failed_block_reads": 0,
                      "unique_raw_registers": 0,
                  },
                  "raw_registers": [],
                  "snapshots": [],
                  "analysis": analyze_snapshots([]),
                  "blocks": [],
                  "protocol_trace": [],
              }
          '''.replace("          ", "")

          replace_once(dump, "\n\ndef capture(\n", failure_helpers + "\n\ndef capture(\n")

          replace_once(
              dump,
              '''        except (KeyboardInterrupt, EOFError):
              print("\\nCancelled.")
              return 130
          except Exception as err:
              failed += 1
              print(
                  f"ERROR: device {sequence}/{total}: {type(err).__name__}: {err}",
                  file=sys.stderr,
              )
              continue

          timestamp = datetime.fromisoformat(document["metadata"]["timestamp_utc"])'''.replace("          ", ""),
              '''        except (KeyboardInterrupt, EOFError):
              print("\\nCancelled.")
              return 130
          except ProtocolDetectionError as err:
              print(
                  "No supported local protocol detected; generating a bounded "
                  "read-only failure report.",
                  file=sys.stderr,
              )
              try:
                  document = capture_protocol_detection_failure(
                      args, host, sn, discovery, err
                  )
              except Exception as report_err:
                  failed += 1
                  print(
                      f"ERROR: device {sequence}/{total}: failure report could not "
                      f"be created: {type(report_err).__name__}: {report_err}",
                      file=sys.stderr,
                  )
                  continue
          except Exception as err:
              failed += 1
              print(
                  f"ERROR: device {sequence}/{total}: {type(err).__name__}: {err}",
                  file=sys.stderr,
              )
              continue

          timestamp = datetime.fromisoformat(document["metadata"]["timestamp_utc"])'''.replace("          ", ""),
          )

          replace_once(
              dump,
              '''            document["metadata"]["detected_protocol"],''',
              '''            document["metadata"].get("detected_protocol") or "undetected",''',
          )

          replace_once(
              dump,
              '''    if document["metadata"].get("detected_protocol") == "tuya-lan":
              print("Measures : unavailable (encrypted status requires local key)")'''.replace("          ", ""),
              '''    if document["metadata"].get("detected_protocol") == "tuya-lan":
              print("Measures : unavailable (encrypted status requires local key)")
          elif not document["metadata"].get("detected_protocol"):
              print("Measures : unavailable (no supported local protocol detected)")'''.replace("          ", ""),
          )

          diagnostic = Path("tools/tsun_diagnostic.py")
          replace_once(diagnostic, 'APP_VERSION = "1.5.17"', 'APP_VERSION = "1.5.18"')

          test_dump = Path("tests/test_tsun_dump_tool.py")
          replace_once(test_dump, 'self.assertEqual(TOOL.TOOL_VERSION, "2.8.5")', 'self.assertEqual(TOOL.TOOL_VERSION, "2.8.6")')

          extra_tests = r'''

              def test_protocol_detection_error_preserves_failed_attempts(self) -> None:
                  original_probe = TOOL._probe_protocol
                  original_delay = TOOL.PROTOCOL_RETRY_DELAY

                  def fail_probe(*_args, **_kwargs):
                      raise TOOL.TsunProtocolError("synthetic probe failure")

                  try:
                      TOOL._probe_protocol = fail_probe
                      TOOL.PROTOCOL_RETRY_DELAY = 0
                      with self.assertRaises(TOOL.ProtocolDetectionError) as caught:
                          TOOL.detect_protocol(
                              "3026", "192.0.2.10", 8899, 123456789, 0.01
                          )
                  finally:
                      TOOL._probe_protocol = original_probe
                      TOOL.PROTOCOL_RETRY_DELAY = original_delay

                  attempts = caught.exception.attempts
                  self.assertEqual(len(attempts), 1)
                  self.assertEqual(attempts[0]["protocol"], "3026")
                  self.assertEqual(attempts[0]["result"], "failure")
                  self.assertEqual(len(attempts[0]["attempts"]), 3)

              def test_failed_detection_capture_is_shareable_without_identifiers(self) -> None:
                  class Args:
                      full = False
                      interval = 0.0
                      model = "TSOL-UNKNOWN"
                      port = 8899
                      protocol = "auto"
                      http_page_timeout = 0.1
                      timeout = 0.1

                  error = TOOL.ProtocolDetectionError(
                      "No supported TSUN local protocol detected after 3 attempts per protocol",
                      [
                          {
                              "protocol": "3026",
                              "result": "failure",
                              "attempts": [
                                  {
                                      "attempt": 1,
                                      "error": {"type": "TsunProtocolError"},
                                  }
                              ],
                          }
                      ],
                  )
                  original_web = TOOL.capture_logger_web_pages
                  try:
                      TOOL.capture_logger_web_pages = lambda *_args, **_kwargs: {
                          "attempted": True,
                          "pages_found": 0,
                      }
                      document = TOOL.capture_protocol_detection_failure(
                          Args(),
                          "192.0.2.10",
                          123456789,
                          {"protocol_hint": None},
                          error,
                      )
                  finally:
                      TOOL.capture_logger_web_pages = original_web

                  self.assertEqual(
                      document["metadata"]["capture_status"],
                      "protocol_detection_failed",
                  )
                  self.assertIsNone(document["metadata"]["detected_protocol"])
                  self.assertFalse(
                      document["protocol_failure_characterization"]["attempted"]
                  )
                  self.assertEqual(
                      document["protocol_detection"]["attempts"], error.attempts
                  )
                  self.assertIs(TOOL.validate_diagnostic_for_upload(document), document)
          '''.replace("          ", "")
          replace_once(
              test_dump,
              '\n\nif __name__ == "__main__":\n    unittest.main()\n',
              extra_tests + '\n\nif __name__ == "__main__":\n    unittest.main()\n',
          )

          for test_name in (
              "tests/test_diagnostic_desktop_test_mode.py",
              "tests/test_diagnostic_upload_retry.py",
              "tests/test_diagnostic_upload_gui.py",
          ):
              path = Path(test_name)
              text = path.read_text(encoding="utf-8")
              if '"1.5.17"' not in text:
                  raise SystemExit(f"Expected 1.5.17 assertion in {path}")
              path.write_text(text.replace('"1.5.17"', '"1.5.18"'), encoding="utf-8")
          PY

      - name: Validate patched sources
        shell: bash
        run: |
          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic.py
          python -m unittest discover -s tests -p 'test_tsun_dump_tool.py'
          python -m unittest discover -s tests -p 'test_tsun_1097_research_probe.py'
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_dump.py tools/tsun_diagnostic.py tests/test_tsun_dump_tool.py tests/test_diagnostic_desktop_test_mode.py tests/test_diagnostic_upload_retry.py tests/test_diagnostic_upload_gui.py
          git commit -m "fix: preserve failed protocol diagnostics [skip ci]"
          git push origin HEAD:fix/diagnostic-protocol-failure-report

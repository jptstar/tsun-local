name: Cleanup old beta releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete beta releases and 1.5.0
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete releases and tags
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const protectedTags = new Set(["1.5.1", "v1.5.1"]);
            const shouldDelete = (tag, prerelease = false) => {
              const value = tag.toLowerCase();
              return prerelease || value.includes("beta") || value === "1.5.0" || value === "v1.5.0";
            };

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            core.info(`Found ${releases.length} releases.`);

            for (const release of releases) {
              const tag = release.tag_name;
              if (protectedTags.has(tag)) {
                core.info(`Protected stable release: ${tag}`);
                continue;
              }
              if (!shouldDelete(tag, release.prerelease)) {
                continue;
              }

              core.info(`Deleting release ${tag} (id ${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });

              try {
                core.info(`Deleting tag ${tag}`);
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.warning(`Tag ${tag} was already absent or could not be deleted after release removal: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }

            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: "tags/",
              per_page: 100,
            });

            for (const item of refs) {
              const tag = item.ref.replace(/^refs\/tags\//, "");
              if (protectedTags.has(tag) || !shouldDelete(tag, false)) {
                continue;
              }

              core.info(`Deleting orphan tag ${tag}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
            }

            core.info("Cleanup complete. Stable 1.5.1 was protected.");

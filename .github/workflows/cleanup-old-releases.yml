name: Cleanup old beta releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete beta releases and 1.5.0
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          should_delete() {
            local tag="${1,,}"
            [[ "$tag" == *beta* || "$tag" == "1.5.0" || "$tag" == "v1.5.0" ]]
          }

          protect_stable() {
            local tag="${1,,}"
            if [[ "$tag" == "1.5.1" || "$tag" == "v1.5.1" ]]; then
              echo "Safety stop: refusing to delete stable $1"
              exit 1
            fi
          }

          echo "Cleaning obsolete GitHub releases in $REPO"
          mapfile -t release_tags < <(
            gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName'
          )

          for tag in "${release_tags[@]}"; do
            [[ -z "$tag" ]] && continue
            protect_stable "$tag"
            if should_delete "$tag"; then
              echo "Deleting release + tag: $tag"
              gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
            fi
          done

          echo "Removing matching orphan tags"
          mapfile -t tags < <(
            gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name'
          )

          for tag in "${tags[@]}"; do
            [[ -z "$tag" ]] && continue
            protect_stable "$tag"
            if should_delete "$tag"; then
              echo "Deleting orphan tag: $tag"
              gh api --method DELETE "repos/$REPO/git/refs/tags/$tag"
            fi
          done

          echo "Cleanup complete. Remaining releases:"
          gh release list --repo "$REPO" --limit 1000

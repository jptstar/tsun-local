name: Repair beta.5 bootstrap workflow

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/fix-beta5-bootstrap-v2.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Patch preparation workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/prepare-beta5-daily-energy.yml')
          source = path.read_text(encoding='utf-8')

          old = "          from pathlib import Path\n          import unittest\n\n          MODULE_PATH = (\n"
          new = "          from pathlib import Path\n          import sys\n          import unittest\n\n          MODULE_PATH = (\n"
          if old not in source:
              raise SystemExit('tracker import anchor not found')
          source = source.replace(old, new, 1)

          old = "          MODULE = importlib.util.module_from_spec(SPEC)\n          SPEC.loader.exec_module(MODULE)\n          DailyEnergyTracker = MODULE.DailyEnergyTracker\n"
          new = "          MODULE = importlib.util.module_from_spec(SPEC)\n          sys.modules[SPEC.name] = MODULE\n          SPEC.loader.exec_module(MODULE)\n          DailyEnergyTracker = MODULE.DailyEnergyTracker\n"
          if old not in source:
              raise SystemExit('tracker loader anchor not found')
          source = source.replace(old, new, 1)

          anchor = "          contract_path.write_text(contract, encoding='utf-8')\n"
          extra = """          contract = contract.replace(\n              '        self.assertIn(\"last_local_date != dt_util.now().date()\", source)\\n',\n              '        self.assertIn(\"dt_util.now().date()\", source)\\n',\n              1,\n          )\n          contract = contract.replace(\n              '        self.assertIn(\"or self._daily_reset_override\", source)\\n',\n              '        self.assertIn(\"self._daily_tracker is not None\", source)\\n        self.assertIn(\"self._daily_tracker.value is not None\", source)\\n',\n              1,\n          )\n"""
          if anchor not in source:
              raise SystemExit('contract write anchor not found')
          source = source.replace(anchor, extra + anchor, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit repair and retrigger preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-beta5-bootstrap.yml .github/workflows/fix-beta5-bootstrap-v2.yml
          git add .github/workflows/prepare-beta5-daily-energy.yml
          git commit -m "Repair beta.5 preparation workflow"
          git push origin HEAD:beta-1097

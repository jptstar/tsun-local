name: One-shot diagnostic self-update patch

on:
  push:
    branches:
      - feat/diagnostic-self-update
    paths:
      - "tools/_apply_diagnostic_self_update.py"
      - ".github/workflows/one-shot-diagnostic-self-update.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/diagnostic-self-update
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply self-update changes
        run: python tools/_apply_diagnostic_self_update.py

      - name: Keep workflow files for connector-managed update
        run: git checkout -- .github/workflows/build-diagnostic-exe.yml .github/workflows/one-shot-diagnostic-self-update.yml

      - name: Validate patched diagnostic tools
        run: |
          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic_gui.py
          python tests/test_tsun_dump_tool.py
          python tests/test_diagnostic_updates.py
          python -c "import sys; sys.path.insert(0, 'tools'); import tsun_dump, tsun_diagnostic_gui; assert tsun_dump.TOOL_VERSION == '2.7.0'; assert tsun_diagnostic_gui.APP_VERSION == '1.4.0'"

      - name: Commit non-workflow patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_dump.py tools/tsun_diagnostic_gui.py tools/README.md docs/HARDWARE_DUMP.md tests/test_tsun_dump_tool.py tests/test_diagnostic_updates.py
          git diff --cached --quiet && exit 0
          git commit -m "Add self-updating diagnostic distributions"
          git push origin HEAD:feat/diagnostic-self-update

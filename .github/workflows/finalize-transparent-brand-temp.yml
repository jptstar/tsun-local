name: Finalize transparent TSUN Local branding

on:
  push:
    branches:
      - branding/transparent-tsun-local-assets
    paths:
      - .github/workflows/finalize-transparent-brand-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: branding/transparent-tsun-local-assets
          fetch-depth: 0

      - name: Add repository and HACS package guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          metadata = Path('tests/test_metadata.py')
          text = metadata.read_text(encoding='utf-8')
          old = '''        for name in expected:\n            data = (brand / name).read_bytes()\n            self.assertTrue(data.startswith(b"\\x89PNG\\r\\n\\x1a\\n"), name)\n            self.assertGreater(len(data), 1024, name)\n'''
          new = '''        for name in expected:\n            data = (brand / name).read_bytes()\n            self.assertTrue(data.startswith(b"\\x89PNG\\r\\n\\x1a\\n"), name)\n            self.assertGreater(len(data), 1024, name)\n            self.assertEqual(data[25], 6, f"{name} must be an RGBA PNG with transparency")\n'''
          if old not in text:
              raise SystemExit('Could not locate metadata brand assertion block')
          metadata.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/publish-hacs-asset.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''              if 'manifest.json' not in names or '__init__.py' not in names:\n                  raise SystemExit('Invalid HACS ZIP: integration files are not at the archive root')\n              if any(name.startswith('custom_components/') or name.startswith('tsun_local/') for name in names):\n                  raise SystemExit('Invalid HACS ZIP: unexpected wrapper directory')\n\n          print(f'Built {target} with {len(names)} files ({target.stat().st_size} bytes)')\n'''
          new = '''              if 'manifest.json' not in names or '__init__.py' not in names:\n                  raise SystemExit('Invalid HACS ZIP: integration files are not at the archive root')\n              if any(name.startswith('custom_components/') or name.startswith('tsun_local/') for name in names):\n                  raise SystemExit('Invalid HACS ZIP: unexpected wrapper directory')\n              required_brand_assets = {\n                  'brand/icon.png',\n                  'brand/icon@2x.png',\n                  'brand/logo.png',\n                  'brand/logo@2x.png',\n              }\n              missing_brand_assets = required_brand_assets - names\n              if missing_brand_assets:\n                  raise SystemExit(\n                      'Invalid HACS ZIP: missing brand assets: '\n                      + ', '.join(sorted(missing_brand_assets))\n                  )\n\n          print(f'Built {target} with {len(names)} files ({target.stat().st_size} bytes)')\n'''
          if old not in text:
              raise SystemExit('Could not locate HACS ZIP validation block')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run metadata tests
        run: python3 -m unittest tests.test_metadata

      - name: Remove temporary workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-transparent-brand-temp.yml
          git config user.name "jptstar"
          git config user.email "dev@jptstar.com"
          git add tests/test_metadata.py .github/workflows/publish-hacs-asset.yml .github/workflows/finalize-transparent-brand-temp.yml
          git commit -m "Verify transparent brand assets in repository and HACS package"
          git push origin HEAD:branding/transparent-tsun-local-assets

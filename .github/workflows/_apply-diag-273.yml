name: Apply diagnostic 2.7.3 patch

on:
  push:
    branches:
      - diagnostic/2.7.3-js-research
    paths:
      - tools/_apply_diag_273_patch.py
      - .github/workflows/_apply-diag-273.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/2.7.3-js-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/_apply_diag_273_patch.py
      - name: Run focused tests
        run: python -m unittest tests.test_tsun_dump_tool
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add static JS research to diagnostic 2.7.3"
          git push

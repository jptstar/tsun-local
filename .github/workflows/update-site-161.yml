name: Update public site hero for 1.6.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-site-161.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible homepage highlights
        run: |
          grep -q 'NEW IN 1.6.0' docs/index.html
          sed -i 's/TSUN Local 1.6.0 highlights/TSUN Local 1.6.1 highlights/' docs/index.html
          sed -i 's/NEW IN 1.6.0/NEW IN 1.6.1/' docs/index.html
          sed -i 's|<h3>Adaptive polling</h3>|<h3>More resilient local monitoring</h3>|' docs/index.html
          sed -i 's|<strong>Automatic communication pacing for unstable and offline micro-inverters</strong>|<strong>Reliable communication, daily energy and logger Wi-Fi freshness</strong>|' docs/index.html
          sed -i 's|<span>Enabled by default. TSUN Local reacts to protocol failures, slows polling when communication becomes unavailable and progressively returns toward the normal interval after successful reads.</span>|<span>TSUN Local now retries one failed protocol block on a fresh connection, keeps daily energy aligned with Home Assistant local midnight, and avoids false 0% Wi-Fi readings during transient logger refresh failures.</span>|' docs/index.html
          sed -i 's|<div class="preview-stat"><strong>20 s</strong><span>normal interval</span></div>|<div class="preview-stat"><strong>1 retry</strong><span>failed protocol block</span></div>|' docs/index.html
          sed -i 's|<div class="preview-stat"><strong>300 s</strong><span>offline / night interval</span></div>|<div class="preview-stat"><strong>2 misses</strong><span>RSSI becomes unavailable</span></div>|' docs/index.html
          sed -i 's|<div class="preview-note">Default retry interval: 30 s · Offline after 3 consecutive protocol failures · Logger Wi-Fi remains diagnostic only.</div>|<div class="preview-note">No validated register-map or write-behavior changes · Fully local and strictly read-only.</div>|' docs/index.html
          ! grep -q 'NEW IN 1.6.0' docs/index.html
      - name: Commit homepage and remove updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-site-161.yml
          git add docs/index.html
          git commit -m 'Update public site highlights for 1.6.1'
          git push

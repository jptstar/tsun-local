name: One-shot diagnostic modernization

on:
  push:
    branches:
      - fix/diagnostic-firmware-ui
    paths:
      - "tools/_diagnostic_modernize_patch.py"
      - "tools/_trigger_diagnostic_modernize.txt"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply diagnostic modernization
        run: python tools/_diagnostic_modernize_patch.py

      - name: Validate diagnostic sources
        shell: bash
        run: |
          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic_gui.py tests/test_tsun_dump_tool.py
          python -m unittest discover -s tests -p 'test_tsun_dump_tool.py'
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          rm tools/_diagnostic_modernize_patch.py tools/_trigger_diagnostic_modernize.txt .github/workflows/diagnostic-modernize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve diagnostic firmware resilience and interface"
          git push origin "HEAD:${GITHUB_REF_NAME}"

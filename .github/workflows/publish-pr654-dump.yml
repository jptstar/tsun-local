name: Publish original MP3000 PR654 dump

on:
  push:
    branches:
      - publish-pr654-dump

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[publish-pr654-dump]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download original GitHub attachment unchanged
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/user-attachments/files/31120693/tsun_mp3000_1511_pr654_20260816T170853Z.json' \
            --output docs/evidence/tsun_mp3000_1511_pr654_20260816T170853Z.json
          echo '7d44b5c718fee6d03974f345476da8a21831139f90400944b242cf0e80e840cf  docs/evidence/tsun_mp3000_1511_pr654_20260816T170853Z.json' | sha256sum -c -

      - name: Verify dump metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/evidence/tsun_mp3000_1511_pr654_20260816T170853Z.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          meta = data['metadata']
          assert meta['timestamp_utc'] == '2026-08-16T17:08:53.109355+00:00'
          assert meta['firmware'] == 'LSW5_SSL_1511_1.03'
          assert meta['read_only'] is True
          assert meta['protocol'] == '1511 native TITAN'
          assert meta['source_layout'] == 's-allius/tsun-gen3-proxy PR #654'
          assert meta['privacy']['host_in_output'] is False
          assert meta['privacy']['logger_sn_in_output'] is False
          print('Original MP3000 PR654 dump metadata verified.')
          PY

      - name: Link the raw evidence from field-validation documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/MP3000_FIELD_VALIDATION.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Published raw PR #654 field dump'
          if marker not in text:
              block = '''\n## Published raw PR #654 field dump\n\nThe original MP3000 / 1511 field capture used during the PR #654 investigation is now preserved directly in this repository instead of depending on a GitHub `user-attachments` URL:\n\n- [`tsun_mp3000_1511_pr654_20260816T170853Z.json`](evidence/tsun_mp3000_1511_pr654_20260816T170853Z.json)\n- captured: **2026-08-16T17:08:53.109355Z**;\n- firmware: **LSW5_SSL_1511_1.03**;\n- protocol: **1511 native TITAN**;\n- source layout: **s-allius/tsun-gen3-proxy PR #654**;\n- acquisition: **read-only**;\n- host and logger serial number are absent from the published output;\n- SHA-256: `7d44b5c718fee6d03974f345476da8a21831139f90400944b242cf0e80e840cf`.\n\nThis file is the original field dump, republished unchanged. It is raw evidence: semantic register labels remain subject to the validation status documented on this page.\n'''
              anchor = '## Additional A1/21 field-validation entities'
              text = text.replace(anchor, block + '\n' + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit exact dump and documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/publish-pr654-dump.yml .github/publish-pr654-dump-trigger.txt
          git add docs/evidence/tsun_mp3000_1511_pr654_20260816T170853Z.json docs/MP3000_FIELD_VALIDATION.md
          git commit -m 'Republish original MP3000 PR654 field dump'
          git push origin HEAD:publish-pr654-dump

name: Cleanup 1097 supported wording

on:
  push:
    branches:
      - cleanup/1097-supported-wording

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[1097-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/1097-supported-wording
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove experimental wording from 1097
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('.')
          component = root / 'custom_components/tsun_local'

          # Keep localized labels but remove the obsolete experimental suffix.
          json_paths = [component / 'strings.json', *sorted((component / 'translations').glob('*.json'))]
          for path in json_paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              options = data.get('selector', {}).get('protocol', {}).get('options', {})
              value = options.get('1097')
              if isinstance(value, str):
                  options['1097'] = re.sub(r'\s+—\s+[^—]+$', '', value).strip()
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 1097 is a supported GEN4 family. Individual not-yet-confirmed fields
          # may still be described as field-validation candidates.
          replacements = {
              '# Experimental 1097 power-level field.': '# 1097 power-level field retained for field validation.',
              '"output_coefficient": "0x1423 — experimental"': '"output_coefficient": "0x1423 — field validation"',
              '1097 / GEN3 / GEN3 PLUS': '1097 / GEN4',
              '1097 · GEN3 / GEN3 PLUS': '1097 · GEN4',
              'Experimental 1097 / GEN4 support': '1097 / GEN4 support',
              '### 1097 / GEN4 — experimental': '### 1097 / GEN4 — supported',
              '**1097 / GEN4** — new experimental protocol support for community validation.': '**1097 / GEN4** — supported local protocol family.',
              '**1097 / GEN4:** experimental.': '**1097 / GEN4:** supported.',
              '**1097 / GEN4:** experimental; public mapping research is credited to Stefan Allius.': '**1097 / GEN4:** supported.',
              '**1097** remains experimental while broader independent validation continues.': '**1097 / GEN4** is supported and validated on Sunology PLAY2 (GEN4).',
              'Expose the 1097 power-level diagnostic as part of the experimental 1097 mapping.': 'Expose the 1097 power-level diagnostic as a field-validation candidate.',
              'Individual fields that still require semantic confirmation remain explicitly marked as field-validation candidates rather than making the whole protocol experimental.': 'Individual fields that still require semantic confirmation remain explicitly marked as field-validation candidates.',
              'stable support for the 1511 and 02B0 protocol families, plus experimental 1097 support;': 'stable support for the 1511, 02B0 and 1097 protocol families;',
              'the experimental 1097 implementation continues to credit': 'the 1097 implementation continues to credit',
              'experimental 1097 diagnostics for protocol/inverter versions': '1097 diagnostics for protocol/inverter versions',
              'the experimental 1097 diagnostics continue to credit': 'the 1097 diagnostics continue to credit',
              'test_1097_power_level_remains_experimental': 'test_1097_power_level_is_field_validation',
              '<strong>1097</strong></td><td>GEN3 / GEN3 PLUS candidates</td><td>🧪 Experimental</td>': '<strong>1097</strong></td><td>Sunology PLAY2 (GEN4)</td><td>✅ Validated</td>',
              '<section><h2>1097 · GEN4</h2><p class="intro">Experimental protocol support. Up to six PV inputs can be created dynamically. Semantics that still require broader real-device confirmation remain explicitly marked as experimental.</p></section>': '<section><h2>1097 · GEN4</h2><p class="intro">Supported local read-only protocol family, validated on Sunology PLAY2 (GEN4). Up to six PV inputs can be created dynamically. Individual semantics that still require confirmation are marked as field-validation candidates.</p></section>',
              'The validated families currently include 1511 and 02B0, while 1097 support remains experimental.': 'The validated families include 1511, 02B0 and 1097 / GEN4.',
              'Added a new experimental **1097 protocol adapter**.': 'Added the **1097 protocol adapter**.',
              '1097 support remains **experimental** until it is confirmed on more real devices.': '1097 is available as a local read-only protocol family.',
              'experimental 1097 mapping': '1097 field-validation mapping',
              'Experimental 1097': '1097',
              '1097 experimental': '1097 supported',
              '1097 — experimental': '1097 — supported',
              '1097 / GEN4 — experimental': '1097 / GEN4 — supported',
          }

          localized = {
              'experimental validation': 'validation',
              'validation expérimentale': 'validation',
              'experimentelle Validierung': 'Validierung',
              'validación experimental': 'validación',
              'validazione sperimentale': 'validazione',
              'experimentele validatie': 'validatie',
              'walidacji eksperymentalnej': 'walidacji',
              '实验性验证': '验证',
          }

          text_suffixes = {'.py', '.md', '.html', '.json', '.yml', '.yaml', '.txt'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              if path == root / '.github/workflows/cleanup-1097-wording-temp.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)

              lines = []
              for line in text.splitlines(keepends=True):
                  if '1097' in line:
                      for old, new in localized.items():
                          line = line.replace(old, new)
                  lines.append(line)
              text = ''.join(lines)

              # If a stale 1097 website card still carries the experimental badge,
              # promote only that compatibility card.
              if path.as_posix() == 'docs/index.html':
                  def promote_1097_card(match: re.Match[str]) -> str:
                      block = match.group(0)
                      if '1097' not in block:
                          return block
                      block = block.replace('compat-status experimental', 'compat-status validated')
                      block = re.sub(r'>Experimental<', '>Validated<', block, flags=re.IGNORECASE)
                      block = block.replace('GEN3 / GEN3 PLUS', 'GEN4')
                      return block
                  text = re.sub(r'<div class="compat-item">.*?</div>\s*</div>', promote_1097_card, text, flags=re.DOTALL)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # No remaining line may characterize 1097 as experimental. Ignore lines
          # where the experimental marker explicitly applies to 3026 instead.
          experimental_terms = (
              'experimental', 'expérimental', 'experimentell', 'sperimentale',
              'experimenteel', 'eksperymental', '实验性',
          )
          offenders = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              if path == root / '.github/workflows/cleanup-1097-wording-temp.yml':
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(lines, 1):
                  low = line.lower()
                  probe = low.replace('experimental 3026', '3026')
                  if '1097' in probe and any(term in probe for term in experimental_terms):
                      offenders.append(f'{path}:{number}: {line.strip()}')
          if offenders:
              raise SystemExit('Remaining 1097 experimental wording:\n' + '\n'.join(offenders))

      - name: Run validation
        run: |
          python -m compileall -q custom_components tests
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add -A
          git reset .github/workflows/cleanup-1097-wording-temp.yml
          git commit -m "[1097-cleanup-applied] Remove experimental wording from supported 1097"
          git push origin HEAD:cleanup/1097-supported-wording

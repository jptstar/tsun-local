name: Restore unchanged diagnostic page on docs branch

on:
  push:
    branches:
      - automation/diagnostic-docs
    paths:
      - .github/workflows/restore-diagnostic-page-on-docs-branch.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep unrelated diagnostic page unchanged
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- docs/test-your-inverter.html
          git rm .github/workflows/restore-diagnostic-page-on-docs-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep diagnostic page unchanged"
          git push

name: Update MS2000 docs once

on:
  push:
    branches:
      - docs/ms2000-validation
    paths:
      - .ms2000-docs-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/ms2000-validation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply documentation update
        run: python tools/_update_ms2000_docs_once.py

      - name: Validate modified sources
        run: |
          python -m py_compile tools/_update_ms2000_docs_once.py tests/test_metadata.py tests/test_release_154_web.py tests/test_stable_151_localized_readmes.py
          python -m unittest tests.test_metadata tests.test_release_154_web tests.test_stable_151_localized_readmes
          git diff --check

      - name: Commit documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs tests/test_metadata.py tests/test_release_154_web.py tests/test_stable_151_localized_readmes.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Validate TSOL-MS2000 on real hardware"
            git push origin HEAD:docs/ms2000-validation
          fi

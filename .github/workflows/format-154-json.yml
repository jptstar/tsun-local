name: Normalize 1.5.4 JSON formatting

on:
  push:
    branches:
      - release/1.5.4
    paths:
      - ".github/workflows/format-154-json.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/1.5.4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore standard JSON formatting
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [Path("custom_components/tsun_local/strings.json")]
          files += sorted(Path("custom_components/tsun_local/translations").glob("*.json"))
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit formatting cleanup
        shell: bash
        run: |
          rm -f .github/workflows/format-154-json.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore standard JSON formatting for 1.5.4"
          git push origin HEAD:release/1.5.4

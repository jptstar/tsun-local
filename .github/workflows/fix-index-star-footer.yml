name: Align homepage Star CTA footer

on:
  push:
    branches:
      - docs/star-all-pages

permissions:
  contents: write

jobs:
  align-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/star-all-pages
          fetch-depth: 0
      - name: Add homepage footer CTA
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          star = '<a href="https://github.com/jptstar/tsun-local" aria-label="Star TSUN Local on GitHub">⭐ Star on GitHub</a>'
          footer_end = "Read-only by design</footer>"
          replacement = f"Read-only by design · {star}</footer>"
          if replacement not in text:
              if footer_end not in text:
                  raise SystemExit("Homepage footer anchor not found")
              text = text.replace(footer_end, replacement, 1)
              path.write_text(text, encoding="utf-8")
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-index-star-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html .github/workflows/fix-index-star-footer.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "docs: align homepage GitHub star footer"
          git push origin HEAD:docs/star-all-pages

name: Refresh beta2 public communication labels

on:
  push:
    branches:
      - docs/beta2-communication-labels

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.head_commit.message == 'Refresh beta2 public communication labels' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs branch
        uses: actions/checkout@v6
        with:
          ref: docs/beta2-communication-labels
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh public labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in ('docs/ENTITIES.md', 'docs/entities.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('Com. —', 'Communication —')
              text = text.replace('Communication — Backoff', 'Communication — Slowdowns')
              path.write_text(text, encoding='utf-8')

          notes = Path('docs/releases/1.6.0-beta.2.md')
          text = notes.read_text(encoding='utf-8')
          text = text.replace(
              'Communication diagnostics use short `Com. —` names. State, last response, failures and current interval remain enabled by default; duration, blocks, successes, reason and backoff are advanced diagnostics disabled by default.',
              'Communication diagnostics use the full `Communication —` label. State, last response, failures and current interval remain enabled by default; duration, blocks, successes, reason and the slowdown counter are advanced diagnostics disabled by default.'
          )
          text = text.replace(
              'This beta does **not** learn a permanent per-device optimum polling interval.',
              'The slowdown counter increases only when adaptive polling actually raises the effective polling interval after a communication failure. This beta does **not** learn a permanent per-device optimum polling interval.'
          )
          notes.write_text(text, encoding='utf-8')
          PY

      - name: Verify docs
        run: |
          git diff --check
          ! grep -R -F 'Com. —' docs/ENTITIES.md docs/entities.html docs/releases/1.6.0-beta.2.md
          grep -q 'Communication — Slowdowns' docs/ENTITIES.md
          grep -q 'Communication — Slowdowns' docs/entities.html

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit refreshed docs
        run: |
          rm -f .github/workflows/refresh-beta2-public-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use full communication labels in beta2 docs"
          git push origin HEAD:docs/beta2-communication-labels

name: Apply beta4 device info adjustment

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/apply-device-info-beta4.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Move raw logger profile to device information
        run: |
          python3 - <<'PY'
          from pathlib import Path

          init_path = Path("custom_components/tsun_local/__init__.py")
          text = init_path.read_text(encoding="utf-8")
          old = "from homeassistant.core import HomeAssistant\n"
          new = old + "from homeassistant.helpers import device_registry as dr\n"
          if old not in text or "device_registry as dr" in text:
              raise SystemExit("unexpected __init__.py import state")
          text = text.replace(old, new, 1)

          old = "    DEFAULT_SCAN_INTERVAL,\n    PLATFORMS,\n)"
          new = "    DEFAULT_SCAN_INTERVAL,\n    DOMAIN,\n    MANUFACTURER,\n    PLATFORMS,\n)"
          if old not in text:
              raise SystemExit("const import anchor not found")
          text = text.replace(old, new, 1)

          old = "    await coordinator.async_config_entry_first_refresh()\n    entry.runtime_data = coordinator\n"
          new = '''    await coordinator.async_config_entry_first_refresh()\n\n    logger_sn = str(entry.data[CONF_LOGGER_SN])\n    raw_profile = coordinator.data.get("logger_raw_profile")\n    inverter_serial_number = coordinator.data.get("inverter_serial_number")\n    firmware_version = coordinator.data.get("logger_firmware_version")\n    dr.async_get(hass).async_get_or_create(\n        config_entry_id=entry.entry_id,\n        identifiers={(DOMAIN, logger_sn)},\n        manufacturer=MANUFACTURER,\n        model=coordinator.client.model,\n        model_id=(str(raw_profile) if raw_profile is not None else None),\n        name=f"TSUN Local {logger_sn}",\n        serial_number=(\n            str(inverter_serial_number)\n            if inverter_serial_number is not None\n            else None\n        ),\n        sw_version=(\n            str(firmware_version) if firmware_version is not None else None\n        ),\n    )\n\n    entry.runtime_data = coordinator\n'''
          if old not in text:
              raise SystemExit("setup anchor not found")
          text = text.replace(old, new, 1)
          init_path.write_text(text, encoding="utf-8")

          sensor_path = Path("custom_components/tsun_local/sensor.py")
          text = sensor_path.read_text(encoding="utf-8")
          old = '        "logger_raw_profile",\n'
          if old not in text:
              raise SystemExit("logger_raw_profile metadata key not found")
          text = text.replace(old, "", 1)
          old = '''    TsunSensorDescription(\n        key="logger_raw_profile",\n        suggested_object_id="logger_raw_profile",\n        translation_key="logger_raw_profile",\n        entity_category=EntityCategory.DIAGNOSTIC,\n    ),\n'''
          if old not in text:
              raise SystemExit("logger_raw_profile sensor block not found")
          text = text.replace(old, "", 1)
          sensor_path.write_text(text, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8")
          old = "- expose the raw logger inverter profile reported by `inv_tp` as a diagnostic entity;"
          new = "- show the raw logger inverter profile reported by `inv_tp` in Home Assistant device information;"
          if old not in text:
              raise SystemExit("CHANGELOG beta4 wording not found")
          changelog_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/apply-device-info-beta4.yml")
          workflow.unlink()
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check diff
        run: |
          git diff --check
          git diff --exit-code -- custom_components/tsun_local/manifest.json

      - name: Commit beta adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show raw logger profile in device information"
          git push origin HEAD:beta-1097

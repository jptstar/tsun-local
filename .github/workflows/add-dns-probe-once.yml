name: Apply diagnostic DNS read probe once

on:
  push:
    branches:
      - diagnostic/2.7.1-dns-read-probe
    paths:
      - ".dns-probe-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/2.7.1-dns-read-probe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply patch
        run: python tools/_add_dns_probe_once.py

      - name: Validate source
        run: |
          python -m py_compile tools/tsun_dump.py
          python -m unittest tests.test_tsun_dump_tool tests.test_diagnostic_updates -v
          git diff --check

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_dump.py tests/test_tsun_dump_tool.py tools/README.md docs/HARDWARE_DUMP.md README.md docs/test-your-inverter.html
          git commit -m "Add read-only logger DNS capability probe"
          git push origin HEAD:diagnostic/2.7.1-dns-read-probe

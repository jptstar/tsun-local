name: Build diagnostic 2.7.4 profile catalog

on:
  push:
    branches:
      - diagnostic/2.7.4-profile-catalog

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, '[profile-catalog-build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build profile-catalog diagnostic
        run: python .github/scripts/build_profile_catalog_274.py
      - name: Syntax check
        run: python -m py_compile tools/tsun_dump.py tests/test_tsun_dump_profile_catalog.py
      - name: Run targeted tests
        run: python -m unittest tests.test_tsun_dump_profile_catalog -v
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Commit result and remove one-shot builder
        run: |
          rm .github/workflows/profile-catalog-build.yml
          rm .github/scripts/build_profile_catalog_274.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add logger profile catalog research to diagnostic 2.7.4"
          git push origin HEAD:diagnostic/2.7.4-profile-catalog

name: Finalize 1.6.1 documentation sync

on:
  push:
    branches:
      - sync/v1.6.1-main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize 1.6.1 public documentation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out sync branch
        uses: actions/checkout@v6

      - name: Update public stable version without replacing newer diagnostic docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readmes = [
              Path('README.md'),
              Path('docs/README_FR.md'),
              Path('docs/README_DE.md'),
              Path('docs/README_NL.md'),
              Path('docs/README_IT.md'),
              Path('docs/README_ES.md'),
              Path('docs/README_PL.md'),
              Path('docs/README_ZH.md'),
          ]
          for path in readmes:
              text = path.read_text(encoding='utf-8')
              old = '<strong>1.6.0</strong>'
              if old not in text:
                  raise SystemExit(f'{path}: stable-version banner not found')
              text = text.replace(old, '<strong>1.6.1</strong>', 1)
              path.write_text(text, encoding='utf-8')

          index = Path('docs/index.html')
          text = index.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          changed_meta = 0
          changed_og = 0
          for i, line in enumerate(lines):
              if '<meta name="description"' in line and 'TSUN Local 1.6.0' in line:
                  lines[i] = line.replace('TSUN Local 1.6.0', 'TSUN Local 1.6.1', 1)
                  changed_meta += 1
              elif '<meta property="og:description"' in line and 'TSUN Local 1.6.0' in line:
                  lines[i] = line.replace('TSUN Local 1.6.0', 'TSUN Local 1.6.1', 1)
                  changed_og += 1
          text = ''.join(lines)
          if changed_meta != 1 or changed_og != 1:
              raise SystemExit(f'index metadata replacement mismatch: meta={changed_meta}, og={changed_og}')

          old_schema = '"softwareVersion":"1.6.0"'
          if old_schema not in text:
              raise SystemExit('index softwareVersion 1.6.0 not found')
          text = text.replace(old_schema, '"softwareVersion":"1.6.1"', 1)

          old_install = 'Install or update TSUN Local 1.6.0 directly from HACS.'
          if old_install in text:
              text = text.replace(old_install, 'Install or update TSUN Local 1.6.1 directly from HACS.', 1)

          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit documentation sync and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-1-6-1-docs.yml
          git add README.md docs/index.html docs/README_*.md
          git diff --cached --check
          git commit -m "Finalize 1.6.1 public documentation"
          git push origin HEAD:sync/v1.6.1-main

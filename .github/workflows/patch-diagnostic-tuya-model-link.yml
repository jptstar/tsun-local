name: Patch diagnostic Tuya model link

on:
  push:
    branches:
      - fix/diagnostic-tuya-model-link

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diagnostic-tuya-model-link
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_temp_diagnostic_patch.py
      - name: Compile
        run: python -m py_compile tools/tsun_dump.py tools/tsun_report_upload.py tools/tsun_diagnostic_app.py tools/tsun_diagnostic.py
      - name: Focused tests
        run: python -m unittest tests.test_tsun_dump_tuya tests.test_diagnostic_report_upload
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-diagnostic-tuya-model-link.yml scripts/apply_temp_diagnostic_patch.py
          git add tools/tsun_dump.py tools/tsun_report_upload.py tools/tsun_diagnostic_app.py tools/tsun_diagnostic.py tests/test_tsun_dump_tuya.py tests/test_diagnostic_report_upload.py
          git commit -m "Clarify Tuya diagnostics and link declared models"
          git push origin HEAD:fix/diagnostic-tuya-model-link

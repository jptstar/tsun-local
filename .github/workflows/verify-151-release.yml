name: Verify stable 1.5.1 release

on:
  push:
    branches:
      - beta-1097

permissions:
  contents: write

jobs:
  verify-release:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[verify-151-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Verify stable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          TAG=v1.5.1
          EXPECTED=a7c2103fd321f9c56941dc1ebe3a39fb9e58a082
          ACTUAL=$(git rev-list -n 1 "$TAG")
          test "$ACTUAL" = "$EXPECTED"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Version 1.5.1" --notes-file docs/releases/1.5.1.md
          fi
          test "$(gh release view "$TAG" --json tagName --jq .tagName)" = "$TAG"
          test "$(gh release view "$TAG" --json name --jq .name)" = "Version 1.5.1"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "false"

      - name: Record successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/verify-151-release.yml .github/verify-151-release-trigger.txt
          git commit -m "Verify published TSUN Local 1.5.1 release"
          git push origin HEAD:beta-1097

name: Update TSUN Local 1.6.0-beta.2 public docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.head_commit.message == 'Run one-time beta2 public docs updater' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update public beta2 documentation
        run: python3 .github/scripts/update_beta2_public_docs.py

      - name: Verify documentation diff
        run: |
          git diff --check
          grep -q '1.6.0-beta.2' README.md
          grep -q 'BETA 1.6.0-beta.2' docs/index.html
          grep -q 'adaptive polling diagnostics' docs/ENTITIES.md

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit public beta2 documentation branch
        run: |
          rm -f .github/workflows/update-beta2-public-docs.yml
          rm -f .github/scripts/update_beta2_public_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document 1.6.0-beta.2 prerelease [release-notes]"
          git push --force-with-lease origin HEAD:refs/heads/docs/beta2-public-sync

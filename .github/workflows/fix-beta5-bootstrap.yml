name: Fix beta.5 preparation harness

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/fix-beta5-bootstrap.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Repair beta.5 preparation workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('.github/workflows/prepare-beta5-daily-energy.yml')
          source = path.read_text(encoding='utf-8')

          old_import = '''          from pathlib import Path
          import unittest

          MODULE_PATH = (
'''
          new_import = '''          from pathlib import Path
          import sys
          import unittest

          MODULE_PATH = (
'''
          if old_import not in source:
              raise SystemExit('tracker-test import anchor not found')
          source = source.replace(old_import, new_import, 1)

          old_loader = '''          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)
          DailyEnergyTracker = MODULE.DailyEnergyTracker
'''
          new_loader = '''          MODULE = importlib.util.module_from_spec(SPEC)
          sys.modules[SPEC.name] = MODULE
          SPEC.loader.exec_module(MODULE)
          DailyEnergyTracker = MODULE.DailyEnergyTracker
'''
          if old_loader not in source:
              raise SystemExit('tracker-test loader anchor not found')
          source = source.replace(old_loader, new_loader, 1)

          pattern = re.compile(
              r'''          contract_path = root / 'tests/test_energy_restore_contract.py'\n.*?          contract_path\.write_text\(contract, encoding='utf-8'\)\n''',
              re.DOTALL,
          )
          replacement = '''          contract_path = root / 'tests/test_energy_restore_contract.py'
          contract_path.write_text(textwrap.dedent('''\\
          # Copyright (C) 2026 Jean-Philippe TESTART (jptstar)
          # SPDX-License-Identifier: GPL-3.0-or-later

          """Regression tests for offline energy restoration and daily rollover."""

          from __future__ import annotations

          from pathlib import Path
          import unittest


          ROOT = Path(__file__).parents[1]


          class EnergyRestoreContractTests(unittest.TestCase):
              """Keep the Home Assistant energy restore contract explicit."""

              def test_energy_entities_use_home_assistant_restore_state(self) -> None:
                  source = (ROOT / "custom_components/tsun_local/sensor.py").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn("RestoreEntity", source)
                  self.assertIn("async_get_last_state", source)
                  self.assertIn("STATE_UNKNOWN", source)
                  self.assertIn("STATE_UNAVAILABLE", source)
                  self.assertIn("DailyEnergyTracker", source)

              def test_daily_energy_has_local_midnight_rollover(self) -> None:
                  source = (ROOT / "custom_components/tsun_local/sensor.py").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn("async_track_time_change", source)
                  self.assertIn("hour=0", source)
                  self.assertIn("minute=0", source)
                  self.assertIn("second=0", source)
                  self.assertIn("reset_for_date", source)
                  self.assertIn("dt_util.now().date()", source)
                  self.assertIn("tracking_total_energy", source)
                  self.assertNotIn("_daily_reset_override", source)
                  self.assertNotIn("_daily_reset_successes", source)

              def test_missing_energy_without_history_is_unavailable_not_unknown(self) -> None:
                  source = (ROOT / "custom_components/tsun_local/sensor.py").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn("self._daily_tracker is not None", source)
                  self.assertIn("self._daily_tracker.value is not None", source)
                  self.assertIn("or self._restored_energy_value is not None", source)
                  self.assertNotIn("return True", source)

              def test_1511_adds_all_validated_pv_entities_even_before_live_detection(self) -> None:
                  source = (ROOT / "custom_components/tsun_local/sensor.py").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn('protocol_name == "1511"', source)
                  self.assertIn('description.key.startswith("pv")', source)


          if __name__ == "__main__":
              unittest.main()
          '''), encoding='utf-8')
'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('energy restore contract patch block not found')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit repaired preparation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-beta5-bootstrap.yml
          git add .github/workflows/prepare-beta5-daily-energy.yml
          git commit -m "Repair beta.5 preparation harness"
          git push origin HEAD:beta-1097

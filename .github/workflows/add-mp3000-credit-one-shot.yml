name: Add MP3000 contributor credit

on:
  push:
    branches:
      - docs/site-polish-2026-09-08
    paths:
      - .github/workflows/add-mp3000-credit-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credit confirmed MP3000 testers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contributors = Path('docs/contributors.html')
          text = contributors.read_text(encoding='utf-8')
          old = '<div class="card"><span class="role">1097 discovery through real-world testing</span><a href="https://github.com/TheSmartGerman"><strong>@TheSmartGerman</strong></a><p>Installed TSUN Local on his own hardware. His installation unexpectedly revealed that TSUN Local was also detecting a device using protocol 1097, which led to the discovery and further investigation of this additional protocol family.</p></div>'
          new = '<div class="card"><span class="role">TSOL-MP3000 / 1511 testing &amp; 1097 discovery</span><a href="https://github.com/TheSmartGerman"><strong>@TheSmartGerman</strong></a><p>Tested TSUN Local on a real TSOL-MP3000 using the validated 1511 path and shared compatibility feedback. During this real-device testing, protocol 1097 was also detected unintentionally, leading to the discovery and further investigation of that additional protocol family.</p></div>'
          if old not in text:
              raise SystemExit('TheSmartGerman contributor card not found')
          contributors.write_text(text.replace(old, new, 1), encoding='utf-8')

          mp = Path('docs/tsol-mp3000-home-assistant.html')
          text = mp.read_text(encoding='utf-8')
          marker = '      <div class="card"><strong><a href="https://github.com/paloindici">@paloindici</a></strong><span class="muted">Shared anonymized Home Assistant diagnostics and hardware dumps from a real TSOL-MP3000. These captures helped verify the six-PV path and investigate firmware-dependent diagnostic values.</span></div>\n'
          addition = '      <div class="card"><strong><a href="https://github.com/TheSmartGerman">@TheSmartGerman</a></strong><span class="muted">Tested TSUN Local on a real TSOL-MP3000 over the 1511 path and shared compatibility feedback; this installation also unexpectedly exposed the additional 1097 protocol family.</span></div>\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('MP3000 community validation marker not found')
              text = text.replace(marker, marker + addition, 1)
          mp.write_text(text, encoding='utf-8')

          assert '@TheSmartGerman' in mp.read_text(encoding='utf-8')
          assert 'TSOL-MP3000 / 1511 testing' in contributors.read_text(encoding='utf-8')
          PY
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add docs/contributors.html docs/tsol-mp3000-home-assistant.html
          git diff --cached --check
          git commit -m "Credit confirmed MP3000 hardware testers"
          git push origin HEAD:docs/site-polish-2026-09-08

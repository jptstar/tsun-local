name: Prepare TSUN Local 1.5.4

on:
  push:
    branches:
      - release/1.5.4
    paths:
      - "tools/_release_154_patch.py"
      - ".github/workflows/release-154-prep.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/1.5.4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply 1.5.4 documentation patch
        run: python tools/_release_154_patch.py

      - name: Validate JSON and Python
        shell: bash
        run: |
          python -m compileall -q custom_components/tsun_local tests
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit prepared release
        shell: bash
        run: |
          rm -f tools/_release_154_patch.py .github/workflows/release-154-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare TSUN Local 1.5.4 release"
          git push origin HEAD:release/1.5.4

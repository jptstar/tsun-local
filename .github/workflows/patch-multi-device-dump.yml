              'parser.add_argument("--host", help="logger IP address; when omitted, all discovered loggers are captured")',
              1,
          )
          text = text.replace(
              'parser.add_argument("--serial", type=int, help="numeric Monitor SN; discovered/prompted if omitted")',
              'parser.add_argument("--serial", type=int, help="numeric Monitor SN for single-target use; normally discovered/prompted")',
              1,
          )
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_tsun_dump_tool.py')
          t = tests.read_text(encoding='utf-8')
          marker = '''    def test_output_filename_is_sanitized(self) -> None:\n'''
          addition = '''    def test_multi_device_output_names_are_unique(self) -> None:\n        from datetime import UTC, datetime\n\n        stamp = datetime(2026, 8, 20, 8, 0, tzinfo=UTC)\n        first = TOOL.default_output_path("TSOL-MS800", "02b0", stamp, device_index=1)\n        second = TOOL.default_output_path("TSOL-MS800", "02b0", stamp, device_index=2)\n        self.assertNotEqual(first, second)\n        self.assertIn("device-01", first.name)\n        self.assertIn("device-02", second.name)\n\n    def test_multi_device_explicit_output_gets_index_suffix(self) -> None:\n        from datetime import UTC, datetime\n\n        path = TOOL.output_path_for_target(\n            Path("dump.json"),\n            None,\n            "1097",\n            datetime(2026, 8, 20, 8, 0, tzinfo=UTC),\n            device_index=2,\n            total_targets=3,\n        )\n        self.assertEqual(path.name, "dump_device-02.json")\n\n'''

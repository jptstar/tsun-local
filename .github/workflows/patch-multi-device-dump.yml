          python3 -m unittest tests.test_tsun_dump_tool

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/tsun_dump.py tests/test_tsun_dump_tool.py
          git commit -m 'Scan and dump every discovered TSUN logger'
          git push origin HEAD:fix/multi-device-dump

name: Sync star CTA across localized READMEs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-star-readmes-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add localized star badge and call-to-action
        shell: python
        run: |
          from pathlib import Path

          repo = "https://github.com/jptstar/tsun-local"
          star_line = f'  <a href="{repo}"><img alt="GitHub stars" src="https://img.shields.io/github/stars/jptstar/tsun-local?style=flat&logo=github&label=Stars"></a>\n'
          hacs_line = '  <a href="https://github.com/hacs/integration"><img alt="HACS" src="https://img.shields.io/badge/HACS-Custom-41BDF5"></a>\n'

          messages = {
              "README_FR.md": '⭐ <strong>Vous utilisez TSUN Local ?</strong> S’il vous est utile, <a href="https://github.com/jptstar/tsun-local">mettez une étoile au projet sur GitHub</a> — cela aide d’autres utilisateurs TSUN à le découvrir.',
              "README_DE.md": '⭐ <strong>Nutzen Sie TSUN Local?</strong> Wenn es Ihnen hilft, <a href="https://github.com/jptstar/tsun-local">geben Sie dem Projekt einen Stern auf GitHub</a> — so können andere TSUN-Nutzer es leichter finden.',
              "README_NL.md": '⭐ <strong>Gebruik je TSUN Local?</strong> Helpt het je, <a href="https://github.com/jptstar/tsun-local">geef het project dan een ster op GitHub</a> — zo kunnen andere TSUN-gebruikers het makkelijker vinden.',
              "README_IT.md": '⭐ <strong>Usi TSUN Local?</strong> Se ti è utile, <a href="https://github.com/jptstar/tsun-local">lascia una stella al progetto su GitHub</a> — aiuta altri utenti TSUN a scoprirlo.',
              "README_ES.md": '⭐ <strong>¿Usas TSUN Local?</strong> Si te resulta útil, <a href="https://github.com/jptstar/tsun-local">dale una estrella al proyecto en GitHub</a> — ayuda a otros usuarios de TSUN a descubrirlo.',
              "README_PL.md": '⭐ <strong>Używasz TSUN Local?</strong> Jeśli jest dla Ciebie przydatny, <a href="https://github.com/jptstar/tsun-local">dodaj projektowi gwiazdkę na GitHubie</a> — pomoże to innym użytkownikom TSUN go znaleźć.',
              "README_ZH.md": '⭐ <strong>正在使用 TSUN Local？</strong> 如果它对你有帮助，请<a href="https://github.com/jptstar/tsun-local">在 GitHub 上为项目点个 Star</a> — 这能帮助更多 TSUN 用户发现它。',
          }

          for filename, message in messages.items():
              path = Path("docs") / filename
              text = path.read_text(encoding="utf-8")
              if "img.shields.io/github/stars/jptstar/tsun-local" not in text:
                  if hacs_line not in text:
                      raise RuntimeError(f"HACS badge anchor not found in {path}")
                  text = text.replace(hacs_line, hacs_line + star_line, 1)

              cta = f'<p align="center">{message}</p>'
              if cta not in text:
                  star_pos = text.index("img.shields.io/github/stars/jptstar/tsun-local")
                  block_end = text.index("</p>", star_pos) + len("</p>")
                  text = text[:block_end] + "\n\n" + cta + text[block_end:]

              path.write_text(text, encoding="utf-8")

      - name: Publish localized README update branch
        shell: bash
        run: |
          branch="automation/star-readmes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git rm .github/workflows/sync-star-readmes-once.yml
          git add docs/README_*.md
          git commit -m "Add star CTA to localized READMEs"
          git push --force origin "$branch"

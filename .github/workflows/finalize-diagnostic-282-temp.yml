name: Finalize diagnostic 2.8.2

on:
  push:
    branches:
      - feature/1.6.2-protocol-coverage
    paths:
      - .github/workflows/finalize-diagnostic-282-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Retry finalize diagnostic 2.8.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Final consistency fixes and full test suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/tsun_dump.py')
          text = p.read_text(encoding='utf-8')
          old = '"regular_dump_sensor_list": "0x0000"'
          if old not in text:
              raise SystemExit('02B0 regular dump sensor-list metadata marker not found')
          text = text.replace(old, '"regular_dump_sensor_list": "0x02B0"', 1)
          p.write_text(text, encoding='utf-8')
          PY

          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic.py
          python -m unittest discover -s tests -v

      - name: Commit finalized diagnostic and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/update-diagnostic-282-temp.yml
          rm -f .github/workflows/finalize-diagnostic-282-temp.yml
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add -A
          git commit -m "Finalize diagnostic 2.8.2"
          git push origin HEAD:feature/1.6.2-protocol-coverage

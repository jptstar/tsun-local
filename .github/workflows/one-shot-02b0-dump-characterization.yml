name: One-shot 02B0 dump characterization

on:
  push:
    branches:
      - fix/02b0-diagnostic-characterization
    paths:
      - .github/workflows/one-shot-02b0-dump-characterization.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/02b0-diagnostic-characterization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply dump characterization patch
        run: python .github/scripts/apply_02b0_dump_characterization.py

      - name: Run dump tool tests
        run: python -m unittest discover -s tests -p 'test_tsun_dump_tool.py' -v

      - name: Compile dumper
        run: python -m py_compile tools/tsun_dump.py

      - name: Commit validated result and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_dump.py tests/test_tsun_dump_tool.py docs/HARDWARE_DUMP.md
          git rm .github/scripts/apply_02b0_dump_characterization.py
          git rm .github/workflows/one-shot-02b0-dump-characterization.yml
          git commit -m "Improve 02B0 hardware dump diagnostics"
          git push origin HEAD:fix/02b0-diagnostic-characterization

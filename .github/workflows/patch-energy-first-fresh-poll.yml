name: Patch energy first fresh poll

on:
  push:
    branches:
      - fix/energy-first-fresh-poll-work

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/energy-first-fresh-poll-work
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply, test and commit focused correction
        run: |
          if git log -1 --pretty=%B | grep -q '\[energy-first-fresh-poll-patched\]'; then
            echo "Patch already applied."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          sensor_path = Path("custom_components/tsun_local/sensor.py")
          source = sensor_path.read_text(encoding="utf-8")

          old_method = '''    @callback
    @override
    def _handle_coordinator_update(self) -> None:
        """Release a daily reset only after two fresh successful protocol polls."""
        key = self.entity_description.key
        if (
            self._is_daily_energy
            and self._daily_reset_override
            and bool(self.coordinator.data.get("communication_online", False))
            and key in self.coordinator.data
        ):
            self._daily_reset_successes += 1
            if self._daily_reset_successes >= 2:
                self._daily_reset_override = False
        super()._handle_coordinator_update()
'''
          new_method = '''    @callback
    @override
    def _handle_coordinator_update(self) -> None:
        """Use the first fresh daily-energy sample after an offline rollover."""
        key = self.entity_description.key
        if (
            self._is_daily_energy
            and self._daily_reset_override
            and bool(self.coordinator.data.get("communication_online", False))
            and key in self.coordinator.data
        ):
            self._daily_reset_override = False
        super()._handle_coordinator_update()
'''

          if old_method not in source:
              raise SystemExit("Expected two-poll rollover method not found")
          source = source.replace(old_method, new_method, 1)
          source = source.replace("        self._daily_reset_successes = 0\n", "")
          source = source.replace("                self._daily_reset_successes = 0\n", "")
          if "_daily_reset_successes" in source:
              raise SystemExit("Obsolete daily-reset counter still present")
          sensor_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_energy_restore_contract.py")
          tests = test_path.read_text(encoding="utf-8")
          old_assert = '        self.assertIn("self._daily_reset_successes >= 2", source)\n'
          new_assert = (
              '        self.assertIn("self._daily_reset_override = False", source)\n'
              '        self.assertNotIn("_daily_reset_successes", source)\n'
          )
          if old_assert not in tests:
              raise SystemExit("Expected rollover regression assertion not found")
          tests = tests.replace(old_assert, new_assert, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

          python -m unittest discover -s tests -v

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-energy-first-fresh-poll.yml
          git add custom_components/tsun_local/sensor.py tests/test_energy_restore_contract.py
          git commit -m "Use first fresh daily energy after offline rollover [energy-first-fresh-poll-patched]"
          git push origin HEAD:fix/energy-first-fresh-poll-work

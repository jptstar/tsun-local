name: Link contributor profiles

on:
  push:
    branches:
      - docs/link-testers
    paths:
      - .github/workflows/link-contributors.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/link-testers
          fetch-depth: 0

      - name: Add GitHub profile links
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '<strong>TheSmartGerman</strong>': '<a href="https://github.com/TheSmartGerman"><strong>@TheSmartGerman</strong></a>',
              '<strong>dca31</strong>': '<a href="https://github.com/dca31"><strong>@dca31</strong></a>',
          }

          for filename in ('docs/index.html', 'docs/contributors.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'{filename}: no contributor names replaced')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          git diff --check
          grep -q 'href="https://github.com/TheSmartGerman"><strong>@TheSmartGerman</strong>' docs/index.html
          grep -q 'href="https://github.com/dca31"><strong>@dca31</strong>' docs/index.html
          grep -q 'href="https://github.com/TheSmartGerman"><strong>@TheSmartGerman</strong>' docs/contributors.html
          grep -q 'href="https://github.com/dca31"><strong>@dca31</strong>' docs/contributors.html

      - name: Remove temporary workflow
        run: rm .github/workflows/link-contributors.yml

      - name: Commit links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link tester GitHub profiles on website'
          git push origin HEAD:docs/link-testers

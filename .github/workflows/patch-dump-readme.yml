name: Add dump tool to README

on:
  push:
    branches:
      - feature/tsun-super-dump

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[patch-dump-readme]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add hardware dump section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 🔬 Hardware validation dump tool'
          if marker not in text:
              anchor = '## Test another TSUN model\n'
              if anchor not in text:
                  raise SystemExit('README anchor not found')
              block = '''## 🔬 Hardware validation dump tool\n\nHelp validate another TSUN model with one standardized, privacy-safe, **strictly read-only** capture:\n\n```bash\npython tools/tsun_dump.py\n```\n\nThe tool first searches the local network for a TSUN logger. If automatic discovery cannot resolve everything, it asks only for the missing **IP address and/or Monitor SN**. Neither value is stored in the generated JSON.\n\nUse `--full` for the additional known-safe research ranges or `--compare before.json after.json` for controlled before/after register validation. No brute-force scan and no inverter write operation are implemented.\n\n📚 **[Hardware Validation Dump Tool guide](docs/HARDWARE_DUMP.md)**\n\n---\n\n'''
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-dump-readme.yml .github/patch-dump-readme-trigger.txt
          git add README.md
          git commit -m 'Document TSUN hardware validation dump tool'
          git push origin HEAD:feature/tsun-super-dump

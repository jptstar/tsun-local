name: Refresh public site contract

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-public-site-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public site metadata test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_metadata.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "        self.assertIn('entities.html', index)\n        self.assertIn('sunology-play2.html', index)",
              "        self.assertIn('sunology-play2.html', index)\n        self.assertIn('Windows diagnostic →', index)\n        self.assertIn('Python diagnostic →', index)\n        self.assertIn('Mac &amp; Linux diagnostic →', index)",
              1,
          )
          text = text.replace(
              '        self.assertIn("VALIDATED ON REAL SUNOLOGY PLAY2 HARDWARE", play2)\n        self.assertIn("LSW5BLE_17_02B0_1.08-D1", play2)\n        self.assertIn("No proxy", play2)',
              '        self.assertIn("TWO PLAY2 HARDWARE PATHS OBSERVED · 02B0 + 1097", play2)\n        self.assertIn("GEN3 Plus · protocol 02B0", play2)\n        self.assertIn("GEN4 · protocol 1097", play2)\n        self.assertIn("Tengsheng_G4", play2)\n        self.assertIn("4247", play2)\n        self.assertIn("LSW5BLE_17_02B0_1.08-D1", play2)\n        self.assertIn("read-only", play2)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add tests/test_metadata.py
          git rm .github/workflows/refresh-public-site-contract.yml
          git diff --cached --check
          git commit -m "Update PLAY2 public site contract"
          git push

name: One-time merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-merged-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run merged branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete branches already merged into main
        shell: bash
        run: |
          set -u
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          deleted=0
          kept=0
          failed=0

          while IFS= read -r ref; do
            branch="${ref#origin/}"

            case "$branch" in
              main|gh-pages|beta/v1.7.0-beta.1-cloud-guard)
                echo "KEEP explicit: $branch"
                kept=$((kept + 1))
                continue
                ;;
            esac

            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "DELETE merged: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              else
                echo "FAILED delete: $branch"
                failed=$((failed + 1))
              fi
            else
              echo "KEEP unmerged/diverged: $branch"
              kept=$((kept + 1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep '^origin/' | grep -v '^origin/HEAD$')

          echo "SUMMARY deleted=$deleted kept=$kept failed=$failed"

name: Prepare activity cleanup and country profile

on:
  push:
    branches:
      - feature/1.6.2-activity-country-profile
    paths:
      - .github/workflows/apply-activity-country-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/1.6.2-activity-country-profile
          fetch-depth: 0

      - name: Reuse the prepared transformation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          old = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/apply-activity-country-temp.yml"],
              text=True,
          )
          start_marker = "      - name: Apply activity cleanup and country profile changes\n        run: |\n"
          end_marker = "\n      - name: Remove one-time workflow\n"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          block = old[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          Path("/tmp/apply_activity_country.sh").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          bash /tmp/apply_activity_country.sh

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-activity-country-temp.yml

      - name: Validate focused changes
        run: |
          set -euo pipefail
          python -m compileall -q custom_components tests
          python -m unittest \
            tests.test_activity_visibility \
            tests.test_country_profiles \
            tests.test_beta2_release_contract -v
          git diff --check

      - name: Commit prepared changes
        run: |
          set -euo pipefail
          git config user.name "jptstar"
          git config user.email "dev@jptstar.com"
          git add -A
          git commit -m "Reduce activity noise and add country profiles"
          git push origin HEAD:feature/1.6.2-activity-country-profile

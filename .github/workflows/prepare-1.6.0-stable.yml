name: Prepare TSUN Local 1.6.0 stable

on:
  push:
    branches:
      - release/1.6.0

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.head_commit.message == 'Run 1.6.0 stable preparation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/1.6.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Normalize translation audit
        run: |
          sed -i '/expected_keys = key_paths(source)/a expected_keys.discard("title")' .github/scripts/prepare_160_stable.py
          sed -i '/source_keys = keys(source)/a\        source_keys.discard("title")' tests/test_beta2_release_contract.py

      - name: Finalize stable documentation and release metadata
        run: python3 .github/scripts/prepare_160_stable.py

      - name: Verify stable release files
        run: |
          git diff --check
          grep -q '"version": "1.6.0"' custom_components/tsun_local/manifest.json
          grep -q '^## \[1.6.0\] - 2026-09-04' CHANGELOG.md
          test -f docs/releases/1.6.0.md
          grep -q '<strong>1.6.0</strong>' README.md
          grep -q 'NEW IN 1.6.0' docs/index.html
          grep -q '1.6.0 STABLE' docs/entities.html

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit validated stable candidate
        run: |
          rm -f .github/workflows/prepare-1.6.0-stable.yml
          rm -f .github/scripts/prepare_160_stable.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize TSUN Local 1.6.0 stable candidate"
          git push origin HEAD:release/1.6.0

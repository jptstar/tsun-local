name: Publish TSUN Local beta 3

on:
  push:
    branches:
      - automation/publish-1.6.2-beta.3
    paths:
      - .github/workflows/publish-beta3-temp.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build beta.3 source from current main
        run: python3 tools/_publish_beta3_temp.py

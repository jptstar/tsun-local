name: Prepare last-success activity throttle

on:
  push:
    branches:
      - feature/1.6.2-activity-country-profile
    paths:
      - .github/workflows/apply-last-success-throttle-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/1.6.2-activity-country-profile
          fetch-depth: 0

      - name: Apply five-minute public timestamp throttle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('custom_components/tsun_local/coordinator.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'INVERTER_SERIAL_PREFIX_LENGTH = 3\n',
              'INVERTER_SERIAL_PREFIX_LENGTH = 3\nLAST_SUCCESS_PUBLISH_INTERVAL = timedelta(minutes=5)\n',
              1,
          )
          text = text.replace(
              '        self._last_success: datetime | None = None\n',
              '        self._last_success: datetime | None = None\n        self._last_success_published: datetime | None = None\n',
              1,
          )
          text = text.replace(
              '                    "communication_last_success": self._last_success,\n',
              '                    "communication_last_success": self._last_success_published,\n',
              1,
          )
          old = '''        self._handle_successful_poll()\n        self._last_success = dt_util.utcnow()\n        measurements = _add_common_alarm_metadata(\n'''
          new = '''        was_offline = self._online is False\n        self._handle_successful_poll()\n        self._last_success = dt_util.utcnow()\n        if (\n            self._last_success_published is None\n            or was_offline\n            or self._last_success - self._last_success_published\n            >= LAST_SUCCESS_PUBLISH_INTERVAL\n        ):\n            self._last_success_published = self._last_success\n        measurements = _add_common_alarm_metadata(\n'''
          if old not in text:
              raise SystemExit('success timestamp anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '            "communication_last_success": self._last_success,\n',
              '            "communication_last_success": self._last_success_published,\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Add runtime regression coverage using the coordinator test's HA stubs.
          test = Path('tests/test_coordinator_failures.py')
          source = test.read_text(encoding='utf-8')
          marker = '    async def test_refreshed_serial_updates_log_prefix(self) -> None:\n'
          if marker not in source:
              raise SystemExit('coordinator test insertion marker not found')
          block = '''    async def test_last_success_entity_is_throttled_but_diagnostics_stay_exact(self) -> None:\n        times = iter(\n            (\n                datetime(2026, 8, 11, 12, 0, tzinfo=timezone.utc),\n                datetime(2026, 8, 11, 12, 0, 20, tzinfo=timezone.utc),\n                datetime(2026, 8, 11, 12, 5, tzinfo=timezone.utc),\n            )\n        )\n        original_utcnow = COORDINATOR.dt_util.utcnow\n        COORDINATOR.dt_util.utcnow = lambda: next(times)\n        try:\n            client = _Client(\n                [\n                    _ReadResult({"ac_power": 400}),\n                    _ReadResult({"ac_power": 410}),\n                    _ReadResult({"ac_power": 420}),\n                ]\n            )\n            coordinator = COORDINATOR.TsunCoordinator(\n                object(), object(), client, 20, 25, 300, 3, asyncio.Lock()\n            )\n            first = await coordinator._async_update_data()\n            coordinator.data = first\n            second = await coordinator._async_update_data()\n            coordinator.data = second\n            third = await coordinator._async_update_data()\n\n            self.assertEqual(\n                first["communication_last_success"],\n                datetime(2026, 8, 11, 12, 0, tzinfo=timezone.utc),\n            )\n            self.assertEqual(\n                second["communication_last_success"],\n                first["communication_last_success"],\n            )\n            self.assertEqual(\n                third["communication_last_success"],\n                datetime(2026, 8, 11, 12, 5, tzinfo=timezone.utc),\n            )\n            self.assertEqual(\n                coordinator.diagnostic_summary["last_success"],\n                "2026-08-11T12:05:00+00:00",\n            )\n        finally:\n            COORDINATOR.dt_util.utcnow = original_utcnow\n\n'''
          if 'test_last_success_entity_is_throttled_but_diagnostics_stay_exact' not in source:
              source = source.replace(marker, block + marker, 1)
          test.write_text(source, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          c = c.replace(
              '- Reduce Home Assistant Activity noise across 1511, 02B0 and 1097 by hiding `communication_last_success` and raw `*_raw` diagnostics from normal UI visibility while keeping them available for diagnostics; existing entries are migrated once and user unhide choices are respected afterwards.\n',
              '- Reduce Home Assistant Activity noise across 1511, 02B0 and 1097 by publishing the visible `communication_last_success` timestamp at most every five minutes, hiding it and raw `*_raw` diagnostics from normal UI visibility while keeping exact last-success timing in diagnostics; existing entries are migrated once and user unhide choices are respected afterwards.\n',
              1,
          )
          changelog.write_text(c, encoding='utf-8')

          entities = Path('docs/ENTITIES.md')
          e = entities.read_text(encoding='utf-8')
          e = e.replace(
              'To keep Home Assistant Activity useful, `communication_last_success` and raw `*_raw` diagnostics are hidden from normal UI visibility by default across 1511, 02B0 and 1097. They are not removed: users can reveal them from entity settings, and existing enabled entities continue to be recorded. Meaningful states such as online/offline, adaptive polling state, operating state and decoded alarm names remain visible.',
              'To keep Home Assistant Activity useful, the public `communication_last_success` entity is updated at most every five minutes and, together with raw `*_raw` diagnostics, is hidden from normal UI visibility by default across 1511, 02B0 and 1097. The exact last-success time remains available in integration diagnostics. These entities are not removed: users can reveal them from entity settings, and existing enabled entities continue to be recorded. Meaningful states such as online/offline, adaptive polling state, operating state and decoded alarm names remain visible.',
              1,
          )
          entities.write_text(e, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-last-success-throttle-temp.yml

      - name: Validate focused behavior
        run: |
          set -euo pipefail
          python -m compileall -q custom_components tests
          python -m unittest \
            tests.test_activity_visibility \
            tests.test_country_profiles \
            tests.test_beta2_release_contract \
            tests.test_coordinator_failures -v
          git diff --check

      - name: Commit prepared changes
        run: |
          set -euo pipefail
          git config user.name "jptstar"
          git config user.email "dev@jptstar.com"
          git add -A
          git commit -m "Throttle last-success activity updates"
          git push origin HEAD:feature/1.6.2-activity-country-profile

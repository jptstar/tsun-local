name: Test diagnostic update bump

on:
  push:
    branches:
      - test/diagnostic-update-1.4.3

permissions:
  contents: write

jobs:
  bump:
    if: contains(github.event.head_commit.message, '[test-update-bump]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Bump GUI version only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/tsun_diagnostic_gui.py')
          text = p.read_text(encoding='utf-8')
          old = 'APP_VERSION = "1.4.2"'
          new = 'APP_VERSION = "1.4.3"'
          if old not in text:
              raise SystemExit('expected GUI version 1.4.2 not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile tools/tsun_diagnostic_gui.py tools/tsun_dump.py
          python -m unittest discover -s tests -v
      - name: Commit bump and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/tsun_diagnostic_gui.py
          git rm .github/workflows/test-update-bump.yml
          git commit -m 'Publish GUI 1.4.3 update test'
          git push

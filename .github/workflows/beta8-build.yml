name: Prepare 1.4.0 beta.8

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/beta8-build.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply beta.8 changes
        run: |
          python .github/scripts/prepare_beta8.py
          python .github/scripts/fix_beta8.py
          python .github/scripts/fix_beta8_version.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/tsun_local").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("JSON validation OK")
          PY

      - name: Commit beta.8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/beta8-build.yml .github/scripts/prepare_beta8.py .github/scripts/fix_beta8.py .github/scripts/fix_beta8_version.py
          git add -A
          git commit -m "feat: prepare TSUN Local 1.4.0 beta.8"
          git push origin HEAD:beta-1097

      - name: Publish beta.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a v1.4.0-beta.8 -m "TSUN Local 1.4.0 beta.8"
          git push origin v1.4.0-beta.8
          cat > /tmp/release-notes.md <<'EOF'
          ## TSUN Local 1.4.0-beta.8

          ### Added
          - Complete read-only advanced grid diagnostics for 1511 and 02B0.
          - Read-only 02B0 output coefficient.
          - Experimental 1097 advanced diagnostics: protocol/inverter versions, temperature, insulation impedance RX/RY and raw country/profile code.
          - New entity translations in all 8 supported languages.
          - New concise README prepared for the final 1.4 release.

          ### Fixed
          - Correct 1511 PV daily-energy register offsets for PV1-PV6.

          ### Safety
          - Read-only only. No inverter configuration writes.

          ### 1097 acknowledgement
          The experimental 1097 mapping is informed by publicly available protocol research from Stefan Allius / `s-allius/tsun-gen3-proxy`, adapted for direct local use in TSUN Local.
          EOF
          gh release create v1.4.0-beta.8 --verify-tag --prerelease --title "Version 1.4.0-beta.8" --notes-file /tmp/release-notes.md

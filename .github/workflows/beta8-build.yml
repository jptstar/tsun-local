from __future__ import annotations

import importlib.util
from pathlib import Path
import sys
import unittest

PROTOCOLS_PATH = Path(__file__).parents[1] / "custom_components" / "tsun_local" / "protocols"
SPEC = importlib.util.spec_from_file_location(

name: Harden super dump privacy

on:
  push:
    branches:
      - feature/tsun-super-dump

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[patch-super-dump]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Harden discovery and 1097 privacy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/tsun_dump.py')
          text = path.read_text(encoding='utf-8')

          old = '''    for match in _SERIAL_TOKEN.finditer(text):\n        candidate = int(match.group(1))\n        if _valid_monitor_sn(candidate):\n            found.add(candidate)\n    return found\n'''
          new = '''    if parsed is None:\n        for match in _SERIAL_TOKEN.finditer(text):\n            candidate = int(match.group(1))\n            if _valid_monitor_sn(candidate):\n                found.add(candidate)\n    return found\n'''
          if old not in text:
              raise SystemExit('serial fallback block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '*split_modbus_range(0x1000, 0x100F),',
              '*split_modbus_range(0x1008, 0x100F),',
          )
          if 'split_modbus_range(0x1000, 0x100F)' in text:
              raise SystemExit('1097 serial-number range still present')

          old_privacy = '''                "logger_sn_in_output": False,\n                "ap_envelope_in_output": False,\n'''
          new_privacy = '''                "logger_sn_in_output": False,\n                "inverter_serial_in_output": False,\n                "ap_envelope_in_output": False,\n'''
          if old_privacy not in text:
              raise SystemExit('privacy metadata block not found')
          text = text.replace(old_privacy, new_privacy, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify privacy-sensitive ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('tools/tsun_dump.py').read_text(encoding='utf-8')
          assert 'split_modbus_range(0x1000, 0x100F)' not in text
          assert '"inverter_serial_in_output": False' in text
          assert 'if parsed is None:' in text
          print('Super dump privacy hardening verified.')
          PY

      - name: Commit hardened tool and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-super-dump.yml .github/patch-super-dump-trigger.txt
          git add tools/tsun_dump.py
          git commit -m 'Harden TSUN dump privacy'
          git push origin HEAD:feature/tsun-super-dump

name: Validate and publish beta5 final

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/publish-beta5-final.yml"

permissions:
  contents: write

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta-1097
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components/tsun_local tests
      - run: git diff --check

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta-1097
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  publish:
    name: Publish beta5
    needs: [unit-tests, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0
      - name: Remove temporary workflow and finalize beta tree
        run: |
          rm .github/workflows/publish-beta5-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize beta5 release"
          git push origin HEAD:beta-1097
      - name: Publish beta5 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.4.0-beta.5"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --prerelease \
            --title "Version 1.4.0-beta.5" \
            --notes $'### Fixed\n- Logger Wi-Fi signal now refreshes on an independent five-minute timer, even while inverter polling is offline.\n- Fresh logger metadata is no longer overwritten by stale coordinator data after a failed inverter poll.\n- The raw logger profile is retried every five minutes until available and is pushed into Home Assistant device information immediately.\n- Entity DeviceInfo also carries the raw logger profile for reliable device-registry registration.\n\n### Changed\n- The experimental 1097 source now directly credits Stefan Allius and the public s-allius/tsun-gen3-proxy research.\n\n### Safety\n- Logger metadata remains read-only and uses local HTTP GET requests only.\n- No inverter control or configuration write has been added.'

              '        args.protocol, host, args.port, sn, args.timeout\n    )\n',
              '        args.protocol, host, args.port, sn, args.timeout, discovery.get("protocol_hint")\n    )\n',
              1,
          )

          parser_anchor = '''    parser.add_argument(\n        "--tcp-scan-timeout",\n        type=_non_negative_float,\n        default=DEFAULT_TCP_SCAN_TIMEOUT,\n        help="TCP connect timeout used by bounded discovery fallback",\n    )\n'''
          parser_repl = parser_anchor + '''    parser.add_argument(\n        "--http-scan-timeout",\n        type=_non_negative_float,\n        default=DEFAULT_HTTP_SCAN_TIMEOUT,\n        help="HTTP port-80 connect timeout used by universal discovery",\n    )\n    parser.add_argument(\n        "--http-page-timeout",\n        type=_non_negative_float,\n        default=DEFAULT_HTTP_PAGE_TIMEOUT,\n        help="timeout for local logger status-page identity reads",\n    )\n'''
          if parser_anchor not in text:
              raise SystemExit('parser tcp timeout anchor not found')
          text = text.replace(parser_anchor, parser_repl)

          text = text.replace(
              '            "1511, 02B0 and 1097. Without --host, all discovered loggers are captured."\n',
              '            "1511, 02B0 and 1097. Discovery combines UDP, TCP 8899, HTTP and AP identity."\n'
          )

          p.write_text(text)

          # Tests: update version and add focused identity/discovery parser coverage.
          t = Path('tests/test_tsun_dump_tool.py')
          tests = t.read_text().replace('self.assertEqual(TOOL.TOOL_VERSION, "2.1.0")', 'self.assertEqual(TOOL.TOOL_VERSION, "2.3.0")')
          marker = '    def test_known_1511_firmware_decoder(self) -> None:\n'
          extra = '''    def test_protocol_hint_from_firmware(self) -> None:\n        self.assertEqual(TOOL.protocol_from_firmware("LSW5_SSL_1511_1.03"), "1511")\n        self.assertEqual(TOOL.protocol_from_firmware("LSW5_SSL_02B0_1.00"), "02b0")\n        self.assertEqual(TOOL.protocol_from_firmware("LSW5_SSL_1097_1.00"), "1097")\n\n    def test_logger_web_identity_cover_mid(self) -> None:\n        serials, firmware, hint, recognized = TOOL._web_identity_from_document(\n            'var cover_mid="1234567890"; var cover_ver="LSW5_SSL_1511_1.03";'\n        )\n        self.assertEqual(serials, {1234567890})\n        self.assertEqual(firmware, "LSW5_SSL_1511_1.03")\n        self.assertEqual(hint, "1511")\n        self.assertTrue(recognized)\n\n    def test_ap_identity_extraction(self) -> None:\n        payload = TOOL.build_modbus_request(0x3000, 0x3000)\n        frame = bytearray(TOOL.build_ap_frame(1234567890, payload))\n        frame[3:7] = b"\\x10\\x15\\x00\\x00"\n        frame[11] = 0x02\n        frame[12] = 0x01\n        frame[-2] = TOOL.checksum_ap(frame[1:-2])\n        self.assertEqual(TOOL.extract_ap_logger_sn(bytes(frame)), 1234567890)\n\n'''
          if marker not in tests:
              raise SystemExit('test marker not found')
          tests = tests.replace(marker, extra + marker)
          t.write_text(tests)

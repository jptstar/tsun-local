name: Apply TSUN Local 1.5.4 credits update

on:
  push:
    branches:
      - docs/credits-1.5.4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: docs/credits-1.5.4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply credits patch
        run: python tools/_credits_154_patch.py

      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit clean credits update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/_credits_154_patch.py .github/workflows/credits-154-patch.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add public protocol and contributor credits to website"
          git push origin HEAD:docs/credits-1.5.4

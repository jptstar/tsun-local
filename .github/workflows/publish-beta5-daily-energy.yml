name: Publish beta.5 daily energy

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/publish-beta5-daily-energy.yml"

permissions:
  contents: write

jobs:
  publish-beta5:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare beta.5 source
        run: python scripts/prepare_beta5_daily_energy.py

      - name: Compile integration
        run: python -m compileall -q custom_components/tsun_local

      - name: Run complete unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate beta.5 source
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/tsun_local/manifest.json').read_text())
          assert manifest['version'] == '1.6.1-beta.5'
          protocol = Path('custom_components/tsun_local/protocols/protocol_1097.py').read_text()
          assert '_stabilize_daily_energy' not in protocol
          assert '_daily_reset_candidates' not in protocol
          sensor = Path('custom_components/tsun_local/sensor.py').read_text()
          assert 'DailyEnergyTracker' in sensor
          assert '_daily_reset_override' not in sensor
          PY

      - name: Commit beta.5 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/prepare_beta5_daily_energy.py
          git add custom_components/tsun_local/daily_energy.py
          git add custom_components/tsun_local/sensor.py
          git add custom_components/tsun_local/protocols/protocol_1097.py
          git add custom_components/tsun_local/manifest.json
          git add tests/test_daily_energy_tracker.py
          git add tests/test_energy_restore_contract.py
          git add tests/test_protocol_1097_resilience.py
          git add CHANGELOG.md
          git add docs/releases/1.6.1-beta.5.md
          git commit -m "[beta-release] Publish 1.6.1-beta.5 daily energy rollover fix"
          git push origin HEAD:beta-1097

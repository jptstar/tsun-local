name: Prepare 1.6.2 stable source

on:
  push:
    branches:
      - fix/1.6.2-energy-restore

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Run temporary 1.6.2 stabilization generator'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/1.6.2-energy-restore
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply 1.6.2 stabilization changes
        run: python scripts/_prepare_162_stable.py

      - name: Verify generated diff
        run: git diff --check

      - name: Commit generated source and remove temporary generator
        run: |
          rm scripts/_prepare_162_stable.py .github/workflows/prepare-162-stable-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix unit-safe energy restoration for 1.6.2'
          git push origin HEAD:fix/1.6.2-energy-restore

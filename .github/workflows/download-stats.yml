name: Download statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - ".github/workflows/download-stats.yml"
      - "tools/update_download_stats.py"

permissions:
  contents: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update download statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_download_stats.py

      - name: Commit updated statistics
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/stats/download-stats.csv \
            docs/stats/download-stats-summary.svg \
            docs/stats/download-stats-history.svg \
            docs/stats/download-stats-daily.svg

          if git diff --cached --quiet; then
            echo "No statistics change to commit."
            exit 0
          fi

          git commit -m "stats: update release download history"

          # The documentation can be edited independently while this workflow runs.
          # Rebase once before pushing so the generated statistics do not overwrite it.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

name: Prepare PLAY2 beta communication

on:
  push:
    branches:
      - beta-1097
    paths:
      - .github/workflows/prepare-play2-beta2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply PLAY2 validation and communication updates
        run: python .github/scripts/prepare_play2_beta2.py

      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v

      - name: Check patch formatting
        run: git diff --check

      - name: Commit prepared beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 1.5.3-beta.2 PLAY2 validation and clear-text alarms"
          git push origin HEAD:beta-1097

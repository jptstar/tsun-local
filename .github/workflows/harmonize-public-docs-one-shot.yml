name: Harmonize public documentation

on:
  push:
    branches:
      - docs/harmonize-public-docs-2026-09-08
    paths:
      - .github/workflows/harmonize-public-docs-one-shot.yml

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply documentation changes
        run: python scripts/harmonize_public_docs_one_shot.py
      - name: Run documentation tests
        run: python -m unittest tests.test_release_154_web tests.test_stable_151_localized_readmes -v
      - name: Commit generated documentation
        shell: bash
        run: |
          git diff --check
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add README.md docs tests/test_release_154_web.py tests/test_stable_151_localized_readmes.py
          git commit -m "Harmonize public docs and contributor credits"
          git push origin HEAD:docs/harmonize-public-docs-2026-09-08

name: Apply transparent TSUN Local brand assets

on:
  push:
    branches:
      - branding/transparent-tsun-local-assets
    paths:
      - .github/workflows/apply-transparent-brand-temp.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: branding/transparent-tsun-local-assets
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Make existing brand background transparent without redesign
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image
          import shutil

          root = Path('.')
          icon = root / 'custom_components/tsun_local/brand/icon.png'
          icon2x = root / 'custom_components/tsun_local/brand/icon@2x.png'

          def convert(path: Path) -> None:
              image = Image.open(path).convert('RGBA')
              pixels = image.load()
              width, height = image.size

              def eligible(x: int, y: int) -> bool:
                  r, g, b, _ = pixels[x, y]
                  return min(r, g, b) >= 215 and max(r, g, b) - min(r, g, b) <= 25

              seen: set[tuple[int, int]] = set()
              queue: deque[tuple[int, int]] = deque()
              for x in range(width):
                  for y in (0, height - 1):
                      if eligible(x, y) and (x, y) not in seen:
                          seen.add((x, y)); queue.append((x, y))
              for y in range(height):
                  for x in (0, width - 1):
                      if eligible(x, y) and (x, y) not in seen:
                          seen.add((x, y)); queue.append((x, y))

              while queue:
                  x, y = queue.popleft()
                  for nx, ny in ((x + 1, y), (x - 1, y), (x, y + 1), (x, y - 1)):
                      if 0 <= nx < width and 0 <= ny < height and (nx, ny) not in seen and eligible(nx, ny):
                          seen.add((nx, ny)); queue.append((nx, ny))

              if not seen:
                  raise SystemExit(f'No connected light background found in {path}')

              # Change alpha only. RGB artwork pixels remain untouched.
              for x, y in seen:
                  r, g, b, _ = pixels[x, y]
                  pixels[x, y] = (r, g, b, 0)

              image.save(path, format='PNG', optimize=True)

              check = Image.open(path).convert('RGBA')
              alphas = check.getchannel('A')
              extrema = alphas.getextrema()
              if extrema != (0, 255):
                  raise SystemExit(f'{path}: expected transparent and opaque pixels, got alpha extrema {extrema}')
              if check.getpixel((0, 0))[3] != 0:
                  raise SystemExit(f'{path}: corner background is not transparent')
              opaque_white = sum(1 for r, g, b, a in check.getdata() if a == 255 and r >= 245 and g >= 245 and b >= 245)
              if opaque_white < 10:
                  raise SystemExit(f'{path}: internal white logo details were unexpectedly removed')
              print(f'{path}: {check.size[0]}x{check.size[1]}, transparent background verified, opaque white detail pixels={opaque_white}')

          convert(icon)
          convert(icon2x)
          shutil.copyfile(icon, root / 'custom_components/tsun_local/brand/logo.png')
          shutil.copyfile(icon2x, root / 'custom_components/tsun_local/brand/logo@2x.png')
          shutil.copyfile(icon, root / 'docs/icon.png')
          PY

      - name: Verify all public brand copies are synchronized
        run: |
          set -euo pipefail
          cmp custom_components/tsun_local/brand/icon.png custom_components/tsun_local/brand/logo.png
          cmp custom_components/tsun_local/brand/icon@2x.png custom_components/tsun_local/brand/logo@2x.png
          cmp custom_components/tsun_local/brand/icon.png docs/icon.png

      - name: Commit converted assets and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-transparent-brand-temp.yml
          git config user.name "jptstar"
          git config user.email "dev@jptstar.com"
          git add custom_components/tsun_local/brand docs/icon.png .github/workflows/apply-transparent-brand-temp.yml
          git commit -m "Use transparent TSUN Local brand assets"
          git push origin HEAD:branding/transparent-tsun-local-assets

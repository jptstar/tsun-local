name: Publish beta.6 Wi-Fi freshness

on:
  push:
    branches:
      - beta-1097
    paths:
      - ".github/workflows/publish-beta6-wifi-freshness.yml"

permissions:
  contents: write

jobs:
  publish-beta6:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare beta.6 source
        run: python scripts/prepare_beta6_wifi_freshness.py

      - name: Compile integration
        run: python -m compileall -q custom_components/tsun_local

      - name: Run complete unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate beta.6 source
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/tsun_local/manifest.json').read_text())
          assert manifest['version'] == '1.6.1-beta.6'
          init_source = Path('custom_components/tsun_local/__init__.py').read_text()
          assert 'LoggerWifiSignalFreshness' in init_source
          assert 'async_remove_logger_metadata' in init_source
          assert 'updates["logger_wifi_signal"] = 0' not in init_source
          sensor = Path('custom_components/tsun_local/sensor.py').read_text()
          assert 'key == "logger_wifi_signal"' in sensor
          daily = Path('custom_components/tsun_local/daily_energy.py').read_text()
          assert 'DailyEnergyTracker' in daily
          PY

      - name: Commit beta.6 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/prepare_beta6_wifi_freshness.py
          git rm .github/workflows/publish-beta6-wifi-freshness.yml
          git add custom_components/tsun_local/logger_wifi_freshness.py
          git add custom_components/tsun_local/__init__.py
          git add custom_components/tsun_local/coordinator.py
          git add custom_components/tsun_local/sensor.py
          git add custom_components/tsun_local/manifest.json
          git add tests/test_logger_wifi_freshness.py
          git add CHANGELOG.md
          git add docs/releases/1.6.1-beta.6.md
          git commit -m "[beta-release] Publish 1.6.1-beta.6 Wi-Fi freshness fix"
          git push origin HEAD:beta-1097

          }

          for rel, replacement in sections.items():
              path = ROOT / rel
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'## 🔬[^\n]*\n.*?(?=\n### Sunology PLAY2\n)',
                  replacement.strip() + '\n',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'Could not replace diagnostic section in {rel}: {count}')
              path.write_text(updated, encoding='utf-8')

          # Tools README: keep the desktop documentation Windows-only.
          path = ROOT / 'tools/README.md'
          text = path.read_text(encoding='utf-8')
          replacement = f'''## Desktop diagnostic — Windows

          For users who prefer a guided interface, TSUN Local provides the Windows desktop diagnostic. It uses the shared [`tsun_diagnostic.py`](tsun_diagnostic.py) entry point and the same privacy-safe, **strictly read-only** `tsun_dump.py` engine.

          The application is published independently from Home Assistant integration releases under the stable rolling **`diagnostic-latest`** release. The historical Windows URL is deliberately unchanged so links in older posts continue to work.

          | Platform | Download | SHA-256 |
          |---|---|---|
          | Windows x86_64 | [TSUN-Local-Diagnostic.exe]({WINDOWS_URL}) | [checksum]({WINDOWS_SHA}) |

          ### Updates

          The Windows package keeps the existing verified in-place self-update flow and download URL. The Python dumper keeps its verified self-update behavior. Tester profile data is stored outside the executable so an application update does not remove the saved tester name or micro-inverter list.

          📋 [Desktop/direct-upload validation protocol](../docs/DIRECT_DIAGNOSTIC_UPLOAD_TEST.md)
'''
          text, count = re.subn(
              r'## Desktop diagnostic[^\n]*\n.*?(?=\n## Hardware validation dump\n)',
              replacement.strip() + '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not rewrite tools/README.md desktop section')
          path.write_text(text, encoding='utf-8')

          # Hardware dump guide: Windows desktop route + generic Python fallback.
          path = ROOT / 'docs/HARDWARE_DUMP.md'
          text = path.read_text(encoding='utf-8')
          replacement = f'''## ⬇️ Choose the easiest diagnostic

          ### Desktop application — Windows (recommended)

          The Windows **TSUN Local Diagnostic** uses the same privacy-safe, **strictly read-only** `tsun_dump.py` hardware engine; direct report upload is a separate HTTPS action performed only after explicit consent.

          | Platform | Download | SHA-256 |
          |---|---|---|
          | Windows x86_64 | [TSUN-Local-Diagnostic.exe]({WINDOWS_URL}) | [SHA-256]({WINDOWS_SHA}) |

          Current standalone diagnostic versions: **desktop GUI 1.5.12** · **dump engine 2.8.3**.

          The historical Windows URL and filename are intentionally unchanged so old forum posts, issue comments and documentation links stay valid.

          1. reproduce the problem and **do not reload TSUN Local first**;
          2. download the Home Assistant diagnostic when possible;
          3. **disable the affected TSUN Local config entry** so it does not compete for the logger connection;
          4. launch the Windows desktop diagnostic and run the capture;
          5. use **step 3 direct upload** after reviewing the explicit consent, or **step 4 manual e-mail** only as fallback;
          6. re-enable TSUN Local when the capture is finished.

          The direct-upload UI can remember the tester name/pseudonym and up to 10 selected micro-inverter models/quantities across application updates. The consent checkbox is never persisted. A successful upload returns a `TSL-...` receipt plus a private-token Worker link that lets the tester see exactly the anonymized report sent.

          For an upload-only test away from the installation, enter exactly:

          ```text
          Logger IP : 89:89:89:89
          Monitor SN: 89898989
          ```

          This dedicated synthetic mode explicitly records `test_mode: true` and `communication_attempted: false`; no logger or micro-inverter is contacted.

          📋 **[Desktop/direct-upload validation protocol](DIRECT_DIAGNOSTIC_UPLOAD_TEST.md)**
'''
          text, count = re.subn(
              r'## ⬇️ Choose the easiest diagnostic\n.*?(?=\n### Firmware-resilient logger web capture\n)',
              replacement.strip() + '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not rewrite HARDWARE_DUMP desktop section')
          text = text.replace('### Python / command-line alternative — all platforms', '### Python / command-line alternative')
          text = re.sub(
              r'\nmacOS / Linux:\n\n```bash\npython3 tsun_dump\.py --full\n```\n',
              '\n',
              text,
              count=1,
          )
          path.write_text(text, encoding='utf-8')

          # Validation protocol: Windows desktop package only.
          path = ROOT / 'docs/DIRECT_DIAGNOSTIC_UPLOAD_TEST.md'
          text = path.read_text(encoding='utf-8')
          text = text.replace('# TSUN Local Diagnostic — cross-platform validation protocol', '# TSUN Local Diagnostic — Windows validation protocol')
          scope = '''## Scope

          The shared Tk desktop interface is published for:

          - Windows x86_64 — `TSUN-Local-Diagnostic.exe`

          The desktop application uses the read-only diagnostic engine and the same user flow:

          1. **Disable TSUN Local** for the logger being tested.
          2. **Run the diagnostic**.
          3. **Direct report upload** — recommended, explicit consent required.
          4. **Manual e-mail report** — optional fallback only.

          The Python `tsun_dump.py` tool remains available for advanced/terminal use and must keep the same read-only behavior.
'''
          text, count = re.subn(r'## Scope\n.*?(?=\n## Stable download channel\n)', scope.strip() + '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not rewrite validation protocol scope')
          text = text.replace('All desktop packages and the Python dumper are published under the rolling `diagnostic-latest` release:', 'The Windows desktop package and the Python dumper are published under the rolling `diagnostic-latest` release:')
          text = re.sub(r'^- \[ \] macOS.*\n', '', text, flags=re.M)
          text = re.sub(r'^- \[ \] Linux.*\n', '', text, flags=re.M)
          text = text.replace('- [ ] `update.json` contains the `dump`, `windows_gui`, `macos_arm64_gui`, `macos_x86_64_gui`, `linux_x86_64_gui` and `linux_arm64_gui` components.', '- [ ] `update.json` contains the `dump` and `windows_gui` components required by the public diagnostic.')
          text = text.replace('Run these checks on each desktop platform when practical:', 'Run these checks on the Windows desktop application:')
          text = text.replace('the native file manager (Explorer / Finder / Linux desktop file manager)', 'the native file manager (Explorer)')
          text = re.sub(r'^- macOS:.*\n', '', text, flags=re.M)
          text = re.sub(r'^- Linux:.*\n', '', text, flags=re.M)
          platform = '''## Windows release checks

          - [ ] Existing `TSUN-Local-Diagnostic.exe` download URL remains unchanged.
          - [ ] Verified in-place update replaces only the executable after SHA-256 validation.
          - [ ] Persisted tester configuration is not removed by an update.
'''
          text, count = re.subn(r'## Platform-specific release checks\n.*?(?=\n## Regression rule\n)', platform.strip() + '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not rewrite platform-specific validation checks')
          text = text.replace('on all supported desktop platforms', 'in the Windows desktop application')
          path.write_text(text, encoding='utf-8')

          # Public homepage: remove the packaged Mac/Linux card and make Python wording platform-neutral.
          path = ROOT / 'docs/index.html'
          text = path.read_text(encoding='utf-8')
          text = text.replace('One script for Windows, macOS and Linux, with clear terminal commands.', 'One script with clear terminal commands and the same read-only capture engine.')
          text, count = re.subn(
              r'\n\s*<a class="card" style="display:block;color:inherit;text-decoration:none" href="test-your-inverter\.html#mac-linux"><strong>Mac &amp; Linux diagnostic →</strong><span class="muted">.*?</span></a>',
              '',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not remove Mac/Linux card from docs/index.html')
          path.write_text(text, encoding='utf-8')

          # Public diagnostic page: Windows desktop + Python, with all packaged Mac/Linux material removed.
          path = ROOT / 'docs/test-your-inverter.html'
          text = path.read_text(encoding='utf-8')
          replacements = {
              'content="Test whether your TSUN microinverter works locally with Home Assistant using the same TSUN Local Diagnostic interface on Windows, macOS, Linux or directly with Python."': 'content="Test whether your TSUN microinverter works locally with Home Assistant using the read-only TSUN Local Diagnostic for Windows or the Python diagnostic."',
              'content="Use the read-only TSUN Local Diagnostic on Windows, macOS, Linux or directly with Python and optionally upload an anonymized hardware report after explicit consent."': 'content="Use the read-only TSUN Local Diagnostic on Windows or the Python diagnostic and optionally upload an anonymized hardware report after explicit consent."',
              'content="Read-only TSUN Local Diagnostic for Windows, macOS, Linux and Python."': 'content="Read-only TSUN Local Diagnostic for Windows and Python."',
              'Run tsun_dump.py with Python 3.10+ or launch the TSUN Local Diagnostic desktop package for Windows, macOS or Linux.': 'Run tsun_dump.py with Python 3.10+ or launch the TSUN Local Diagnostic desktop package for Windows.',
              '<p class="lead"><strong>Not listed yet, or communication unstable?</strong> Start with the Windows app, use Python on any platform, or choose the packaged Mac/Linux app.</p>': '<p class="lead"><strong>Not listed yet, or communication unstable?</strong> Start with the Windows app or use the Python alternative.</p>',
              '<p class="hero-note">Windows · Python 3.10+ · macOS &amp; Linux · Strictly read-only</p>': '<p class="hero-note">Windows · Python 3.10+ · Strictly read-only</p>',
              '<h2>Python diagnostic — all platforms</h2>': '<h2>Python diagnostic</h2>',
              '<p class="intro">Prefer the terminal? Download <code>tsun_dump.py</code> and run it with Python 3.10+ on Windows, macOS or Linux.</p>': '<p class="intro">Prefer the terminal? Download <code>tsun_dump.py</code> and run it with Python 3.10+.</p>',
              '<div class="command-card"><strong>macOS / Linux</strong><pre><code>python3 tsun_dump.py --full</code></pre></div>': '',
              '<p>On Windows, replace <code>python3</code> with <code>py</code> in the commands above.</p>': '<p>On Windows, <code>py</code> is the recommended command prefix.</p>',
              '<div class="step"><span class="n">2</span><strong>Run the diagnostic</strong><p>Use Windows, Python, Mac or Linux. Discovery and evidence capture remain read-only.</p></div>': '<div class="step"><span class="n">2</span><strong>Run the diagnostic</strong><p>Use the Windows app or the Python alternative. Discovery and evidence capture remain read-only.</p></div>',
              '"dateModified":"2026-09-08"': '"dateModified":"2026-09-17"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected diagnostic-page text: {old[:80]}')
              text = text.replace(old, new, 1)
          text, count = re.subn(r'\n\s*<section id="mac-linux">.*?</section>\n', '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not remove Mac/Linux section from diagnostic page')
          text = re.sub(r'\n\s*\.mac-warning\{[^\n]*\}\n\s*\.mac-warning strong\{[^\n]*\}\n?', '\n', text, count=1)
          path.write_text(text, encoding='utf-8')

          # Tests must enforce that the public site no longer exposes those options.
          path = ROOT / 'tests/test_metadata.py'
          text = path.read_text(encoding='utf-8')
          old = "        self.assertIn('Mac &amp; Linux diagnostic →', index)"
          new = "        self.assertNotIn('Mac &amp; Linux diagnostic →', index)\n        self.assertNotIn('test-your-inverter.html#mac-linux', index)"
          if old not in text:
              raise SystemExit('Expected metadata assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = ROOT / 'tests/test_release_154_web.py'
          text = path.read_text(encoding='utf-8')
          old = '        self.assertIn("test-your-inverter.html#mac-linux", text)'
          new = '        self.assertNotIn("test-your-inverter.html#mac-linux", text)'
          if old not in text:
              raise SystemExit('Expected web assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Obsolete documentation-generation helpers would reintroduce the removed material.
          for rel in (
              'docs/MACOS_SIGNING.md',
              'scripts/clarify_macos_diagnostic_docs.py',
              'scripts/publish_macos_first_launch_docs.py',
              'scripts/sync_diagnostic_docs.py',
          ):
              p = ROOT / rel
              if p.exists():
                  p.unlink()

          # Guard the exact public surfaces requested by the project maintainer.
          public_paths = [
              ROOT / 'README.md',
              *sorted((ROOT / 'docs').glob('README_*.md')),
              ROOT / 'tools/README.md',
              ROOT / 'docs/HARDWARE_DUMP.md',
              ROOT / 'docs/DIRECT_DIAGNOSTIC_UPLOAD_TEST.md',
              ROOT / 'docs/index.html',
              ROOT / 'docs/test-your-inverter.html',
          ]
          forbidden = (
              'TSUN-Local-Diagnostic-macOS',
              'TSUN-Local-Diagnostic-Linux',
              'Mac &amp; Linux diagnostic',
              'test-your-inverter.html#mac-linux',
              'macOS',
              'Linux x86_64',
              'Linux arm64',
          )
          for p in public_paths:
              value = p.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in value:
                      raise SystemExit(f'{p}: forbidden public diagnostic reference remains: {token}')
          PY

      - name: Run documentation regression tests
        run: |
          python -m unittest tests.test_metadata tests.test_release_154_web -v

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-mac-linux-diagnostics.yml
          git add README.md docs tools/README.md tests/test_metadata.py tests/test_release_154_web.py
          git commit -m "docs: keep public diagnostics Windows-only"
          git push

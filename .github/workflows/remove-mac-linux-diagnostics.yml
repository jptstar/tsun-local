name: Remove obsolete Mac and Linux diagnostic documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-mac-linux-diagnostics.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: remove mac/linux diagnostic docs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove Mac and Linux diagnostic references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          WINDOWS_URL = 'https://github.com/jptstar/tsun-local/releases/download/diagnostic-latest/TSUN-Local-Diagnostic.exe'
          WINDOWS_SHA = WINDOWS_URL + '.sha256'
          RELEASE_URL = 'https://github.com/jptstar/tsun-local/releases/tag/diagnostic-latest'
          DUMP_URL = 'https://github.com/jptstar/tsun-local/releases/download/diagnostic-latest/tsun_dump.py'
          DUMP_SHA = DUMP_URL + '.sha256'

          sections = {
              'README.md': f'''## 🔬 Validate another TSUN model

          TSUN Local provides a privacy-safe, **strictly read-only** desktop diagnostic for unlisted models and communication issues.

          ### Desktop app — Windows

          | Platform | Download | SHA-256 |
          |---|---|---|
          | **Windows x86_64** | **[TSUN-Local-Diagnostic.exe]({WINDOWS_URL})** | [checksum]({WINDOWS_SHA}) |

          **Current public diagnostic versions:** desktop GUI **1.5.12** · dump engine **2.8.3**.

          > [!IMPORTANT]
          > The rolling tag and historical Windows asset name are deliberately preserved. The existing `.../diagnostic-latest/TSUN-Local-Diagnostic.exe` link used in older posts continues to point to the latest Windows diagnostic.

          The Windows desktop interface uses the same **1 → 2 → 3 → 4** flow:

          1. **Disable TSUN Local** for the affected logger.
          2. **Run the diagnostic**.
          3. **Direct report upload** — recommended; explicit consent is mandatory.
          4. **Manual e-mail report** — optional fallback only.

          The direct-upload dialog can remember the tester name/pseudonym and up to 10 searchable micro-inverter model/quantity rows across application updates. The consent checkbox is never remembered. After a successful upload, the application shows the `TSL-...` receipt plus a private-token **Open report** link so the tester can see exactly the anonymized JSON that was submitted.

          For an upload-only test away from the installation, the dedicated synthetic mode uses `89:89:89:89` as logger IP and `89898989` as Monitor SN. This mode explicitly records that no logger or micro-inverter communication was attempted.

          **📦 [Open the rolling diagnostic release]({RELEASE_URL})** · 📚 **[Hardware Validation Dump Tool guide](docs/HARDWARE_DUMP.md)** · 📋 **[Desktop/direct-upload validation protocol](docs/DIRECT_DIAGNOSTIC_UPLOAD_TEST.md)** · 🌐 **[Public test page](https://jptstar.github.io/tsun-local/test-your-inverter.html)**

          ### Python / command-line alternative

          **⬇️ [Download `tsun_dump.py`]({DUMP_URL})** — Python 3.10+.  
          **🔐 [SHA-256 checksum]({DUMP_SHA})**

          ```powershell
          py tsun_dump.py --full
          ```

          The standalone dumper checks the same `diagnostic-latest` channel, verifies SHA-256 before replacement and keeps `--check-update` / `--no-update` controls.
''',
              'docs/README_FR.md': f'''## 🔬 Valider un autre modèle TSUN


name: Remove obsolete Mac and Linux diagnostic documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-mac-linux-diagnostics.yml
      - scripts/_cleanup_public_diagnostic_docs.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python scripts/_cleanup_public_diagnostic_docs.py
      - name: Run documentation regression tests
        run: python -m unittest tests.test_metadata tests.test_release_154_web -v
      - name: Commit cleanup
        run: |
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: remove Mac and Linux diagnostic references"
          git push

name: Publish TSUN Local beta 2

on:
  push:
    branches:
      - automation/publish-1.6.2-beta.2
    paths:
      - .github/workflows/publish-beta2-temp.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build clean beta branch from main
        run: |
          set -euo pipefail
          cp scripts/publish_beta2_temp.py /tmp/publish_beta2_temp.py
          git fetch origin main --tags
          git checkout --detach b45eef0eaee44052be59a1102fc27de1d1eb8e81
          python3 /tmp/publish_beta2_temp.py
          git config user.name jptstar
          git config user.email dev@jptstar.com
          git add custom_components/tsun_local/manifest.json CHANGELOG.md docs/releases/1.6.2-beta.2.md
          git commit -m "[beta-release] Publish TSUN Local 1.6.2-beta.2"
          git push --force origin HEAD:beta-1097

name: Finalize 1.5.1

on:
  push:
    branches:
      - beta-1097

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[finalize-151]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate stable 1.5.1 source
        run: python3 .github/scripts/finalize_151.py

      - name: Check generated diff
        run: git diff --check

      - name: Run complete unit-test suite
        run: python -m unittest discover -s tests -v

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

      - name: Commit stable 1.5.1 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/finalize_151.py .github/workflows/finalize-151.yml .github/finalize-151-trigger.txt
          git add -A
          git commit -m "Prepare TSUN Local 1.5.1 stable candidate"
          git push origin HEAD:beta-1097

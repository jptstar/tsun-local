name: Patch Windows update visibility

on:
  push:
    branches:
      - fix/windows-update-visibility

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[windows-update-visibility]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply GUI patch
        run: python .github/scripts/patch_windows_update_visibility.py
      - name: Syntax check
        run: python -m py_compile tools/tsun_diagnostic_gui.py
      - name: Run unit suite
        run: python -m unittest discover -s tests -v
      - name: Commit result and remove one-shot patcher
        run: |
          rm .github/workflows/windows-update-visibility-patch.yml
          rm .github/scripts/patch_windows_update_visibility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tsun_diagnostic_gui.py .github/workflows/windows-update-visibility-patch.yml .github/scripts/patch_windows_update_visibility.py
          git commit -m "Make Windows update progress visible"
          git push

name: Apply protocol detection 1.6.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-protocol-detection-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/1.6.2-protocol-detection
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply detection and reconfiguration changes
        run: |
          python tools/_apply_detection_162.py
          python tools/_patch_detection_test_stub.py

      - name: Remove temporary helpers
        run: rm tools/_apply_detection_162.py tools/_patch_detection_test_stub.py

      - name: Validate syntax and complete unit-test suite
        run: |
          python -m compileall -q custom_components/tsun_local tests
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check

      - name: Commit verified branch
        run: |
          set -euo pipefail
          git config user.name "JP"
          git config user.email "dev@jptstar.com"
          git add -A
          git commit -m "Add fail-safe protocol detection and reconfiguration"
          git push origin HEAD:feature/1.6.2-protocol-detection

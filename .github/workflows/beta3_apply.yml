name: Apply beta.3

on:
  push:
    branches:
      - beta3-work
    paths:
      - ".github/beta3_apply.py.gz.b64"
      - ".github/workflows/beta3_apply.yml"

permissions:
  contents: write

jobs:
  beta3:
    name: Build and publish beta.3
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta3-work

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply beta.3 patch
        run: base64 -d .github/beta3_apply.py.gz.b64 | gzip -d > /tmp/beta3_apply.py && python3 /tmp/beta3_apply.py

      - name: Apply beta.3 follow-up fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_flow = Path("tests/test_config_flow_continuation.py")
          text = test_flow.read_text(encoding="utf-8")
          needle = '        DEFAULT_PROTOCOL="auto",\n        create_protocol_client=lambda *args: None,'
          replacement = (
              '        DEFAULT_PROTOCOL="auto",\n'
              '        SUPPORTED_PROTOCOLS=("1511", "1097", "02b0"),\n'
              '        protocol_from_firmware=lambda firmware: next(\n'
              '            (protocol for protocol in ("1511", "1097", "02b0") if protocol in str(firmware).lower()),\n'
              '            None,\n'
              '        ),\n'
              '        create_protocol_client=lambda *args: None,'
          )
          if needle not in text:
              raise SystemExit("config-flow protocol test stub not found")
          text = text.replace(needle, replacement, 1)
          text = text.replace('firmware_version="LSW_TEST_1.0"', 'firmware_version="LSW_TEST_1511_1.0"', 1)
          text = text.replace(
              'result["data"]["logger_firmware_version"], "LSW_TEST_1.0"',
              'result["data"]["logger_firmware_version"], "LSW_TEST_1511_1.0"',
              1,
          )
          needle = '''                        logger_sn=1234567890,
                        inverter_serial_number=None,
                        firmware_version=None,
                        mac_address=None,'''
          replacement = '''                        logger_sn=1234567890,
                        inverter_serial_number=None,
                        firmware_version="LSW_TEST_1511_1.0",
                        mac_address=None,'''
          if needle not in text:
              raise SystemExit("invalid-response logger fixture not found")
          text = text.replace(needle, replacement, 1)
          test_flow.write_text(text, encoding="utf-8")

          test_protocols = Path("tests/test_protocols.py")
          text = test_protocols.read_text(encoding="utf-8")
          needle = '            if protocol_name == "1511":\n                return FakeClient("1511", False)'
          replacement = '            if protocol_name in {"1511", "1097"}:\n                return FakeClient(protocol_name, False)'
          if needle not in text:
              raise SystemExit("automatic protocol test factory not found")
          text = text.replace(needle, replacement, 1)
          expected = 'self.assertEqual(attempts, ["1511", "02b0"])'
          if expected not in text:
              raise SystemExit("automatic protocol test assertion not found")
          text = text.replace(
              expected,
              'self.assertEqual(attempts, ["1511", "1097", "02b0"])',
              1,
          )
          test_protocols.write_text(text, encoding="utf-8")

          for path in [Path("README.md"), *sorted(Path("docs").glob("README_*.md"))]:
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace("1.3.3", "1.4.0-beta.3"), encoding="utf-8")
          PY

      - name: Compile Python sources
        run: python3 -m compileall -q custom_components tests

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit beta.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v1.4.0-beta.3"
          git push origin HEAD:beta3-work HEAD:beta-1097

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.4.0-beta.3"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            --target beta-1097 \
            --prerelease \
            --title "$tag" \
            --notes "Firmware-guided TSUN protocol detection, strict automatic discovery to avoid unrelated Solarman devices, controlled manual probing, progressive 1511/1097 PV detection, and richer privacy-safe diagnostics."

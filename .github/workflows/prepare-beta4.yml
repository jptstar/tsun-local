name: Prepare beta4

on:
  push:
    branches:
      - beta-1097

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run beta4 preparation')
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v6
        with:
          ref: beta-1097
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply beta4 preparation
        run: python3 .github/scripts/prepare_beta4.py

      - name: Check generated diff
        run: git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Commit prepared beta4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/prepare_beta4.py .github/workflows/prepare-beta4.yml
          git add -A
          git commit -m "Prepare TSUN Local 1.5.1-beta.4"
          git push origin HEAD:beta-1097

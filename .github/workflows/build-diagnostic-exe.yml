name: Build desktop diagnostic packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/tsun_dump.py"
      - "tools/tsun_diagnostic_gui.py"
      - "tools/tsun_diagnostic_app.py"
      - "tools/tsun_diagnostic_desktop.py"
      - "tools/tsun_diagnostic_profile.py"
      - "tools/tsun_diagnostic_reports.py"
      - "tools/tsun_diagnostic.py"
      - "tools/tsun_diagnostic_runtime.py"
      - "tools/tsun_diagnostic_version.py"
      - "tools/tsun_1097_research_probe.py"
      - "tools/tsun_1097_transport_extension.py"
      - "tools/tsun_report_upload.py"
      - "tools/tsun_report_model_assignment.py"
      - "tools/tsun_tuya_probe.py"
      - "tests/test_diagnostic_*.py"
      - ".github/workflows/build-diagnostic-exe.yml"
  push:
    branches:
      - main
    paths:
      - "tools/tsun_dump.py"
      - "tools/tsun_diagnostic_gui.py"
      - "tools/tsun_diagnostic_app.py"
      - "tools/tsun_diagnostic_desktop.py"
      - "tools/tsun_diagnostic_profile.py"
      - "tools/tsun_diagnostic_reports.py"
      - "tools/tsun_diagnostic.py"
      - "tools/tsun_diagnostic_runtime.py"
      - "tools/tsun_diagnostic_version.py"
      - "tools/tsun_1097_research_probe.py"
      - "tools/tsun_1097_transport_extension.py"
      - "tools/tsun_report_upload.py"
      - "tools/tsun_report_model_assignment.py"
      - "tools/tsun_tuya_probe.py"
      - "tests/test_diagnostic_*.py"
      - ".github/workflows/build-diagnostic-exe.yml"

permissions:
  contents: write

concurrency:
  group: windows-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and Tuya diagnostic backend
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller tinytuya==1.20.0

      - name: Validate shared diagnostic sources
        shell: pwsh
        run: |
          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic_gui.py tools/tsun_report_upload.py tools/tsun_report_model_assignment.py tools/tsun_tuya_probe.py tools/tsun_1097_research_probe.py tools/tsun_1097_transport_extension.py tools/tsun_diagnostic_runtime.py tools/tsun_diagnostic_version.py tools/tsun_diagnostic_app.py tools/tsun_diagnostic_desktop.py tools/tsun_diagnostic_profile.py tools/tsun_diagnostic_reports.py tools/tsun_diagnostic.py
          python -c "import sys; sys.path.insert(0, 'tools'); import tinytuya, tsun_dump, tsun_diagnostic as gui, tsun_diagnostic_runtime as runtime; assert hasattr(tsun_dump, 'main'); assert runtime.pipeline_stage_names() == ('1097-research-fallback','1097-transport-enrichment','tuya-authenticated-status'); print('tsun_dump', tsun_dump.TOOL_VERSION, 'GUI', gui.APP_VERSION, 'TinyTuya', getattr(tinytuya, '__version__', '?'))"
          python -m unittest tests.test_diagnostic_python_parity -v

      - name: Build Windows portable executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name TSUN-Local-Diagnostic `
            --paths tools `
            --collect-all tinytuya `
            tools/tsun_diagnostic.py

      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/TSUN-Local-Diagnostic.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--no-update" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Executable exited unexpectedly during startup smoke test (exit code $($process.ExitCode))"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Windows GUI launched successfully."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-windows-x86_64
          path: dist/TSUN-Local-Diagnostic.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish rolling Windows diagnostic
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: diagnostic-windows-x86_64
          path: release

      - name: Create checksums and base update manifest
        shell: bash
        run: |
          set -euo pipefail
          cp tools/tsun_dump.py release/tsun_dump.py
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools")
          import tsun_dump
          import tsun_diagnostic as gui

          release = Path("release")
          assets = {
              "dump": ("tsun_dump.py", tsun_dump.TOOL_VERSION),
              "windows_gui": (gui.ASSET_WINDOWS, gui.APP_VERSION),
          }
          components = {}
          for component, (asset, version) in assets.items():
              path = release / asset
              if not path.is_file():
                  raise SystemExit(f"Missing required release asset: {asset}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              (release / f"{asset}.sha256").write_text(
                  f"{digest}  {asset}\n", encoding="ascii"
              )
              components[component] = {
                  "version": version,
                  "asset": asset,
                  "sha256": digest,
              }

          manifest = {
              "schema_version": 1,
              "channel": "diagnostic-latest",
              "build_commit": os.environ["GITHUB_SHA"],
              "components": components,
          }
          (release / "update.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish Windows diagnostic and remove retired platform binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="diagnostic-latest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          notes='Rolling prerelease for TSUN Local Diagnostic. Two supported distributions are maintained at feature parity: the Windows x86_64 executable and the full Python package. Linux users should use the Python package. Dedicated macOS and Linux binaries are no longer published. The historical single-file tsun_dump.py remains available only for compatibility.'

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$tag" --title "TSUN Local Diagnostic — latest" --notes "$notes" --prerelease --repo "${{ github.repository }}"
          else
            gh release create "$tag" --verify-tag --title "TSUN Local Diagnostic — latest" --notes "$notes" --prerelease --repo "${{ github.repository }}"
          fi

          for asset in \
            TSUN-Local-Diagnostic-macOS-arm64.zip \
            TSUN-Local-Diagnostic-macOS-arm64.zip.sha256 \
            TSUN-Local-Diagnostic-macOS-x86_64.zip \
            TSUN-Local-Diagnostic-macOS-x86_64.zip.sha256 \
            TSUN-Local-Diagnostic-Linux-x86_64 \
            TSUN-Local-Diagnostic-Linux-x86_64.sha256 \
            TSUN-Local-Diagnostic-Linux-arm64 \
            TSUN-Local-Diagnostic-Linux-arm64.sha256; do
            gh release delete-asset "$tag" "$asset" -y --repo "${{ github.repository }}" 2>/dev/null || true
          done

          gh release upload "$tag" release/* --clobber --repo "${{ github.repository }}"
          echo "Published Windows diagnostic base release; full Python package is added by the parity workflow."

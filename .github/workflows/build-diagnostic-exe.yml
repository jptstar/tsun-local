name: Build Windows diagnostic executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/tsun_dump.py"
      - "tools/tsun_diagnostic_gui.py"
      - ".github/workflows/build-diagnostic-exe.yml"
  push:
    branches:
      - main
    paths:
      - "tools/tsun_dump.py"
      - "tools/tsun_diagnostic_gui.py"
      - ".github/workflows/build-diagnostic-exe.yml"

permissions:
  contents: write

concurrency:
  group: windows-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Validate sources
        shell: pwsh
        run: |
          python -m py_compile tools/tsun_dump.py tools/tsun_diagnostic_gui.py
          python -c "import sys; sys.path.insert(0, 'tools'); import tsun_dump, tsun_diagnostic_gui; assert hasattr(tsun_dump, 'main'); print('tsun_dump', tsun_dump.TOOL_VERSION, 'GUI', tsun_diagnostic_gui.APP_VERSION)"

      - name: Build portable executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name TSUN-Local-Diagnostic `
            --paths tools `
            tools/tsun_diagnostic_gui.py

      - name: Smoke-test executable launch
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/TSUN-Local-Diagnostic.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Executable exited unexpectedly during startup smoke test (exit code $($process.ExitCode))"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Executable launched successfully and remained running for the smoke-test window."

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "dist/TSUN-Local-Diagnostic.exe"
          if (!(Test-Path $exe)) {
            throw "Executable was not created"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  TSUN-Local-Diagnostic.exe" | Set-Content -Encoding ascii "dist/TSUN-Local-Diagnostic.exe.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSUN-Local-Diagnostic-Windows
          path: |
            dist/TSUN-Local-Diagnostic.exe
            dist/TSUN-Local-Diagnostic.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish dedicated diagnostic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "diagnostic-latest"

          # Keep the rolling diagnostic tag on the exact source revision used for this build.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag $env:GITHUB_SHA
          git push --force origin "refs/tags/$tag"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --verify-tag `
              --title "TSUN Local Diagnostic — latest" `
              --notes "Rolling prerelease for the standalone TSUN Local read-only diagnostic tool. Assets are rebuilt and smoke-tested independently of Home Assistant integration releases." `
              --prerelease `
              --repo "${{ github.repository }}"
          }

          gh release upload $tag `
            "dist/TSUN-Local-Diagnostic.exe" `
            "dist/TSUN-Local-Diagnostic.exe.sha256" `
            --clobber `
            --repo "${{ github.repository }}"

          Write-Host "Published Windows diagnostic assets to the dedicated $tag release."
